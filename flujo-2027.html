<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flujo 2027 - Fideicomiso VBC-RD</title>
    <meta name="view-transition" content="same-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ============ VARIABLES (oscuro por defecto, igual que css/styles.css) ============ */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-2: #172033;
            --line: rgba(255, 255, 255, 0.1);
            --line-soft: rgba(255, 255, 255, 0.05);
            --tx: #f1f5f9;
            --tx2: #94a3b8;
            --mut: #64748b;
            --pri: #00a8ff;
            --pri-soft: rgba(0, 168, 255, 0.15);
            --pri-line: rgba(0, 168, 255, 0.45);
            --ok: #10b981;
            --bad: #f87171;
            --warn-tx: #fbbf24;
            --track: #0f172a;
            --map-bg: #0b1220;
            --lot-neutral: #1e293b;
            --lot-stroke: #0b1220;
            --dxf-line: #475569;
            --sc-on-bg: #f1f5f9;
            --sc-on-tx: #0f172a;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            --chart-line: #e2e8f0;
            --chart-grid: rgba(255, 255, 255, 0.06);
            --chart-base: #475569;
            /* Colores de datos: una familia por entidad en el mapa, los gráficos y las tablas (validados con la
               paleta de referencia: CVD y visión normal, todos los pares en el mapa). Pasos para fondo oscuro. */
            --c-vendidos: #3987e5;   /* lotes vendidos que pagan: cartera y LIC 2026-01 */
            --c-version: #199e70;    /* lotes que se licitan en la versión elegida */
            --c-obra: #d95926;       /* obra: cubicaciones, retenidos, mantenimiento, complementarias */
            --c-noobra: #9085e9;     /* no-obra: gastos fijos y obligaciones */
            --c-compras: #d55181;    /* compras nuevas de las áreas (techo) */
            --c-stgo: #c98500;       /* reserva para Santiago */
            --c-otros: #898781;      /* intereses y otros / sin asignar */
            --c-legal: #64748b;      /* lote en gestión legal (gris + insignia «!») */
            --div-pos: #3987e5;
            --div-neg: #e66767;
            --div-mid: #383835;
            /* Estado (reservados; siempre con ícono y texto) */
            --st-good: #0ca30c;
            --st-warn: #fab219;
            --st-crit: #d03b3b;
        }

        body.light-mode {
            --bg: #f1f5f9;
            --card: #ffffff;
            --card-2: #f8fafc;
            --line: #e2e8f0;
            --line-soft: #f1f5f9;
            --tx: #0f172a;
            --tx2: #475569;
            --mut: #94a3b8;
            --pri: #0066cc;
            --pri-soft: #e0efff;
            --pri-line: #b6d7ff;
            --ok: #059669;
            --bad: #dc2626;
            --warn-tx: #b45309;
            --track: #f1f5f9;
            --map-bg: #f8fafc;
            --lot-neutral: #e9edf2;
            --lot-stroke: #ffffff;
            --dxf-line: #94a3b8;
            --sc-on-bg: #0f172a;
            --sc-on-tx: #ffffff;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
            --chart-line: #0f172a;
            --chart-grid: #eef2f6;
            --chart-base: #c3c2b7;
            --c-vendidos: #2a78d6;
            --c-version: #1baf7a;
            --c-obra: #eb6834;
            --c-noobra: #6250d6;
            --c-compras: #e87ba4;
            --c-stgo: #eda100;
            --c-otros: #898781;
            --c-legal: #94a3b8;
            --div-pos: #2a78d6;
            --div-neg: #e34948;
            --div-mid: #f0efec;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            font-size: 13px;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        button { font-family: inherit; }

        /* ============ HEADER ============ */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-box {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, #0066cc, #00a8ff);
            display: grid; place-items: center; font-size: 20px;
        }
        .logo h1 { font-size: 14px; line-height: 1.15; }
        .logo p { font-size: 10px; color: var(--mut); }

        .header-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
        .header-nav a {
            padding: 8px 12px; border-radius: 8px; color: var(--tx2); text-decoration: none;
            font-weight: 600; font-size: 12px; border: 1px solid transparent; white-space: nowrap;
        }
        .header-nav a:hover { background: var(--pri-soft); color: var(--pri); }
        .header-nav a.active { background: var(--pri-soft); color: var(--pri); border-color: var(--pri-line); }
        .header-nav a.new::after {
            content: 'NUEVO'; font-size: 8px; background: var(--pri); color: #fff;
            border-radius: 4px; padding: 1px 4px; margin-left: 6px; vertical-align: 2px;
        }

        .acts { display: flex; gap: 8px; }
        .btn {
            border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px;
            font-weight: 600; font-size: 12px; color: var(--tx2); cursor: pointer; white-space: nowrap;
        }
        .btn:hover { border-color: var(--pri-line); color: var(--pri); }
        .btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); }
        .btn.pri:hover { filter: brightness(1.08); color: #fff; }
        .btn:disabled { opacity: .45; cursor: default; }
        .btn:disabled:hover { border-color: var(--line); color: var(--tx2); }

        /* ============ PESTAÑAS ============ */
        .tabs { display: flex; gap: 2px; padding: 10px 20px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
        .tabs button {
            padding: 9px 14px; border: 0; background: none; color: var(--tx2); font-weight: 700; font-size: 13px;
            border-bottom: 2px solid transparent; margin-bottom: -1px; cursor: pointer; white-space: nowrap;
        }
        .tabs button:hover { color: var(--tx); }
        .tabs button.on { color: var(--pri); border-bottom-color: var(--pri); }

        /* Barra de selección / filtros activos */
        .selbar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 20px 12px; padding: 8px 12px;
            background: var(--pri-soft); border: 1px solid var(--pri-line); border-radius: 10px; font-size: 12px; color: var(--tx2);
        }
        .selbar[hidden] { display: none; }
        .selbar b { color: var(--tx); }
        .selbar .chip {
            display: inline-flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line);
            border-radius: 20px; padding: 2px 3px 2px 9px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--tx);
        }
        .selbar .chip button { border: 0; background: none; color: var(--mut); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
        .selbar .chip button:hover { color: var(--bad); }
        .selbar .btn { margin-left: auto; padding: 5px 10px; }

        /* ============ TOOLBAR ============ */
        .toolbar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
        .grupo { display: flex; align-items: center; gap: 8px; }
        .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
        .seg button {
            padding: 7px 14px; border-radius: 7px; font-size: 12px; color: var(--tx2); font-weight: 600;
            border: 0; background: none; cursor: pointer; white-space: nowrap;
        }
        .seg button:hover { color: var(--tx); }
        .seg button.on { background: var(--pri); color: #fff; box-shadow: 0 2px 6px rgba(0, 102, 204, 0.3); }
        .seg.sc button.on { background: var(--sc-on-bg); color: var(--sc-on-tx); box-shadow: none; }
        .seg.ver button { min-width: 34px; padding: 7px 9px; font-family: 'JetBrains Mono', monospace; font-weight: 700; }
        .seg.ver button.base::after { content: '★'; font-size: 9px; margin-left: 2px; vertical-align: 4px; }
        .seg button:disabled { opacity: .35; cursor: default; }
        .seg.mini { padding: 2px; border-radius: 8px; }
        .seg.mini button { padding: 4px 9px; font-size: 11px; border-radius: 6px; }
        .lbl { font-size: 10px; font-weight: 700; color: var(--mut); letter-spacing: .06em; text-transform: uppercase; }
        .verhint { font-size: 10px; color: var(--mut); line-height: 1.25; max-width: 92px; }
        .stamp { margin-left: auto; font-size: 11px; color: var(--mut); text-align: right; line-height: 1.5; }
        .stamp b { color: var(--tx2); }
        [data-solo][hidden] { display: none !important; }

        /* ============ TARJETA DE LA VERSIÓN ============ */
        .vcard {
            margin: 0 20px 12px; display: grid; grid-template-columns: minmax(220px, auto) 1fr; gap: 18px; align-items: center;
            background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 16px;
        }
        .vcard[hidden] { display: none; }
        .vtit { display: flex; align-items: center; gap: 12px; }
        .vnum {
            width: 42px; height: 42px; border-radius: 11px; background: var(--pri-soft); color: var(--pri); flex: none;
            display: grid; place-items: center; font: 800 20px 'JetBrains Mono', monospace;
        }
        .vtit b { font-size: 15px; display: block; }
        .vtit p { font-size: 11px; color: var(--mut); margin-top: 2px; }
        .vtit .star { font-size: 10px; font-weight: 700; color: var(--pri); background: var(--pri-soft); border-radius: 20px; padding: 2px 7px; margin-left: 6px; vertical-align: 2px; }
        .vfacts { display: grid; grid-template-columns: 1.4fr .8fr 1fr 1.2fr; gap: 8px 18px; }
        .vfacts span { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: .05em; color: var(--mut); font-weight: 700; }
        .vfacts b { font-size: 12.5px; font-weight: 600; line-height: 1.35; display: block; margin-top: 2px; }

        /* ============ KPIs (caja del Fideicomiso) ============ */
        .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)) repeat(2, minmax(0, 1.3fr)); gap: 12px; padding: 0 20px 12px; }
        .k { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
        .k h4 { font-size: 11px; color: var(--tx2); font-weight: 600; }
        .k .v { font-size: 26px; font-weight: 700; margin-top: 6px; letter-spacing: -.01em; }
        .k .v small { font-size: 12px; color: var(--mut); font-weight: 500; }
        .k p { font-size: 11px; color: var(--mut); margin-top: 4px; line-height: 1.4; }
        .k p b { color: var(--tx2); font-weight: 600; }
        .neg { color: var(--bad); }
        .pos { color: var(--ok); }
        .warnv { color: var(--warn-tx); }
        .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; vertical-align: 0; margin-right: 3px; }
        .stack { display: flex; height: 10px; gap: 2px; margin-top: 10px; border-radius: 5px; overflow: hidden; background: var(--track); }
        .stack i { display: block; height: 100%; }
        .stack i:last-child { border-radius: 0 4px 4px 0; }
        .meter { position: relative; height: 10px; border-radius: 5px; background: var(--track); margin: 12px 0 2px; }
        .meter > i { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 0 4px 4px 0; }
        .meter .tope { position: absolute; top: -5px; bottom: -5px; width: 2px; background: var(--tx); border-radius: 1px; }
        .meter-ax { display: flex; justify-content: space-between; font-size: 9.5px; color: var(--mut); }
        .estado { display: inline-flex; align-items: center; gap: 5px; font-weight: 700; font-size: 11.5px; color: var(--tx); margin-top: 6px; }
        .estado .ico { width: 15px; height: 15px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-size: 9px; font-weight: 800; flex: none; }
        .estado.ok .ico { background: var(--st-good); }
        .estado.mal .ico { background: var(--st-crit); }
        .estado.aviso .ico { background: var(--st-warn); color: #0b0b0b; }

        /* ============ GRID PRINCIPAL ============ */
        .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; padding: 0 20px 12px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; position: relative; min-width: 0; }
        .card h3 { font-size: 13px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .card h3 span { font-weight: 500; color: var(--mut); font-size: 11px; }
        .card h3 a { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--pri); text-decoration: none; cursor: pointer; }
        .card h3 .seg { margin-left: auto; }
        .card .sub { font-size: 11px; color: var(--mut); margin-top: 3px; line-height: 1.45; }

        .mstats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-top: 10px; }
        .ms { border: 1px solid var(--line); border-radius: 9px; padding: 8px 10px; background: var(--card-2); min-width: 0; }
        .ms p { font-size: 10.5px; color: var(--mut); }
        .ms b { font-size: 17px; font-weight: 700; display: block; margin-top: 2px; }
        .ms b small { font-size: 11px; color: var(--mut); font-weight: 500; }
        .ms span { font-size: 10.5px; color: var(--tx2); display: block; margin-top: 2px; line-height: 1.35; }
        .ms.filtrado { border-color: var(--pri-line); box-shadow: inset 3px 0 0 var(--pri); }

        .mapwrap { display: grid; grid-template-columns: 1fr 230px; gap: 12px; margin-top: 10px; height: 620px; }
        .maps { display: grid; gap: 10px; min-width: 0; }
        .maps.dos { grid-template-columns: 1fr 1fr; }
        .map {
            background: var(--map-bg); border: 1px solid var(--line); border-radius: 10px;
            overflow: hidden; position: relative; min-width: 0; touch-action: none; cursor: grab;
        }
        .map.drag { cursor: grabbing; }
        .map .svgbox { position: absolute; inset: 0; }
        .mapsvg { width: 100%; height: 100%; display: block; }
        .mapsvg text, .mapsvg tspan, .mapsvg use { display: none; }
        .mapsvg .lote { cursor: pointer; transition: fill-opacity .15s; vector-effect: non-scaling-stroke; }
        .mapsvg .lote:hover { fill-opacity: .75 !important; }
        .mapsvg .lote.sel { stroke: #0f172a !important; stroke-width: 2.2px !important; stroke-dasharray: none !important; }
        body:not(.light-mode) .mapsvg .lote.sel { stroke: #ffffff !important; }
        .mapsvg .lote.selm { stroke: #0f172a !important; stroke-width: 1.4px !important; }
        body:not(.light-mode) .mapsvg .lote.selm { stroke: #ffffff !important; }
        .mapsvg .badges { pointer-events: none; }
        .mapsvg .badges text { display: inline; font-family: Inter, 'Segoe UI', sans-serif; font-weight: 800; text-anchor: middle; dominant-baseline: central; }
        .map-label {
            position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3;
            padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
            background: var(--card); border: 1px solid var(--line); color: var(--tx2); white-space: nowrap;
        }
        .map-note {
            position: absolute; left: 10px; right: 50px; bottom: 40px; z-index: 3; font-size: 11px; color: var(--tx2);
            background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px; line-height: 1.45;
        }
        .map-msg { display: grid; place-items: center; height: 100%; color: var(--mut); text-align: center; padding: 20px; }
        .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--pri); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 4; }
        .zoom button {
            width: 28px; height: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
            display: grid; place-items: center; color: var(--tx2); cursor: pointer; font-size: 14px;
        }
        .zoom button:hover { color: var(--pri); border-color: var(--pri-line); }

        /* Ficha flotante */
        .ficha {
            position: absolute; left: 12px; top: 12px; width: 262px; z-index: 5; max-height: calc(100% - 24px); overflow: auto;
            background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
            padding: 12px 14px; cursor: default;
        }
        .ficha .t { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding-right: 18px; color: var(--tx2); }
        .ficha h5 { font-size: 14px; margin: 2px 0 6px; line-height: 1.25; }
        .ficha .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--mut); font-size: 18px; cursor: pointer; line-height: 1; }
        .ficha .x:hover { color: var(--tx); }
        .ficha table { width: 100%; font-size: 11px; border-collapse: collapse; }
        .ficha td { padding: 2px 0; color: var(--tx2); vertical-align: top; }
        .ficha td:last-child { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--tx); font-weight: 600; padding-left: 8px; }
        .ficha td.txt { font-family: Inter, sans-serif; font-weight: 600; }
        .ficha .bars { display: flex; gap: 2px; align-items: flex-end; height: 34px; margin-top: 8px; }
        .ficha .bars i { flex: 1; border-radius: 2px 2px 0 0; min-height: 1px; }
        .ficha .ax { display: flex; justify-content: space-between; font-size: 9px; color: var(--mut); }
        .ficha .also { font-size: 10px; color: var(--mut); margin-top: 6px; }

        .tip {
            position: fixed; z-index: 100; pointer-events: none; display: none; max-width: 280px;
            background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
            padding: 6px 9px; font-size: 11px; color: var(--tx2); line-height: 1.45;
        }
        .tip b { color: var(--tx); }

        /* Leyenda */
        .leg { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
        .li {
            display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 8px 10px; border: 1px solid var(--line);
            border-radius: 9px; background: var(--card); cursor: pointer; text-align: left; color: var(--tx); font: inherit;
        }
        .li:hover { border-color: var(--pri-line); }
        .li > i { width: 12px; height: 12px; border-radius: 3px; margin-top: 2px; }
        .li > i.outline { background: var(--lot-neutral); border: 1.5px dashed var(--c-version); }
        .li b { font-size: 12px; }
        .li p { font-size: 11px; color: var(--tx2); line-height: 1.45; }
        .li .mono { font-size: 11.5px; font-weight: 700; }
        .li.off { opacity: .45; }
        .grp { font-size: 10px; font-weight: 700; color: var(--mut); letter-spacing: .05em; text-transform: uppercase; margin: 4px 2px 0; }
        .hint { font-size: 11px; color: var(--mut); margin-top: 6px; }
        .bdg {
            display: inline-grid; place-items: center; min-width: 15px; height: 15px; padding: 0 3px; border-radius: 8px;
            font-size: 9.5px; font-weight: 800; color: #fff; background: var(--c-version); vertical-align: 1px; margin-right: 2px;
        }
        .bdg.pill { background: var(--tx); color: var(--card); }
        .bdg.crit { background: var(--st-crit); }

        .right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .chartA { height: 190px; margin-top: 8px; position: relative; }
        .chartB { height: 240px; margin-top: 6px; position: relative; }
        .chart-cap { font-size: 10.5px; color: var(--mut); margin-top: 8px; font-weight: 600; }
        .bars2 .r { display: grid; grid-template-columns: 170px 1fr 70px; align-items: center; gap: 8px; margin: 7px 0; font-size: 12px; }
        .bars2 .t, .hb .t { height: 12px; background: var(--track); border-radius: 4px; overflow: hidden; }
        .bars2 .t i, .hb .t i { display: block; height: 100%; border-radius: 0 4px 4px 0; }
        .bars2 .r b { text-align: right; font-family: 'JetBrains Mono', monospace; }
        .bars2 .foot { font-size: 11px; color: var(--mut); margin-top: 4px; }
        .empty { color: var(--mut); font-size: 12px; padding: 14px 0; }

        /* ============ TABLAS ============ */
        .tables { display: grid; grid-template-columns: 1.3fr 1fr; gap: 12px; padding: 0 20px 12px; }
        .wide { display: grid; gap: 12px; padding: 0 20px 20px; }
        .dos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
        .tbwrap { overflow-x: auto; }
        table.tb { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .tb th {
            font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); text-align: left;
            padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; user-select: none; font-weight: 700;
        }
        .tb.ord th { cursor: pointer; }
        .tb.ord th:hover { color: var(--tx2); }
        .tb th.sorted::after { content: ' ▾'; }
        .tb th.sorted.asc::after { content: ' ▴'; }
