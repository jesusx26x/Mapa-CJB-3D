    <script>
        // ================================================================
        // Pestaña «Flujo 2027» – lee data/flujo_2027.json (generado por
        // «Actualizar Flujo 2027.bat») y pinta el mapa, gráficos y tablas.
        // Desde el modelo v1.19 el JSON trae las 8 versiones de ventas y obras
        // × 3 escenarios («combos»), cada una recalculada por Excel.
        // ================================================================
        const DATA_URL = 'data/flujo_2027.json';
        const PROYECTOS = {
            CJB: { nombre: 'Ciudad Juan Bosch', svg: 'MAPA NUEVO - CJB/assets/mapa.svg' },
            CPAG: { nombre: 'Ciudad Pres. Antonio Guzmán', svg: 'MAPA CPAG/assets/mapa.svg' }
        };
        const ESCENARIOS = ['Pesimista', 'Base', 'Optimista'];
        const VISTAS = ['flujo', 'versiones', 'compras'];
        // Capas del mapa. El mapa usa solo 3 colores (todos los pares validados para daltonismo y visión normal):
        // azul = lotes vendidos que pagan, verde agua = lotes que se licitan en la versión, naranja = obras.
        // Lo demás va por forma: contorno punteado (no se licita en esta versión) e insignias (tramo, «+3», «!»).
        const CAT = {
            vende: { label: 'Se licitan en esta versión', titulo: 'Se licita en esta versión', color: 'var(--c-version)' },
            noVende: { label: 'No se licitan en esta versión', titulo: 'No se licita en esta versión', color: 'var(--c-version)', contorno: true },
            obra: { label: 'Obras con pagos', titulo: 'Obra', color: 'var(--c-obra)' },
            adjudicada: { label: 'Vendidos · LIC 2026-01', titulo: 'Vendido en LIC 2026-01', color: 'var(--c-vendidos)' },
            cartera: { label: 'Vendidos · cartera con plan de pagos', titulo: 'Cartera con plan de pagos', color: 'var(--c-vendidos)' },
            legal: { label: 'Cartera en gestión legal', titulo: 'Cartera en gestión legal', color: 'var(--c-legal)' }
        };
        const ORDEN_CAT = ['vende', 'noVende', 'obra', 'adjudicada', 'cartera', 'legal'];
        const RE_LOTE = /^(\d{2}-\d{2}-\d{2}|C-\d{2})$/;
        const MESES_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const SVGNS = 'http://www.w3.org/2000/svg';

        const S = {
            data: null,
            vista: 'flujo',
            proyecto: 'CJB',
            escenario: null,
            version: null,
            versionHash: null,
            modoChart: 'fideicomiso',
            metrica: 'dic27',
            off: new Set(),
            svgText: {},
            maps: {},
            charts: {},
            sel: null,              // lote con la ficha abierta
            selLotes: new Set(),    // lotes seleccionados: filtran tarjetas, gráficos y barras
            sortObras: { k: 'pagos', dir: -1 },
            sortLic: { k: 'cobro', dir: -1 }
        };

        // ---------------------------------------------------------------- utilidades
        const $ = (sel, root = document) => root.querySelector(sel);
        const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const sum = a => (a || []).reduce((x, y) => x + (+y || 0), 0);
        const addArr = (a, b) => a.map((v, i) => v + ((b || [])[i] || 0));
        const zeros = () => new Array(S.data ? S.data.meses.length : 15).fill(0);
        // El horizonte sale del JSON: 15 meses hasta el modelo v1.10 (dic-27), 27 desde v1.11 (dic-28)
        const ultimoMes = () => S.data.meses[S.data.meses.length - 1];
        const posteriorLbl = () => `Posterior (${+ultimoMes().slice(0, 4) + 1}+)`;
        const fmtM = v => (v / 1e6).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        const fmtN = v => Math.round(v).toLocaleString('en-US');
        const fmtPct = (v, d = 1) => (v == null || isNaN(v)) ? '—' : (v * 100).toFixed(d) + '%';
        const fmtMes = k => { const [y, m] = k.split('-'); return MESES_ES[+m - 1] + '-' + y.slice(2); };
        const fmtMesLargo = k => k ? fmtMes(k).replace(/-(\d\d)$/, '-20$1') : '—';
        const fmtFecha = iso => { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}-${MESES_ES[+m - 1]}-${y.slice(2)}`; };
        const pl = (n, uno = 'mes', varios = 'meses') => `${n} ${n === 1 ? uno : varios}`;
        const isLight = () => document.body.classList.contains('light-mode');
        const cssVar = n => getComputedStyle(document.body).getPropertyValue(n).trim();
        const conAlfa = (hex, a) => {
            const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(hex);
            return m ? `rgba(${parseInt(m[1], 16)},${parseInt(m[2], 16)},${parseInt(m[3], 16)},${a})` : hex;
        };
        const comboKey = (v, e) => `${v}|${e}`;
        const combo = (v = S.version, e = S.escenario) => S.data.combos[comboKey(v, e)];
        const esc = () => combo();
        const versiones = () => S.data.versiones || [];
        const versionInfo = (n = S.version) => versiones().find(v => v.n === n);
        const esBase = v => /\(base\)/i.test(v?.nombre || '');
        const idxAnio = anio => S.data.meses.map((m, i) => m.startsWith(anio) ? i : -1).filter(i => i >= 0);
        const sumIdx = (arr, ids) => ids.reduce((a, i) => a + ((arr || [])[i] || 0), 0);
        const calendarioTramos = (e = esc()) => /^tramos/i.test(e.params?.calendario || '');
        const consolidado = () => S.proyecto === 'Consolidado';
        const proyectosVista = () => consolidado() ? ['CJB', 'CPAG'] : [S.proyecto];
        // Filas de detalle que entran en la vista (en Consolidado también las «Por confirmar»)
        const enVista = p => consolidado() || p === S.proyecto;
        const proyDeClave = clave => (clave || '').split('-')[0];
        // Claves sin lote en el mapa: «-GENERAL» (partidas generales), «-ACCESO-…» (vías de acceso fuera del límite),
        // «CPAG-STGO-n» (lotes de Santiago que la versión vende sin decir cuáles) y «POR-CONFIRMAR» (ubicación por confirmar)
        const etiquetaVirtual = clave => /GENERAL$/.test(clave) ? 'general · sin lote en el mapa'
            : /-ACCESO-/.test(clave) ? 'vía de acceso fuera del límite · sin lote'
                : /-STGO-/.test(clave) ? 'lote de Santiago por definir · sin lote en el mapa' : 'ubicación por confirmar';
        const proximo = (serie, meses) => {
            const i = serie.findIndex(v => v > 0.5);
            return i < 0 ? '—' : `${fmtMes(meses[i])} · ${fmtM(serie[i])}`;
        };
        // Categoría de un lote de licitación en la combinación activa
        const catLic = l => l.grupo === 'LIC 2026-01' ? 'adjudicada' : (l.incluida && l.probabilidad > 0 ? 'vende' : 'noVende');
        // Versiones (del mismo escenario) en que se licita un lote: «4–8», «2, 3 y 5»…
        function versionesQueLicitan(clave) {
            return versiones().filter(v => {
                const c = combo(v.n, S.escenario);
                const l = c && c.licitaciones.find(x => x.clave === clave);
                return l && catLic(l) === 'vende';
            }).map(v => v.n);
        }
        function rangos(ns) {
            if (!ns.length) return '';
            const tramos = [];
            ns.forEach(n => {
                const t = tramos[tramos.length - 1];
                if (t && n === t[1] + 1) t[1] = n; else tramos.push([n, n]);
            });
            const txt = tramos.map(([a, b]) => a === b ? `${a}` : (b === a + 1 ? `${a}, ${b}` : `${a}–${b}`));
            return txt.length > 1 ? txt.slice(0, -1).join(', ') + ' y ' + txt[txt.length - 1] : txt[0];
        }

        // ---------------------------------------------------------------- datos
        // Acepta el JSON de antes de v1.19 (esquema 1: solo escenarios) como versión 0
        function prepararDatos(d) {
            if (!d.combos) {
                d.combos = Object.fromEntries(Object.entries(d.escenarios || {}).map(([e, x]) => [comboKey(0, e), x]));
                d.versiones = [];
                d.activa = { version: 0, escenario: 'Base' };
            }
            Object.values(d.combos).forEach(c => Object.values(c.lotes || {}).forEach(l => {
                if (l.categoria === 'licitar' || l.categoria === 'opcional') l.categoria = l.atenuado ? 'noVende' : 'vende';
            }));
            return d;
        }

        // ---------------------------------------------------------------- estado en la URL
        function leerHash() {
            const q = new URLSearchParams(location.hash.slice(1));
            if (VISTAS.includes(q.get('vista'))) S.vista = q.get('vista');
            if (['CJB', 'CPAG', 'Consolidado'].includes(q.get('proyecto'))) S.proyecto = q.get('proyecto');
            if (ESCENARIOS.includes(q.get('escenario'))) S.escenario = q.get('escenario');
            const v = parseInt(q.get('version'), 10);
            S.versionHash = isNaN(v) ? null : v;
        }
        function escribirHash() {
            history.replaceState(null, '', `#vista=${S.vista}&proyecto=${S.proyecto}&escenario=${S.escenario}&version=${S.version}`);
        }
        // Versión y escenario válidos: los del hash si existen en el JSON; si no, los que estaban elegidos en el Excel
        function ajustarSeleccion() {
            const a = S.data.activa || {};
            if (!ESCENARIOS.includes(S.escenario)) S.escenario = ESCENARIOS.includes(a.escenario) ? a.escenario : 'Base';
            const pedidas = [S.versionHash, S.version, a.version, ...versiones().map(v => v.n), 0];
            S.version = pedidas.find(n => n != null && combo(n, S.escenario)) ?? 0;
            S.versionHash = null;
        }

        // ---------------------------------------------------------------- partidas y filtros
        // Cada fila de detalle del JSON (obra, retenido, licitación, cartera) es una «partida» con su
        // clave de lote, su capa de la leyenda y su serie mensual. Las tarjetas, el gráfico y las barras
        // se calculan sumando las partidas activas: las de capas visibles y, si hay lotes seleccionados,
        // solo las de esos lotes.
        const GRUPO_FUENTE = {
            'LIC 2026-01': 'lic2026', 'LIC 2027-01': 'lic2027', 'ZFI 2027-02': 'zfi', 'Lotes adicionales': 'adicionales',
            'CPAG HAB 2027': 'cpag2027', 'CPAG COM 2027': 'cpag2027'
        };
        // Fuente de ingreso → nombre y familia de color (vendidos: ya contratado; versión: depende de la versión)
        const FUENTES_ING = [
            ['cartera', 'Cartera con plan de pagos', 'vendidos'],
            ['recupLegal', 'Recuperación de cartera legal', 'vendidos'],
            ['lic2026', 'LIC 2026-01 (adjudicados)', 'vendidos'],
            ['lic2027', 'Lotes restantes · LIC 2027-01', 'version'],
            ['adicionales', 'Lotes restantes · adicionales', 'version'],
            ['zfi', 'Zona Franca (ZFI)', 'version'],
            ['cpag2027', 'Lotes de Santiago (CPAG)', 'version']
        ];
        const FAM = { vendidos: 'var(--c-vendidos)', version: 'var(--c-version)', otros: 'var(--c-otros)', obra: 'var(--c-obra)', noobra: 'var(--c-noobra)', compras: 'var(--c-compras)' };
        const CAPAS_FILTRO = [...ORDEN_CAT, 'virtual'];

        function partidasVista() {
            const e = esc();
            const idx = Object.fromEntries(S.data.meses.map((m, i) => [m, i]));
            const out = [];
            e.obras.filter(o => enVista(o.proyecto)).forEach(o => out.push({
                clave: o.clave, proyecto: o.proyecto, capa: o.enMapa ? 'obra' : 'virtual',
                fuente: o.tipo.toLowerCase() === 'reserva' ? 'mantGeneral' : 'obras', serie: o.pagos, obra: o
            }));
            e.retenidos.filter(r => enVista(r.proyecto)).forEach(r => out.push({
                clave: r.clave, proyecto: r.proyecto, capa: r.enMapa ? 'obra' : 'virtual', fuente: 'retenidos', serie: r.pagos
            }));
            e.licitaciones.filter(l => enVista(l.proyecto)).forEach(l => out.push({
                clave: l.clave, proyecto: l.proyecto, capa: l.enMapa ? catLic(l) : 'virtual',
                fuente: GRUPO_FUENTE[l.grupo] || 'adicionales', serie: l.cobros
            }));
            e.cartera.filter(c => enVista(c.proyecto)).forEach(c => {
                const capa = !c.enMapa ? 'virtual' : (c.situacion.startsWith('Sin plan') ? 'legal' : 'cartera');
                out.push({ clave: c.clave, proyecto: c.proyecto, capa, fuente: 'cartera', serie: c.cobros, cart: c });
                if (c.recupLegal > 0.5 && c.mesRecupLegal in idx) {
                    const serie = zeros();
                    serie[idx[c.mesRecupLegal]] = c.recupLegal;
                    out.push({ clave: c.clave, proyecto: c.proyecto, capa, fuente: 'recupLegal', serie });
                }
            });
            return out;
        }

        const hayFiltro = () => S.selLotes.size > 0 || CAPAS_FILTRO.some(c => S.off.has(c));
        const partidaActiva = p => !S.off.has(p.capa) && (!S.selLotes.size || S.selLotes.has(p.clave));

        function totalesVista() {
            const e = esc();
            const P = S.proyecto;
            const meses = S.data.meses;
            const filtro = hayFiltro();
            const act = partidasVista().filter(partidaActiva);
            const serie = (fuente, proy) => act.filter(p => p.fuente === fuente && (!proy || p.proyecto === proy))
                .reduce((a, p) => addArr(a, p.serie), zeros());
            const ingFuente = Object.fromEntries(FUENTES_ING.map(([k]) => [k, serie(k)]));
            const familia = fam => FUENTES_ING.filter(f => f[2] === fam).reduce((a, [k]) => addArr(a, ingFuente[k]), zeros());
            // «Otros ingresos» (intereses) son del Fideicomiso, sin lote: solo cuentan en Consolidado sin filtros
            const otros = consolidado() && !filtro ? e.mensual.ingresos.otros : zeros();
            const vendidosMes = familia('vendidos'), versionMes = familia('version');
            const ingSerie = addArr(addArr(vendidosMes, versionMes), otros);
            const obrasMes = addArr(serie('obras'), serie('mantGeneral'));
            const retMes = serie('retenidos');

            let detalleIng = FUENTES_ING.map(([k, lab, fam]) => [lab, sum(ingFuente[k]), FAM[fam]]);
            let detalleEgr;
            if (consolidado()) {
                if (!filtro) detalleIng.push(['Intereses y otros ingresos', sum(otros), FAM.otros]);
                detalleEgr = [
                    ['Obras CJB', sum(serie('obras', 'CJB')), FAM.obra],
                    ['Obras CPAG', sum(serie('obras', 'CPAG')), FAM.obra],
                    ['Mantenimiento de la ciudad', sum(serie('mantGeneral')), FAM.obra],
                    ['Devolución de retenidos', sum(retMes), FAM.obra]
                ];
                if (!filtro) {
                    // Sin lote: solo en Consolidado sin filtros (v1.7+; obligaciones y compras de las áreas desde v1.14)
                    const E = e.mensual.egresos;
                    if (E.complementarias) detalleEgr.push(['Obras complementarias', sum(E.complementarias), FAM.obra]);
                    if (E.costoAtraso && sum(E.costoAtraso) > 0.5) detalleEgr.push(['Costo de atrasar obras', sum(E.costoAtraso), FAM.obra]);
                    detalleEgr.push(['Gastos fijos (nómina, fee, impuestos, suplidores)', sum(E.gastosFijos), FAM.noobra]);
                    if (E.obligaciones && sum(E.obligaciones) > 0.5) detalleEgr.push(['Obligaciones adicionales', sum(E.obligaciones), FAM.noobra]);
                    if (E.pacc && sum(E.pacc) > 0.5) detalleEgr.push(['Compras de las áreas (techos)', sum(E.pacc), FAM.compras]);
                }
            } else {
                detalleIng = detalleIng.filter(([k, v]) => P === 'CPAG' ? v > 0.5 : k !== 'Lotes de Santiago (CPAG)');
                detalleEgr = [
                    ['Obras ' + P, sum(serie('obras')), FAM.obra],
                    ['Mantenimiento de la ciudad', sum(serie('mantGeneral')), FAM.obra],
                    ['Devolución de retenidos ' + P, sum(retMes), FAM.obra]
                ];
            }

            const obrasAct = act.filter(p => p.fuente === 'obras' || p.fuente === 'mantGeneral');
            const contratos = obrasAct.filter(p => p.fuente === 'obras' && p.obra.totalHorizonte > 0).length;
            const reserva = obrasAct.some(p => p.fuente === 'mantGeneral' && p.obra.totalHorizonte > 0);
            const contrato = sum(obrasAct.filter(p => p.fuente === 'obras').map(p => p.obra.contrato));
            const adenda = sum(obrasAct.filter(p => p.fuente === 'obras').map(p => p.obra.adenda));

            // Lotes con movimiento: los de la vista con alguna partida activa (los que la versión no licita no cuentan)
            const clavesAct = new Set(act.map(p => p.clave));
            const lotes = Object.entries(e.lotes).filter(([k, l]) => l.categoria !== 'noVende'
                && proyectosVista().includes(proyDeClave(k)) && (!filtro || clavesAct.has(k)));
            const nLotes = Object.entries(S.data.maestro)
                .filter(([k, m]) => proyectosVista().includes(m.proyecto) && RE_LOTE.test(m.id)).length;
            const porCat = c => lotes.filter(([, l]) => l.categoria === c).length;

            // Flujo acumulado de la selección (ingresos − pagos a obras), para el gráfico de proyecto o selección
            let acc = 0;
            const acum = ingSerie.map((v, i) => (acc += v - obrasMes[i]));
            const iMin = acum.indexOf(Math.min(...acum));

            return {
                meses, filtro, ingSerie, vendidosMes, versionMes, otrosMes: otros, obrasMes, retMes, detalleIng, detalleEgr,
                ing: sum(ingSerie), obras: sum(obrasMes), contratos, reserva, contrato, adenda, nLotes,
                nMov: lotes.length,
                nObra: porCat('obra'),
                nLic: porCat('adjudicada') + porCat('vende'),
                nCart: porCat('cartera') + porCat('legal'),
                acum, minAcum: acum[iMin], mesMinAcum: meses[iMin], negAcum: acum.filter(v => v < -0.5).length
            };
        }

        // Capas de la leyenda (sin aplicar filtros): conteo por categoría principal y monto por fuente
        function capasVista() {
            const e = esc();
            const P = proyectosVista();
            const lotes = Object.entries(e.lotes).filter(([k]) => P.includes(proyDeClave(k)));
            const cap = {};
            ORDEN_CAT.forEach(c => { cap[c] = { n: lotes.filter(([, l]) => l.categoria === c).length, monto: 0, saldo: 0 }; });
            let obrasVirt = 0, ingVirt = 0;
            const virtuales = new Set();
            partidasVista().forEach(p => {
                const t = sum(p.serie);
                if (p.fuente === 'retenidos') return;
                const esObra = p.fuente === 'obras' || p.fuente === 'mantGeneral';
                if (p.capa === 'virtual') {
                    if (esObra) obrasVirt += t; else ingVirt += t;
                    if (t > 0.5) virtuales.add(p.clave + '|' + (p.obra?.obra || p.fuente));
                } else {
                    cap[p.capa].monto += t;
                }
                if (p.capa === 'legal' && p.fuente === 'cartera') cap.legal.saldo += p.cart.saldo;
            });
            return { cap, obrasVirt, ingVirt, nVirt: virtuales.size };
        }

        // ---------------------------------------------------------------- render general
        function render() {
            document.querySelectorAll('#tabs button').forEach(b => {
                const on = b.dataset.vista === S.vista;
                b.classList.toggle('on', on);
                b.setAttribute('aria-selected', on);
            });
            document.querySelectorAll('[data-solo]').forEach(el => { el.hidden = el.dataset.solo !== S.vista; });
            document.querySelectorAll('#segProyecto button').forEach(b => b.classList.toggle('on', b.dataset.v === S.proyecto));
            document.querySelectorAll('#segEscenario button').forEach(b => b.classList.toggle('on', b.dataset.v === S.escenario));
            document.querySelectorAll('#segVersion button').forEach(b => {
                const n = +b.dataset.v;
                b.classList.toggle('on', n === S.version);
                b.setAttribute('aria-checked', n === S.version);
                b.disabled = !combo(n, S.escenario);
            });
            document.querySelectorAll('.vista').forEach(v => { v.hidden = v.dataset.vista !== S.vista; });
            escribirHash();
            renderStamp();
            renderVersionCard();
            renderKpis();
            if (S.vista === 'flujo') {
                renderMapas();
                renderLicitaciones();
                renderObras();
                renderTrimestres();
                actualizarFiltros();
            } else if (S.vista === 'versiones') {
                renderVersiones();
            } else {
                renderCompras();
            }
        }

        // Todo lo que depende de la selección de lotes y de las capas de la leyenda
        function actualizarFiltros() {
            const T = totalesVista();
            renderSelbar(T);
            renderMapStats(T);
            renderLeyenda();
            proyectosVista().forEach(pintarMapa);
            renderChartFlujo(T);
            renderBarras(T);
            marcarFilas();
            $('#btnReset').disabled = !T.filtro && consolidado();
            if (!T.filtro) verificarTotales(T);
        }

        function renderSelbar(T) {
            const bar = $('#selbar');
            if (!T.filtro) { bar.hidden = true; bar.innerHTML = ''; return; }
            const partes = [];
            if (S.selLotes.size) {
                const chips = [...S.selLotes].map(k => `<span class="chip">${h(k)}<button data-quitar="${h(k)}" title="Quitar de la selección">×</button></span>`).join(' ');
                partes.push(`<b>${S.selLotes.size} ${S.selLotes.size === 1 ? 'lote seleccionado' : 'lotes seleccionados'}:</b> ${chips}`);
            }
            const ocultas = CAPAS_FILTRO.filter(c => S.off.has(c)).map(c => c === 'virtual' ? 'Sin lote en el mapa' : CAT[c].label);
            if (ocultas.length) partes.push(`<b>Capas ocultas:</b> ${h(ocultas.join(', '))}`);
            bar.innerHTML = `🔎 ${partes.join(' · ')} <span>— las cifras del mapa, el gráfico y las barras muestran solo esto.</span>
                <button class="btn" data-reset>✕ Quitar filtros</button>`;
            bar.hidden = false;
        }

        function renderStamp() {
            const d = S.data;
            const g = d.generado ? new Date(d.generado) : null;
            const fecha = g ? `${String(g.getDate()).padStart(2, '0')}-${MESES_ES[g.getMonth()]}-${g.getFullYear()}` : '—';
            const m0 = d.meses[0].split('-'), m1 = d.meses[d.meses.length - 1].split('-');
            const cub = d.activa?.fuenteCubicaciones ? ` · cubicaciones: ${h(d.activa.fuenteCubicaciones)}` : '';
            $('#stamp').innerHTML = `Período <b>${MESES_ES[+m0[1] - 1]}-${m0[0]} → ${MESES_ES[+m1[1] - 1]}-${m1[0]}</b> · cifras en RD$ millones<br>` +
                `Fuente: ${h(d.fuente)} · actualizado ${fecha}${cub}`;
        }

        // Qué supone la versión elegida (Decisiones, sección 8, y la hoja Versiones)
        function renderVersionCard() {
            const box = $('#vcard');
            const v = versionInfo();
            if (!v) { box.hidden = true; return; }
            const e = esc();
            const prob = e.params?.probLic2027;
            const stgo = e.licitaciones.filter(l => l.generico);
            const precio = typeof v.precioTxt === 'number' ? v.precioTxt : v.precio;
            const activaExcel = S.data.activa?.version === v.n ? ' · es la versión elegida en el Excel' : '';
            box.innerHTML = `
                <div class="vtit"><div class="vnum">${v.n}</div>
                    <div><b>${h(v.nombre)}${esBase(v) ? '<span class="star">★ base</span>' : ''}</b>
                    <p>Versión ${v.n} de ${versiones().length}${v.antes ? ' · antes ' + h(v.antes) : ''} · escenario ${h(S.escenario)}${activaExcel}</p></div></div>
                <div class="vfacts">
                    <div><span>Lotes que se licitan</span><b>${h(v.lotesTxt || v.lotesCJB)}</b></div>
                    <div><span>Precio lotes restantes</span><b>RD$${fmtN(precio)}/m²${stgo.length ? ` · Santiago RD$${fmtN(e.params?.precioLoteStgo || 0)}/m²` : ''}</b></div>
                    <div><span>Se vende (este escenario)</span><b>${prob != null ? fmtPct(prob, 0) + ' de lo que se licita' : h(String(v.vendidoTxt ?? ''))}</b></div>
                    <div><span>Pagos de obra</span><b>${h(v.obrasTxt || (v.retrasoObras ? `Todas las obras +${v.retrasoObras} meses` : 'Según el programa de Técnica'))}</b></div>
                </div>`;
            box.hidden = false;
        }

        // Caja del Fideicomiso en la versión y el escenario elegidos (no cambia con el proyecto ni con la selección)
        function renderKpis() {
            const e = esc();
            const k = e.kpis, k27 = e.kpis2027, sp = e.split, M = e.mensual;
            const colchon = M.colchon?.[0] || 0;
            const clase = v => v < 0 ? 'neg' : (v < colchon ? 'warnv' : 'pos');
            const i27 = idxAnio('2027'), i28 = idxAnio('2028');
            const tiles = [];
            const tile = (titulo, valor, cls, pie, extra = '') => `<div class="k ${extra}"><h4>${titulo}</h4><div class="v ${cls}">${valor}</div>${pie}</div>`;
            if (k27) {
                tiles.push(tile('🏦 Saldo de caja a dic-2027', fmtM(k27.saldoFinal), clase(k27.saldoFinal),
                    `<p>Ingresos 2027 <b>${fmtM(sumIdx(M.ingresos.total, i27))}</b> · egresos <b>${fmtM(sumIdx(M.egresos.total, i27))}</b></p>`));
            }
            tiles.push(tile(`🏦 Saldo de caja a ${fmtMesLargo(ultimoMes())}`, fmtM(k.saldoFinal), clase(k.saldoFinal),
                i28.length ? `<p>2028 no tiene ventas nuevas: neto del año <b>${fmtM(sumIdx(M.neto, i28))}</b></p>` : '<p>Al cierre del período</p>'));
            const neg = k.mesesNegativos;
            tiles.push(tile('📉 Saldo más bajo', fmtM(k.saldoMin), clase(k.saldoMin),
                `<p>${fmtMesLargo(k.mesSaldoMin)} · ${neg ? `<b class="neg">${pl(neg)} en negativo</b>` : 'ningún mes en negativo'}<br>Colchón mínimo ${fmtM(colchon)}${k27 ? ` · hasta dic-27: ${fmtM(k27.saldoMin)}` : ''}</p>`));
            if (sp) {
                const techo = sp.techoGlobal || 0, stgo = sp.reservaSantiago || 0, libre = Math.max(sp.sinAsignar || 0, 0);
                const disp = sp.disponible || 0;
                const tot = Math.max(disp, techo + stgo + libre);
                const seg = (v, c, t) => v > 0.5 ? `<i style="width:${(v / tot * 100).toFixed(2)}%;background:${c}" title="${t} ${fmtM(v)}"></i>` : '';
                tiles.push(tile('🛒 Disponible 2027 para compras y Santiago', fmtM(disp), disp > 0.5 ? '' : 'neg',
                    disp > 0.5
                        ? `<div class="stack">${seg(techo, 'var(--c-compras)', 'Compras nuevas')}${seg(stgo, 'var(--c-stgo)', 'Santiago')}${seg(libre, 'var(--c-otros)', 'Sin asignar')}</div>
                           <p><i class="sw" style="background:var(--c-compras)"></i>Compras nuevas de las áreas <b>${fmtM(techo)}</b> · <i class="sw" style="background:var(--c-stgo)"></i>Santiago <b>${fmtM(stgo)}</b>${libre > 0.5 ? ` · sin asignar <b>${fmtM(libre)}</b>` : ''}</p>`
                        : `<p>La caja no deja nada sin bajar del colchón en 2027: <b>techo de compras 0</b> y nada para Santiago.</p>`, 'ancho'));
                const r = sp.ratio, tope = sp.tope || 1 / 3, cumple = r <= tope + 1e-9;
                const escala = Math.max(0.45, r * 1.1, tope * 1.25);
                const recorte = sp.recorte || 0;
                tiles.push(tile('⚖️ Gasto no-obra / obra 2027', fmtPct(r), '',
                    `<div class="meter" role="img" aria-label="No-obra ${fmtPct(r)} de la obra; tope ${fmtPct(tope)}">
                        <i style="width:${Math.min(r / escala, 1) * 100}%;background:${cumple ? 'var(--st-good)' : 'var(--st-crit)'}"></i>
                        <span class="tope" style="left:${tope / escala * 100}%" title="Tope ${fmtPct(tope)} (75/25)"></span></div>
                     <div class="meter-ax"><span>0%</span><span>tope ${fmtPct(tope)} = split 75/25</span><span>${fmtPct(escala, 0)}</span></div>
                     <div class="estado ${cumple ? 'ok' : 'mal'}" title="${h(sp.cumple || '')}"><span class="ico">${cumple ? '✓' : '✕'}</span>${cumple ? 'Cumple 75/25' : 'No cumple 75/25'}</div>
                     <p>Con compras y Santiago. Antes de ellos: <b>${fmtPct(sp.ratioAntes)}</b>${!cumple && recorte > 0.5 ? ` · para cumplir hay que recortar <b>${fmtM(recorte)}</b> de no-obra` : ''}</p>`, 'ancho'));
            }
            $('#kpis').innerHTML = tiles.join('');
        }

        // Cifras del mapa: proyecto o selección (las que cambian al hacer clic en los lotes o la leyenda)
        function renderMapStats(T) {
            const P = S.proyecto;
            const f = T.filtro;
            const fc = f ? ' filtrado' : '';
            const nom = f ? 'de la selección' : (consolidado() ? 'CJB + CPAG' : P);
            const aporte = T.ing - T.obras;
            const fuentesSel = T.detalleIng.filter(r => r[1] > 0.5).map(r => `${h(r[0])} ${fmtM(r[1])}`).join(' · ');
            const fuentes = f ? (fuentesSel || 'Sin ingresos en la selección')
                : `Lotes vendidos ${fmtM(sum(T.vendidosMes))} · de esta versión ${fmtM(sum(T.versionMes))}`;
            const obrasTx = `${T.contratos} ${T.contratos === 1 ? 'contrato' : 'contratos'} con pagos` + (T.reserva ? ' + mantenimiento' : '') +
                (T.contrato > 0.5 ? ` · contratos ${fmtM(T.contrato)} + adendas ${fmtM(T.adenda)}` : '');
            $('#mapStats').innerHTML = `
                <div class="ms${fc}"><p>💵 Ingresos de lotes · ${nom}</p><b class="${T.ing > 0 ? 'pos' : ''}">${fmtM(T.ing)}</b><span>${fuentes}</span></div>
                <div class="ms${fc}"><p>🏗️ Pagos a obras · ${nom}</p><b>${fmtM(T.obras)}</b><span>${obrasTx}</span></div>
                <div class="ms${fc}"><p>📈 Aporte neto (antes de gastos fijos)</p><b class="${aporte >= 0 ? 'pos' : 'neg'}">${fmtM(aporte)}</b>
                    <span>${f ? `Acumulado más bajo ${fmtM(T.minAcum)} (${fmtMesLargo(T.mesMinAcum)})` : 'Ingresos de lotes − pagos a obras'}</span></div>
                <div class="ms${fc}"><p>🗺️ Lotes con movimiento</p><b>${T.nMov} <small>de ${T.nLotes}</small></b>
                    <span>${T.nObra} obras · ${T.nLic} vendidos o por vender · ${T.nCart} cartera</span></div>`;
        }

        // ---------------------------------------------------------------- leyenda
        function renderLeyenda() {
            const { cap, obrasVirt, ingVirt, nVirt } = capasVista();
            const e = esc();
            const items = [];
            const boton = (c, p) => {
                const off = S.off.has(c);
                const sw = CAT[c].contorno ? '<i class="outline"></i>' : `<i style="background:${CAT[c].color}"></i>`;
                items.push(`<button class="li ${off ? 'off' : ''}" data-cat="${c}" aria-pressed="${!off}">${sw}<div><b>${CAT[c].label}</b><p>${p}</p></div></button>`);
            };
            items.push('<p class="grp">Esta versión</p>');
            if (cap.vende.n || cap.vende.monto) {
                let p = `${pl(cap.vende.n, 'lote', 'lotes')} · cobro <span class="mono">${fmtM(cap.vende.monto)}</span>`;
                if (calendarioTramos(e)) {
                    const porTramo = {};
                    e.licitaciones.filter(l => l.enMapa && proyectosVista().includes(l.proyecto) && catLic(l) === 'vende' && l.tramo)
                        .forEach(l => {
                            const t = porTramo[l.tramo] ??= { n: 0, cobro: 0, meses: new Set() };
                            t.n++; t.cobro += l.cobroHorizonte;
                            if (l.fechaFirma) t.meses.add(l.fechaFirma.slice(0, 7));
                        });
                    p += Object.entries(porTramo).map(([t, x]) => `<br><span class="bdg">${t}</span>tramo ${t}: firma ${[...x.meses].sort().map(fmtMes).join(', ')} · ${pl(x.n, 'lote', 'lotes')} · <span class="mono">${fmtM(x.cobro)}</span>`).join('');
                } else {
                    p += '<br>Todos en la misma licitación (sin tramos)';
                }
                boton('vende', p);
            } else {
                items.push('<p class="hint">Esta versión no licita lotes en este proyecto.</p>');
            }
            if (cap.noVende.n) boton('noVende', `${pl(cap.noVende.n, 'lote', 'lotes')} · se licitan en otras versiones o quedan fuera (ZFI, CPAG)`);
            items.push('<p class="grp">Ya contratado</p>');
            if (cap.obra.n || cap.obra.monto) {
                const movidas = Object.entries(e.lotes).filter(([k, l]) => l.categoria === 'obra' && l.desplazamiento > 0 && proyectosVista().includes(proyDeClave(k)));
                const meses = [...new Set(movidas.map(([, l]) => l.desplazamiento))].sort();
                boton('obra', `${pl(cap.obra.n, 'lote', 'lotes')} · pagos <span class="mono">${fmtM(cap.obra.monto)}</span>` +
                    (movidas.length ? `<br>${meses.map(m => `<span class="bdg pill">+${m}</span>`).join(' ')} pagos movidos por la versión (${movidas.length})` : '<br>Pagos según el programa de Técnica'));
            }
            ['adjudicada', 'cartera'].forEach(c => {
                if (cap[c].n || cap[c].monto) boton(c, `${pl(cap[c].n, 'lote', 'lotes')} · cobro <span class="mono">${fmtM(cap[c].monto)}</span>`);
            });
            if (cap.legal.n) {
                boton('legal', `<span class="bdg crit">!</span>${pl(cap.legal.n, 'lote', 'lotes')} · saldo <span class="mono">${fmtM(cap.legal.saldo)}</span>` +
                    (cap.legal.monto > 0.5 ? ` · recuperación <span class="mono">${fmtM(cap.legal.monto)}</span>` : ''));
            }
            if (obrasVirt || ingVirt) {
                const partes = [];
                if (obrasVirt) partes.push(`obras <span class="mono">${fmtM(obrasVirt)}</span>`);
                if (ingVirt) partes.push(`ingresos <span class="mono">${fmtM(ingVirt)}</span>`);
                items.push(`<button class="li ${S.off.has('virtual') ? 'off' : ''}" data-cat="virtual" aria-pressed="${!S.off.has('virtual')}">
                    <i style="background:transparent;border:1px dashed var(--mut)"></i><div><b>Sin lote en el mapa</b>
                    <p>${nVirt} partidas generales, por definir o con ubicación por confirmar · ${partes.join(' · ')}</p></div></button>`);
            }
            items.push(`<button class="li ${S.off.has('ninguno') ? 'off' : ''}" data-cat="ninguno">
                <i style="background:var(--lot-neutral);border:1px solid var(--line)"></i><div><b>Sin movimiento</b><p>resto de lotes</p></div></button>`);
            items.push(`<p class="hint">Clic en la leyenda para mostrar u ocultar cada capa (también filtra las cifras).<br>
                Lotes: clic para verlo solo · <b>Ctrl+clic</b> para sumar o quitar varios.</p>`);
            $('#leg').innerHTML = items.join('');
        }

        // ---------------------------------------------------------------- mapas
        async function cargarSvg(p) {
            if (!S.svgText[p]) {
                const r = await fetch(PROYECTOS[p].svg);
                if (!r.ok) throw new Error(`No se pudo cargar ${PROYECTOS[p].svg} (${r.status})`);
                S.svgText[p] = await r.text();
            }
            return S.svgText[p];
        }

        async function renderMapas() {
            const P = proyectosVista();
            const host = $('#maps');
            const titulo = consolidado() ? 'CJB + CPAG' : PROYECTOS[S.proyecto].nombre;
            const v = versionInfo();
            $('#mapTitle').innerHTML = `Mapa · ${h(titulo)}${v ? ` · versión ${v.n}` : ''} <span>clic en un lote para verlo solo · Ctrl+clic para sumar varios</span>`;
            const clave = P.join('+');
            if (host.dataset.vista !== clave) {
                host.dataset.vista = clave;
                host.className = 'maps' + (P.length > 1 ? ' dos' : '');
                host.innerHTML = P.map(p => `<div class="map" data-p="${p}"><div class="svgbox"><div class="map-msg"><div class="spinner"></div></div></div></div>`).join('');
                S.maps = {};
                await Promise.all(P.map(p => montarMapa(p, host.querySelector(`.map[data-p="${p}"]`))));
            }
            P.forEach(pintarMapa);
        }

        async function montarMapa(p, cont) {
            try {
                const txt = await cargarSvg(p);
                if (!cont.isConnected) return;
                const box = cont.querySelector('.svgbox');
                box.innerHTML = txt;
                const svg = box.querySelector('svg');
                svg.removeAttribute('width');
                svg.removeAttribute('height');
                svg.classList.add('mapsvg');
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                const lots = new Map();
                svg.querySelectorAll('[id]').forEach(el => {
                    if (RE_LOTE.test(el.id) && !lots.has(el.id)) { lots.set(el.id, el); el.classList.add('lote'); }
                });
                // Dibujo del DXF: sin rellenos de color (no confundir con las capas) y líneas en gris del tema
                svg.querySelectorAll('path, polygon, polyline, rect, circle, ellipse').forEach(el => {
                    if (el.classList.contains('lote') || el.closest('defs')) return;
                    const cs = getComputedStyle(el);
                    if (cs.fill !== 'none') el.style.fill = 'none';
                    if (cs.stroke !== 'none') el.style.stroke = 'var(--dxf-line)';
                });
                const badges = document.createElementNS(SVGNS, 'g');
                badges.setAttribute('class', 'badges');
                svg.appendChild(badges);
                const bbox = encuadre(svg, lots);
                const m = { p, cont, svg, lots, bbox, vb: { ...bbox }, badges, centros: new Map() };
                S.maps[p] = m;
                setVB(m);
                cont.insertAdjacentHTML('beforeend', `
                    <div class="zoom"><button data-z="in" title="Acercar">+</button><button data-z="out" title="Alejar">−</button><button data-z="reset" title="Encuadrar todo el plano">⟲</button><button data-z="mov" title="Acercar a los lotes con movimiento">◎</button></div>
                    <div class="map-label">${p} · ${h(PROYECTOS[p].nombre)}</div>
                    <div class="map-note" hidden></div>`);
                activarZoomPan(m);
                activarEventos(m);
            } catch (err) {
                console.error(err);
                cont.querySelector('.svgbox').innerHTML = `<div class="map-msg">⚠️ ${h(err.message)}</div>`;
            }
        }

        function notaMapa(p) {
            const e = esc();
            const m = S.maps[p];
            const claves = Object.keys(e.lotes).filter(k => proyDeClave(k) === p && e.lotes[k].categoria !== 'noVende');
            const virt = e.obras.filter(o => o.proyecto === p && !o.enMapa && o.totalHorizonte > 0);
            const notas = [];
            const genericos = e.licitaciones.filter(l => l.generico && l.proyecto === p);
            if (genericos.length) {
                notas.push(`Esta versión vende <b>${genericos.length} lotes de Santiago</b> de ${fmtN(genericos[0].area)} m² a RD$${fmtN(genericos[0].precio)}/m² ` +
                    `(cobro ${fmtM(sum(genericos.map(l => l.cobroHorizonte)))}). El modelo no dice cuáles: no se pintan en el plano.`);
            }
            if (!claves.length && virt.length) {
                notas.push(`No hay lotes ${p} con cobros en esta versión. Sus obras (${virt.map(o => h(o.obra)).join(', ')}) ` +
                    `no tienen todavía ID de vía: <b>ubicación por confirmar</b>. Se muestran en las tablas y los totales.`);
            }
            // Lotes con movimiento que el plano SVG no tiene dibujados (sí cuentan en las cifras y tablas)
            const sinDibujo = m ? claves.filter(k => !m.lots.has(k.slice(p.length + 1))) : [];
            if (sinDibujo.length) {
                const desc = sinDibujo.map(k => {
                    const l = e.lotes[k], mae = S.data.maestro[k] || {};
                    return `<b>${h(k)}</b>${mae.tipo ? ' (' + h(mae.tipo) + ')' : ''} · ${l.categoria === 'obra' ? 'pagos ' + fmtM(l.egresos) : 'cobro ' + fmtM(l.ingresos)}`;
                }).join(', ');
                notas.push(`${sinDibujo.length === 1 ? 'Este lote con movimiento no está dibujado' : 'Estos lotes con movimiento no están dibujados'} en el plano: ${desc}. Sí cuentan en las cifras y tablas.`);
            }
            return notas.join('<br>');
        }

        // Caja de los lotes con movimiento del proyecto (para el botón ◎)
        function encuadreMovimiento(m) {
            const e = esc();
            const sub = new Map();
            Object.entries(e.lotes).forEach(([k, l]) => {
                if (proyDeClave(k) !== m.p || l.categoria === 'noVende') return;
                const el = m.lots.get(k.slice(m.p.length + 1));
                if (el) sub.set(k, el);
            });
            if (!sub.size) return { ...m.bbox };
            const b = encuadre(m.svg, sub);
            // margen extra y relación de aspecto razonable para que no quede demasiado cerca
            const lado = Math.max(b.w, b.h, m.bbox.w / 6);
            const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
            return { x: cx - lado * 0.6, y: cy - lado * 0.6, w: lado * 1.2, h: lado * 1.2 };
        }

        // Encuadre: caja que envuelve todos los lotes, en coordenadas del SVG raíz
        function encuadre(svg, lots) {
            const inv = svg.getScreenCTM()?.inverse();
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            lots.forEach(el => {
                let b;
                try { b = el.getBBox(); } catch (_) { return; }
                if (!b.width && !b.height) return;
                const ctm = inv && el.getScreenCTM() ? inv.multiply(el.getScreenCTM()) : null;
                [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]].forEach(([x, y]) => {
                    let pt = { x, y };
                    if (ctm) pt = new DOMPoint(x, y).matrixTransform(ctm);
                    x0 = Math.min(x0, pt.x); y0 = Math.min(y0, pt.y); x1 = Math.max(x1, pt.x); y1 = Math.max(y1, pt.y);
                });
            });
            if (!isFinite(x0)) {
                const vb = svg.viewBox.baseVal;
                return { x: vb.x, y: vb.y, w: vb.width, h: vb.height };
            }
            const pad = Math.max(x1 - x0, y1 - y0) * 0.03;
            return { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad };
        }

        function setVB(m) {
            m.svg.setAttribute('viewBox', `${m.vb.x} ${m.vb.y} ${m.vb.w} ${m.vb.h}`);
            pintarInsignias(m);   // las insignias mantienen su tamaño en pantalla al acercar o alejar
        }

        // Centro de un lote en coordenadas del SVG raíz (no cambia con el zoom: se calcula una vez)
        function centroLote(m, id) {
            if (!m.centros.has(id)) {
                const b = encuadre(m.svg, new Map([[id, m.lots.get(id)]]));
                m.centros.set(id, { x: b.x + b.w / 2, y: b.y + b.h / 2 });
            }
            return m.centros.get(id);
        }

        // Insignias sobre los lotes: tramo de venta (1-2-3), pagos movidos por la versión (+3) y cartera en legal (!)
        function pintarInsignias(m) {
            if (!m.badges || !S.data) return;
            const e = esc();
            const k = m.svg.getScreenCTM()?.a || 1;    // px de pantalla por unidad del SVG
            const r = 7.5 / k;
            const tramos = calendarioTramos(e);
            const card = cssVar('--card');
            const haySel = S.selLotes.size > 0;
            const out = [];
            m.lots.forEach((el, id) => {
                const clave = m.p + '-' + id;
                const l = e.lotes[clave];
                if (!l || S.off.has(l.categoria)) return;
                let txt = null, bg, fg = '#ffffff', pastilla = false;
                if (l.categoria === 'vende' && tramos && l.tramo) { txt = String(l.tramo); bg = cssVar('--c-version'); }
                else if (l.categoria === 'obra' && l.desplazamiento > 0) { txt = '+' + l.desplazamiento; bg = cssVar('--tx'); fg = card; pastilla = true; }
                else if (l.categoria === 'legal') { txt = '!'; bg = cssVar('--st-crit'); }
                if (!txt) return;
                const { x, y } = centroLote(m, id);
                const op = haySel && !S.selLotes.has(clave) ? 0.3 : 1;
                const forma = pastilla
                    ? `<rect x="${x - r * 1.5}" y="${y - r * 0.9}" width="${r * 3}" height="${r * 1.8}" rx="${r * 0.9}" fill="${bg}" stroke="${card}" stroke-width="${r * 0.28}"/>`
                    : `<circle cx="${x}" cy="${y}" r="${r}" fill="${bg}" stroke="${card}" stroke-width="${r * 0.28}"/>`;
                out.push(`<g opacity="${op}">${forma}<text x="${x}" y="${y}" font-size="${r * (pastilla ? 1.1 : 1.25)}" fill="${fg}">${h(txt)}</text></g>`);
            });
            m.badges.innerHTML = out.join('');
        }

        function zoomEn(m, f, cx, cy) {
            const vb = m.vb;
            const nw = Math.min(Math.max(vb.w * f, m.bbox.w / 12), m.bbox.w * 3);
            const k = nw / vb.w;
            vb.x = cx - (cx - vb.x) * k;
            vb.y = cy - (cy - vb.y) * k;
            vb.w *= k;
            vb.h *= k;
            setVB(m);
        }

        function puntoSvg(m, ev) {
            const ctm = m.svg.getScreenCTM();
            return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(ctm.inverse());
        }

        function activarZoomPan(m) {
            const c = m.cont;
            c.querySelector('.zoom').addEventListener('click', ev => {
                const z = ev.target.closest('button')?.dataset.z;
                if (!z) return;
                ev.stopPropagation();
                const cx = m.vb.x + m.vb.w / 2, cy = m.vb.y + m.vb.h / 2;
                if (z === 'in') zoomEn(m, 0.7, cx, cy);
                else if (z === 'out') zoomEn(m, 1 / 0.7, cx, cy);
                else if (z === 'mov') { m.vb = encuadreMovimiento(m); setVB(m); }
                else { m.vb = { ...m.bbox }; setVB(m); }
            });
            c.addEventListener('wheel', ev => {
                ev.preventDefault();
                const pt = puntoSvg(m, ev);
                zoomEn(m, ev.deltaY > 0 ? 1.15 : 1 / 1.15, pt.x, pt.y);
            }, { passive: false });
            let drag = null;
            c.addEventListener('pointerdown', ev => {
                if (ev.button !== 0 || ev.target.closest('.zoom, .ficha')) return;
                drag = { x: ev.clientX, y: ev.clientY, vb: { ...m.vb }, mov: false, k: m.svg.getScreenCTM().a };
            });
            window.addEventListener('pointermove', ev => {
                if (!drag) return;
                const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
                if (!drag.mov && Math.hypot(dx, dy) < 4) return;
                drag.mov = true;
                c.classList.add('drag');
                m.vb.x = drag.vb.x - dx / drag.k;
                m.vb.y = drag.vb.y - dy / drag.k;
                setVB(m);
            });
            window.addEventListener('pointerup', () => {
                if (drag?.mov) m.suprimirClic = true;
                drag = null;
                c.classList.remove('drag');
            });
        }

        function activarEventos(m) {
            const tip = $('#tip');
            m.svg.addEventListener('pointermove', ev => {
                const el = ev.target.closest('.lote');
                if (!el) { tip.style.display = 'none'; return; }
                tip.innerHTML = tooltipHTML(m.p + '-' + el.id);
                mostrarTip(ev);
            });
            m.svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
            m.svg.addEventListener('click', ev => {
                if (m.suprimirClic) { m.suprimirClic = false; return; }
                const el = ev.target.closest('.lote');
                if (el) clicLote(m.p + '-' + el.id, ev.ctrlKey || ev.metaKey || ev.shiftKey, false);
                else cerrarFicha();
            });
        }

        function mostrarTip(ev) {
            const tip = $('#tip');
            tip.style.display = 'block';
            const r = tip.getBoundingClientRect();
            tip.style.left = Math.min(ev.clientX + 14, innerWidth - r.width - 8) + 'px';
            tip.style.top = Math.min(ev.clientY + 14, innerHeight - r.height - 8) + 'px';
        }

        function pintarMapa(p) {
            const m = S.maps[p];
            if (!m) return;
            const e = esc();
            const neutral = cssVar('--lot-neutral');
            const stroke = cssVar('--lot-stroke');
            const contorno = cssVar('--c-version');
            const haySel = S.selLotes.size > 0;
            m.lots.forEach((el, id) => {
                const clave = p + '-' + id;
                const l = e.lotes[clave];
                const enSel = S.selLotes.has(clave);
                let fill = neutral, op = 1, st = stroke, sw = '0.6', dash = '', stOp = 1;
                if (l && !S.off.has(l.categoria)) {
                    if (CAT[l.categoria].contorno) { st = contorno; sw = '1.6'; dash = '4 3'; }
                    else { fill = CAT[l.categoria].color; op = 0.9; }
                    if (haySel && !enSel) { op = Math.min(op, 0.25); stOp = 0.35; }   // fuera de la selección: atenuado
                } else if (!l && S.off.has('ninguno')) {
                    op = 0.15;
                }
                el.style.fill = fill;
                el.style.fillOpacity = op;
                el.style.stroke = st;
                el.style.strokeOpacity = stOp;
                el.style.strokeWidth = sw;
                el.style.strokeDasharray = dash;
                el.classList.toggle('selm', enSel);
                el.classList.toggle('sel', S.sel === clave);
            });
            pintarInsignias(m);
            const nota = m.cont.querySelector('.map-note');
            if (nota) {
                const txt = notaMapa(p);
                nota.innerHTML = txt;
                nota.hidden = !txt;
            }
            const f = m.cont.querySelector('.ficha');
            if (f && S.sel && proyDeClave(S.sel) === p) f.outerHTML = fichaHTML(S.sel);
            else if (f) f.remove();
        }

        function tooltipHTML(clave) {
            const e = esc();
            const l = e.lotes[clave];
            const mae = S.data.maestro[clave] || {};
            const nombre = mae.nombre || '';
            const cab = `<b>${h(clave)}</b>${nombre ? ' · ' + h(nombre) : ''}`;
            if (!l) return `${cab}<br>Sin movimiento en el período`;
            const lic = e.licitaciones.find(x => x.clave === clave);
            if (l.categoria === 'vende' && lic) {
                return `${cab}<br>Se licita en esta versión${lic.tramo && calendarioTramos(e) ? ' · tramo ' + lic.tramo : ''} · firma ${fmtFecha(lic.fechaFirma)}` +
                    `<br>${fmtN(lic.area)} m² × RD$${fmtN(lic.precio)} = ${fmtM(lic.valor)} · cobro ${fmtM(lic.cobroHorizonte)}`;
            }
            if (l.categoria === 'noVende') {
                const vs = versionesQueLicitan(clave);
                return `${cab}<br>No se licita en esta versión` + (vs.length ? ` · sí en ${vs.length === 1 ? 'la versión' : 'las versiones'} ${rangos(vs)}` : ' · fuera en todas las versiones');
            }
            const monto = l.categoria === 'obra' ? `pagos ${fmtM(l.egresos)}${l.desplazamiento ? ` · movidos +${l.desplazamiento} meses por la versión` : ''}` : `cobros ${fmtM(l.ingresos)}`;
            return `${cab}<br>${CAT[l.categoria].titulo} · ${monto}`;
        }

        function fichaHTML(clave) {
            const e = esc();
            const meses = S.data.meses;
            const l = e.lotes[clave];
            const mae = S.data.maestro[clave] || {};
            const obras = e.obras.filter(o => o.clave === clave);
            const lics = e.licitaciones.filter(x => x.clave === clave);
            const cart = e.cartera.filter(c => c.clave === clave);
            const ret = e.retenidos.filter(r => r.clave === clave);
            const cat = l?.categoria;
            const filas = [];
            let titulo = mae.nombre || obras[0]?.obra || clave;
            let serie = null;
            if (cat === 'obra') {
                titulo = mae.nombre || obras.map(o => o.obra).join(' · ');
                if (obras.length > 1 || !mae.nombre) filas.push(['Obras', obras.map(o => o.obra).join(' · '), true]);
                filas.push(['Contratista', [...new Set(obras.map(o => o.contratista))].join(' · '), true]);
                const contr = obras.filter(o => o.tipo.toLowerCase() !== 'reserva');
                if (contr.length) {
                    filas.push(['Monto del contrato', fmtM(sum(contr.map(o => o.contrato)))]);
                    filas.push(['Adendas', fmtM(sum(contr.map(o => o.adenda)))]);
                }
                filas.push(['Restante por pagar', fmtM(sum(obras.map(o => o.restante)))]);
                filas.push([`Pagos ${fmtMes(meses[0])} → ${fmtMes(ultimoMes())}`, fmtM(sum(obras.map(o => o.totalHorizonte)))]);
                const r = sum(ret.map(x => x.totalHorizonte));
                if (r > 0.5) filas.push(['Devolución de retenidos', fmtM(r)]);
                const post = sum(obras.map(o => o.posterior)) + sum(ret.map(x => x.posterior));
                if (post > 0.5) filas.push([posteriorLbl(), fmtM(post)]);
                filas.push(['Próximo pago', proximo(l.egresosMes, meses)]);
                if (l.desplazamiento) {
                    filas.push(['Pagos movidos por la versión', `+${l.desplazamiento} meses`, true]);
                    // el mismo lote en una versión que no mueve pagos (el programa de Técnica)
                    const v0 = versiones().find(v => combo(v.n, S.escenario)?.lotes[clave] && !combo(v.n, S.escenario).lotes[clave].desplazamiento);
                    if (v0) {
                        const l0 = combo(v0.n, S.escenario).lotes[clave];
                        const i27 = idxAnio('2027');
                        filas.push([`Pagos 2027 (sin mover: versión ${v0.n})`, `${fmtM(sumIdx(l.egresosMes, i27))} (${fmtM(sumIdx(l0.egresosMes, i27))})`]);
                    }
                }
                serie = l.egresosMes;
            } else if (cat === 'adjudicada' || cat === 'vende' || cat === 'noVende') {
                const x = lics[0];
                filas.push(['Adjudicatario', x.adjudicatario || '— por licitar', true]);
                filas.push(['Grupo', x.grupo, true]);
                filas.push(['Área', fmtN(x.area) + ' m²']);
                filas.push(['Precio', `RD$${fmtN(x.precio)}/m²`]);
                filas.push(['Valor de venta', fmtM(x.valor)]);
                if (cat !== 'noVende') {
                    filas.push(['Firma', fmtFecha(x.fechaFirma)]);
                    if (x.tramo && cat === 'vende' && calendarioTramos(e)) filas.push(['Tramo', String(x.tramo)]);
                    if (x.probabilidad < 1) filas.push(['Se vende (escenario)', Math.round(x.probabilidad * 100) + '%']);
                    filas.push([`Cobro ${fmtMes(meses[0])} → ${fmtMes(ultimoMes())}`, fmtM(x.cobroHorizonte)]);
                    if (x.posterior > 0.5) filas.push([posteriorLbl(), fmtM(x.posterior)]);
                    filas.push(['Próximo cobro', proximo(l.ingresosMes, meses)]);
                }
                if (cat !== 'adjudicada') {
                    const vs = versionesQueLicitan(clave);
                    filas.push(['Se licita en las versiones', vs.length ? rangos(vs) : 'ninguna', true]);
                }
                serie = cat === 'noVende' ? null : l.ingresosMes;
            } else if (cat === 'cartera' || cat === 'legal') {
                const c = cart[0];
                filas.push(['Cliente', c.cliente, true]);
                filas.push(['Situación', c.situacion, true]);
                filas.push(['Saldo', fmtM(c.saldo)]);
                filas.push([`Cobro ${fmtMes(meses[0])} → ${fmtMes(ultimoMes())}`, fmtM(c.totalHorizonte)]);
                if (c.recupLegal > 0.5) filas.push([`Recuperación legal (${fmtMes(c.mesRecupLegal)})`, fmtM(c.recupLegal)]);
                if (c.posterior > 0.5) filas.push([posteriorLbl(), fmtM(c.posterior)]);
                filas.push(['Próximo cobro', proximo(l.ingresosMes, meses)]);
                serie = l.ingresosMes;
            } else {
                if (mae.tipo) filas.push(['Tipo', [mae.tipo, mae.subtipo].filter(Boolean).join(' · '), true]);
                if (mae.desarrollador) filas.push(['Desarrollador', mae.desarrollador, true]);
                if (mae.area) filas.push(['Área', fmtN(mae.area) + ' m²']);
                filas.push(['Flujo', 'Sin movimiento en el período', true]);
            }
            const color = cat ? CAT[cat].color : 'var(--mut)';
            let bars = '';
            if (serie) {
                const mx = Math.max(...serie, 1);
                bars = `<div class="bars">${serie.map((v, i) => `<i style="height:${Math.max(2, v / mx * 100)}%;background:${v > 0.5 ? color : 'var(--track)'};opacity:${v > 0.5 ? .85 : 1}" title="${fmtMes(meses[i])} · ${fmtM(v)}"></i>`).join('')}</div>
                    <div class="ax"><span>${fmtMes(meses[0])}</span><span>${fmtMes(ultimoMes())}</span></div>`;
            }
            const otras = (l?.categorias || []).slice(1).map(c => CAT[c].label.toLowerCase());
            const sw = cat && CAT[cat].contorno ? '<i class="sw" style="background:var(--lot-neutral);outline:1.5px dashed var(--c-version)"></i>' : `<i class="sw" style="background:${color}"></i>`;
            return `<div class="ficha" role="dialog" aria-label="Ficha del lote ${h(clave)}">
                <button class="x" title="Cerrar" onclick="cerrarFicha()">×</button>
                <div class="t">${sw}${cat ? CAT[cat].titulo : 'Sin movimiento'} · ${h(clave)}</div>
                <h5>${h(titulo)}</h5>
                <table>${filas.map(([a, b, txt]) => `<tr><td>${h(a)}</td><td class="${txt ? 'txt' : ''}">${h(b)}</td></tr>`).join('')}</table>
                ${bars}
                ${otras.length ? `<div class="also">También: ${h(otras.join(', '))}</div>` : ''}
            </div>`;
        }

        // Clic en un lote (mapa o tabla): solo → ese lote queda seleccionado (otro clic lo suelta);
        // con Ctrl/Shift → se suma o se quita de la selección. La selección filtra cifras, gráfico y barras.
        function clicLote(clave, multiple, desdeTabla) {
            if (multiple) {
                if (S.selLotes.has(clave)) {
                    S.selLotes.delete(clave);
                    if (S.sel === clave) S.sel = null;
                } else {
                    S.selLotes.add(clave);
                    S.sel = clave;
                }
            } else if (S.selLotes.size === 1 && S.selLotes.has(clave)) {
                S.selLotes.clear();
                S.sel = null;
            } else {
                S.selLotes = new Set([clave]);
                S.sel = clave;
            }
            // Si el lote estaba en una capa oculta, se vuelve a mostrar esa capa
            const l = esc().lotes[clave];
            const capa = l ? l.categoria : (/^(CJB|CPAG)-/.test(clave) && RE_LOTE.test(clave.replace(/^(CJB|CPAG)-/, '')) ? null : 'virtual');
            if (S.sel === clave && capa && S.off.has(capa)) S.off.delete(capa);
            mostrarFicha();
            actualizarFiltros();
            const m = S.maps[proyDeClave(clave)];
            if (desdeTabla && S.sel === clave && m?.lots.has(clave.slice(proyDeClave(clave).length + 1))) {
                $('#cardMapa').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Abre la ficha del lote S.sel (si está dibujado en el mapa) y cierra las demás
        function mostrarFicha() {
            document.querySelectorAll('.ficha').forEach(f => f.remove());
            if (!S.sel) return;
            const p = proyDeClave(S.sel);
            const m = S.maps[p];
            if (m && m.lots.has(S.sel.slice(p.length + 1))) m.cont.insertAdjacentHTML('beforeend', fichaHTML(S.sel));
        }

        function cerrarFicha() {
            S.sel = null;
            document.querySelectorAll('.ficha').forEach(f => f.remove());
            proyectosVista().forEach(pintarMapa);
            marcarFilas();
        }

        function quitarDeSeleccion(clave) {
            S.selLotes.delete(clave);
            if (S.sel === clave) S.sel = null;
            mostrarFicha();
            actualizarFiltros();
        }

        // Botón «Quitar filtros»: sin selección, todas las capas visibles y vista Consolidado
        function quitarFiltros() {
            S.selLotes.clear();
            S.off.clear();
            S.sel = null;
            document.querySelectorAll('.ficha').forEach(f => f.remove());
            Object.values(S.maps).forEach(m => { m.vb = { ...m.bbox }; setVB(m); });
            if (S.proyecto !== 'Consolidado') { S.proyecto = 'Consolidado'; render(); }
            else actualizarFiltros();
        }

        // ---------------------------------------------------------------- gráficos
        function opcionesBase() {
            const tick = cssVar('--tx2'), grid = cssVar('--chart-grid'), base = cssVar('--chart-base');
            return {
                animation: false,
                maintainAspectRatio: false,
                interaction: { mode: 'index', intersect: false },
                plugins: {
                    legend: { position: 'bottom', labels: { boxWidth: 10, boxHeight: 10, color: tick, font: { family: 'Inter', size: 11 } } },
                    tooltip: {
                        callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}` }
                    }
                },
                scales: {
                    x: { grid: { display: false }, ticks: { color: tick, font: { size: 10 }, maxRotation: 0, autoSkipPadding: 6 } },
                    y: {
                        grid: { color: c => c.tick.value === 0 ? base : grid },
                        border: { display: false },
                        ticks: { color: tick, font: { size: 10 }, callback: v => v.toLocaleString('en-US') },
                        afterFit: s => { s.width = 52; }   // misma anchura en los dos paneles: los meses quedan alineados
                    }
                }
            };
        }

        // Línea vertical entre dic-27 y ene-28: desde ahí el modelo no tiene ventas, obras nuevas ni compras
        const marca2028 = {
            id: 'marca2028',
            afterDraw(chart) {
                const i = S.data.meses.indexOf('2028-01');
                if (i < 1) return;
                const x = chart.scales.x, a = chart.chartArea, ctx = chart.ctx;
                const px = (x.getPixelForValue(i - 1) + x.getPixelForValue(i)) / 2;
                ctx.save();
                ctx.strokeStyle = cssVar('--chart-base');
                ctx.setLineDash([3, 3]);
                ctx.beginPath(); ctx.moveTo(px, a.top); ctx.lineTo(px, a.bottom); ctx.stroke();
                if (chart.options.plugins.marca2028?.texto) {
                    ctx.setLineDash([]);
                    ctx.fillStyle = cssVar('--mut');
                    ctx.font = '600 10px Inter, sans-serif';
                    ctx.fillText(chart.options.plugins.marca2028.texto, px + 5, a.top + 10);
                }
                ctx.restore();
            }
        };

        function renderChartFlujo(T) {
            const e = esc();
            const modo = T.filtro ? 'seleccion' : S.modoChart;
            document.querySelectorAll('#segChart button').forEach(b => {
                b.classList.toggle('on', b.dataset.v === (modo === 'seleccion' ? 'proyecto' : modo));
                if (b.dataset.v === 'proyecto') b.textContent = T.filtro ? 'Selección' : (consolidado() ? 'Proyectos' : S.proyecto);
            });
            const labels = S.data.meses.map(fmtMes);
            const M = v => v / 1e6;
            const ink = cssVar('--chart-line'), crit = cssVar('--st-crit'), warn = cssVar('--st-warn'), mut = cssVar('--mut'), card = cssVar('--card');
            const v = versionInfo();
            let dsA, dsB;
            if (modo === 'fideicomiso') {
                $('#c1Title').innerHTML = `Flujo de caja del Fideicomiso <span>${v ? 'versión ' + v.n + ' · ' : ''}${h(S.escenario)} · incluye gastos fijos</span>`;
                $('#capA').textContent = 'Saldo de caja al cierre de cada mes (RD$ M) · líneas grises: las otras versiones · línea punteada: desde ene-2028 no hay ventas nuevas';
                $('#capB').textContent = 'Entradas (arriba) y salidas (abajo) de cada mes (RD$ M)';
                const otras = versiones().filter(x => x.n !== S.version && combo(x.n)).map(x => ({
                    type: 'line', label: `Versión ${x.n}`, data: combo(x.n).mensual.saldo.map(M), borderColor: conAlfa(mut, 0.45),
                    borderWidth: 1, pointRadius: 0, pointHoverRadius: 0, order: 3, fantasma: true
                }));
                dsA = [
                    ...otras,
                    { type: 'line', label: 'Colchón mínimo', data: e.mensual.colchon.map(M), borderColor: warn, borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, order: 2 },
                    {
                        type: 'line', label: v ? `Saldo · versión ${v.n}` : 'Saldo de caja', data: e.mensual.saldo.map(M), borderColor: ink, backgroundColor: ink,
                        borderWidth: 2.5, pointRadius: 0, pointHoverRadius: 4, order: 1,
                        segment: { borderColor: c => (c.p0.parsed.y < 0 || c.p1.parsed.y < 0) ? crit : ink }
                    }
                ];
                const I = e.mensual.ingresos, E = e.mensual.egresos;
                const vendidos = [I.cartera, I.recupLegal, I.lic2026].reduce(addArr, zeros());
                const version = [I.lic2027, I.adicionales, I.zfi, I.cpag2027].reduce(addArr, zeros());
                const obra = [E.obrasCJB, E.obrasCPAG, E.mantGeneral, E.complementarias, E.costoAtraso, E.retenidos].reduce(addArr, zeros());
                const noObra = [E.gastosFijos, E.obligaciones, E.pacc].reduce(addArr, zeros());
                dsB = [
                    barra('Lotes vendidos (cartera y LIC 2026-01)', vendidos, '--c-vendidos'),
                    barra('Lotes de esta versión', version, '--c-version'),
                    barra('Intereses y otros', I.otros, '--c-otros'),
                    barra('Obra (cubicaciones, retenidos, mantenimiento, complementarias)', obra.map(x => -x), '--c-obra'),
                    barra('No-obra (gastos fijos y obligaciones)', noObra.map(x => -x), '--c-noobra')
                ];
            } else {
                const quien = T.filtro ? 'la selección' : (consolidado() ? 'CJB + CPAG' : S.proyecto);
                $('#c1Title').innerHTML = `Lotes y obras de ${h(quien)} <span>sin gastos fijos</span>` +
                    (T.filtro ? '<a onclick="quitarFiltros()">quitar filtros →</a>' : '');
                $('#capA').textContent = 'Aporte neto acumulado: ingresos de lotes − pagos a obras (RD$ M)';
                $('#capB').textContent = 'Cobros de lotes (arriba) y pagos a obras (abajo) de cada mes (RD$ M)';
                dsA = [{
                    type: 'line', label: 'Aporte neto acumulado', data: T.acum.map(M), borderColor: ink, backgroundColor: ink, borderWidth: 2.5,
                    pointRadius: 0, pointHoverRadius: 4, segment: { borderColor: c => (c.p0.parsed.y < 0 || c.p1.parsed.y < 0) ? crit : ink }
                }];
                dsB = [
                    barra('Lotes vendidos', T.vendidosMes, '--c-vendidos'),
                    barra('Lotes de esta versión', T.versionMes, '--c-version'),
                    barra('Pagos a obras y retenidos', addArr(T.obrasMes, T.retMes).map(x => -x), '--c-obra')
                ];
            }
            dsB = dsB.filter(d => d.data.some(x => Math.abs(x) > 1e-6));
            function barra(label, serie, varColor) {
                return { type: 'bar', label, data: serie.map(M), backgroundColor: cssVar(varColor), borderColor: card, borderWidth: 1, borderSkipped: false, borderRadius: 2, maxBarThickness: 18, stack: 'f' };
            }

            const optA = opcionesBase();
            optA.plugins.tooltip.filter = it => !it.dataset.fantasma;
            optA.plugins.legend.labels.filter = (it, data) => {
                const ds = data.datasets[it.datasetIndex];
                return !ds.fantasma || ds === data.datasets.find(d => d.fantasma);   // una sola entrada para las otras versiones
            };
            optA.plugins.legend.labels.generateLabels = chart => Chart.defaults.plugins.legend.labels.generateLabels(chart)
                .map(it => chart.data.datasets[it.datasetIndex].fantasma ? { ...it, text: 'Otras versiones' } : it);
            optA.plugins.marca2028 = {};
            const optB = opcionesBase();
            optB.scales.x.stacked = true;
            optB.scales.y.stacked = true;
            optB.plugins.tooltip.callbacks.label = c => `${c.dataset.label}: ${Math.abs(c.parsed.y).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}`;
            optB.plugins.tooltip.callbacks.footer = items => {
                if (!items.length || modo !== 'fideicomiso') return '';
                const i = items[0].dataIndex;
                return `Neto del mes: ${fmtM(e.mensual.neto[i])} · saldo: ${fmtM(e.mensual.saldo[i])}`;
            };
            optB.plugins.marca2028 = {};
            ['saldo', 'flujo'].forEach(k => { if (S.charts[k]) S.charts[k].destroy(); });
            S.charts.saldo = new Chart($('#cSaldo'), { data: { labels, datasets: dsA }, options: optA, plugins: [marca2028] });
            S.charts.flujo = new Chart($('#cFlujo'), { data: { labels, datasets: dsB }, options: optB, plugins: [marca2028] });
        }

        function barrasHTML(titulo, filas, pie) {
            const visibles = filas.filter(r => r[1] > 0.5);
            const ceros = filas.filter(r => r[1] <= 0.5).map(r => r[0]);
            const mx = Math.max(...visibles.map(r => r[1]), 1);
            const m0 = fmtMes(S.data.meses[0]), m1 = fmtMes(ultimoMes());
            let html = `<h3>${titulo} <span>${m0} → ${m1}</span></h3>`;
            if (!visibles.length) html += `<p class="empty">${hayFiltro() ? 'Sin montos en la selección.' : 'Sin montos en este proyecto para esta versión y escenario.'}</p>`;
            html += visibles.map(([n, v, c]) => `<div class="r"><span>${h(n)}</span><div class="t"><i style="width:${(v / mx * 100).toFixed(1)}%;background:${c}"></i></div><b>${fmtM(v)}</b></div>`).join('');
            if (ceros.length && visibles.length) html += `<p class="foot">En 0 en esta versión y escenario: ${h(ceros.join(', '))}.</p>`;
            if (pie) html += `<p class="foot">${pie}</p>`;
            return html;
        }

        function renderBarras(T) {
            $('#barsIn').innerHTML = barrasHTML('¿De dónde viene el dinero?', T.detalleIng,
                '<i class="sw" style="background:var(--c-vendidos)"></i>lotes ya vendidos · <i class="sw" style="background:var(--c-version)"></i>lotes que dependen de la versión');
            let pie = '<i class="sw" style="background:var(--c-obra)"></i>obra · <i class="sw" style="background:var(--c-noobra)"></i>no-obra (cuentan para la regla 75/25)';
            const gf = sum(esc().mensual.egresos.gastosFijos);
            if (T.filtro) pie = `Solo la selección. Los gastos fijos (${fmtM(gf)}) son del Fideicomiso y no se reparten por lote.`;
            else if (!consolidado()) pie = `Gastos fijos (${fmtM(gf)}) son comunes del Fideicomiso y no se reparten por proyecto.`;
            $('#barsOut').innerHTML = barrasHTML('¿A dónde va?', T.detalleEgr, pie);
        }

        // ---------------------------------------------------------------- tablas
        function ordenar(rows, sort, getters) {
            const g = getters[sort.k];
            return rows.sort((a, b) => {
                const x = g(a), y = g(b);
                return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * sort.dir;
            });
        }

        function thHTML(cols, sort) {
            return cols.map(([k, txt, cls]) =>
                `<th data-k="${k}" class="${cls || ''} ${sort.k === k ? 'sorted' + (sort.dir > 0 ? ' asc' : '') : ''}">${txt}</th>`).join('');
        }

            const e = esc();
            const meses = S.data.meses;
            const todas = e.obras.filter(o => enVista(o.proyecto));
            const rows = todas.filter(o => o.totalHorizonte > 0.5);
            const resto = todas.filter(o => o.totalHorizonte <= 0.5);
            const getters = {
                obra: o => o.obra, contratista: o => o.contratista, contrato: o => o.contrato, adenda: o => o.adenda,
                restante: o => o.restante,
                proximo: o => { const i = o.pagos.findIndex(v => v > 0.5); return i < 0 ? 99 : i; }, pagos: o => o.totalHorizonte

            const mx = Math.max(...rows.flatMap(o => o.pagos), 1);
