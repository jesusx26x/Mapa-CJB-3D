            const esReserva = o => o.tipo.toLowerCase() === 'reserva';
            const obraRGB = cssVar('--c-obra');
            $('#cardObras').innerHTML = `<h3>🏗️ Obras con pagos · ${titulo} <span>ordenadas por pagos en el período</span></h3>
                <div class="tbwrap"><table class="tb ord" id="tbObras"><thead><tr>${thHTML(cols, S.sortObras)}</tr></thead><tbody>
                ${rows.map(o => `<tr data-clave="${h(o.clave)}" data-mapa="${o.enMapa}">
                    <td><b>${h(o.obra)}</b>${o.desplazamiento ? ` <em class="tag tg-obra" title="La versión mueve sus pagos ${o.desplazamiento} meses">+${o.desplazamiento} m</em>` : ''}<span class="sub ${o.enMapa ? '' : 'porconf'}">${o.enMapa ? h(o.clave) : h(o.clave) + ' · ' + etiquetaVirtual(o.clave)}</span></td>
                    <td>${h(o.contratista)}</td>
                    <td class="n">${esReserva(o) ? '<span title="Reserva, no es un contrato">—</span>' : fmtM(o.contrato)}</td>
                    <td class="n">${esReserva(o) ? '—' : fmtM(o.adenda)}</td>
                    <td class="n">${fmtM(o.restante)}</td>
                    <td class="n">${proximo(o.pagos, meses)}</td>
                    <td class="n"><b>${fmtM(o.totalHorizonte)}</b></td>
                    <td><div class="heat" style="grid-template-columns:repeat(${meses.length},1fr)">${o.pagos.map((v, i) => v > 0.5
                        ? `<i style="background:${conAlfa(obraRGB, (0.15 + 0.85 * v / mx).toFixed(2))}" title="${fmtMes(meses[i])} · ${fmtM(v)}"></i>` : '<i></i>').join('')}</div></td>
                </tr>`).join('')}
                </tbody><tfoot><tr><td colspan="2">Total</td>
                    <td class="n">${fmtM(sum(rows.filter(o => !esReserva(o)).map(o => o.contrato)))}</td>
                    <td class="n">${fmtM(sum(rows.filter(o => !esReserva(o)).map(o => o.adenda)))}</td>
                    <td class="n">${fmtM(sum(rows.map(o => o.restante)))}</td><td></td>
                    <td class="n">${fmtM(sum(rows.map(o => o.totalHorizonte)))}</td><td></td></tr></tfoot></table></div>
                ${resto.length ? `<p class="note">+ ${resto.length} obras sin pagos en el período (contratos ${fmtM(sum(resto.map(o => o.contrato)))} · adendas ${fmtM(sum(resto.map(o => o.adenda)))} · restante ${fmtM(sum(resto.map(o => o.restante)))}).</p>` : ''}
                <p class="note">Clic en una fila para ver solo esa obra · Ctrl+clic para sumar varias.</p>`;
            $('#tbObras thead').addEventListener('click', ev => cambiarOrden(ev, S.sortObras, renderObras));
            $('#tbObras tbody').addEventListener('click', clicFila);
            marcarFilas();
        }

        function chipLic(l) {
            const c = catLic(l);
            if (c === 'adjudicada') return '<em class="tag tg-adj">Vendido · LIC 2026-01</em>';
            if (c === 'vende') {
                const tramo = l.tramo && calendarioTramos() ? ' · tramo ' + l.tramo : '';
                return `<em class="tag tg-lic">${l.generico ? 'Se licita · por definir' : 'Se licita' + tramo}</em>` +
                    (l.probabilidad < 1 ? ` <em class="tag tg-off">se vende ${Math.round(l.probabilidad * 100)}%</em>` : '');
            }
            const vs = versionesQueLicitan(l.clave);
            return `<em class="tag tg-off">${vs.length ? 'Solo en versiones ' + rangos(vs) : (l.grupo === 'ZFI 2027-02' ? 'ZFI · fuera' : 'Fuera en todas')}</em>`;
        }

        const ORDEN_ESTADO = { vende: 0, adjudicada: 1, noVende: 2 };
        function renderLicitaciones() {
            const e = esc();
            const rows = e.licitaciones.filter(l => enVista(l.proyecto));
            const titulo = consolidado() ? 'CJB + CPAG' : S.proyecto;
            const v = versionInfo();
            const head = `<h3>🏷️ Lotes que se venden · ${titulo}${v ? ` · versión ${v.n}` : ''} <span>vendidos en LIC 2026-01 y lotes por licitar</span></h3>`;
            if (!rows.length) {
                $('#cardLic').innerHTML = head + `<p class="empty">No hay lotes ${h(S.proyecto)} en venta ni en cartera.</p>`;
                return;
            }
            const i27 = idxAnio('2027'), i28 = idxAnio('2028');
            const c27 = l => sumIdx(l.cobros, i27), c28 = l => sumIdx(l.cobros, i28);
            const getters = {
                lote: l => l.id, estado: l => ORDEN_ESTADO[catLic(l)] * 10 + (l.tramo || 0), area: l => l.area, precio: l => l.precio,
                firma: l => l.fechaFirma || '', c27, c28, cobro: l => l.cobroHorizonte
            };
            ordenar(rows, S.sortLic, getters);
            const cols = [['lote', 'Lote'], ['estado', 'En esta versión'], ['area', 'Área m²', 'n'], ['precio', 'RD$/m²', 'n'], ['firma', 'Firma', 'n'],
            ['c27', 'Cobro 2027', 'n'], ...(i28.length ? [['c28', 'Cobro 2028', 'n']] : []), ['cobro', 'Período', 'n']];
            const activa = l => catLic(l) !== 'noVende';
            const tot = f => fmtM(sum(rows.map(f)));
            $('#cardLic').innerHTML = head + `<div class="tbwrap"><table class="tb ord" id="tbLic"><thead><tr>${thHTML(cols, S.sortLic)}</tr></thead><tbody>
                ${rows.map(l => `<tr data-clave="${h(l.clave)}" data-mapa="${l.enMapa}">
                    <td class="${activa(l) ? '' : 'dim'}"><b>${h(consolidado() || l.generico ? l.clave : l.id)}</b><span class="sub">${h(l.generico ? 'Santiago · ' + l.id : (l.adjudicatario || l.grupo))}</span></td>
                    <td>${chipLic(l)}</td>
                    <td class="n">${fmtN(l.area)}</td>
                    <td class="n">${fmtN(l.precio)}</td>
                    <td class="n">${activa(l) ? fmtFecha(l.fechaFirma) : '—'}</td>
                    <td class="n">${fmtM(c27(l))}</td>
                    ${i28.length ? `<td class="n">${fmtM(c28(l))}</td>` : ''}
                    <td class="n"><b>${fmtM(l.cobroHorizonte)}</b></td>
                </tr>`).join('')}
                </tbody><tfoot><tr><td colspan="5">Total</td><td class="n">${tot(c27)}</td>${i28.length ? `<td class="n">${tot(c28)}</td>` : ''}<td class="n">${tot(l => l.cobroHorizonte)}</td></tr></tfoot></table></div>
                <p class="note">El precio y la firma de los lotes restantes cambian con la versión; la probabilidad de venta, con el escenario. Clic en una fila para ver ese lote.</p>`;
            $('#tbLic thead').addEventListener('click', ev => cambiarOrden(ev, S.sortLic, renderLicitaciones));
            $('#tbLic tbody').addEventListener('click', clicFila);
            marcarFilas();
        }

        // Resumen por trimestre del flujo del Fideicomiso (equivale a la hoja Presupuesto_2027)
        function renderTrimestres() {
            const e = esc();
            const meses = S.data.meses;
            const I = e.mensual.ingresos, E = e.mensual.egresos;
            const periodos = [];
            const ids = f => meses.map((m, i) => f(m) ? i : -1).filter(i => i >= 0);
            if (meses.some(m => m.startsWith('2026'))) periodos.push(['Oct–dic 2026', ids(m => m.startsWith('2026'))]);
            [1, 2, 3, 4].forEach(t => periodos.push([`T${t} 2027`, ids(m => m.startsWith('2027') && Math.ceil(+m.slice(5) / 3) === t)]));
            periodos.push(['Año 2027', ids(m => m.startsWith('2027'))]);
            if (meses.some(m => m.startsWith('2028'))) periodos.push(['Año 2028', ids(m => m.startsWith('2028'))]);
            const vendidos = [I.cartera, I.recupLegal, I.lic2026].reduce(addArr, zeros());
            const version = [I.lic2027, I.adicionales, I.zfi, I.cpag2027].reduce(addArr, zeros());
            const obra = [E.obrasCJB, E.obrasCPAG, E.mantGeneral, E.complementarias, E.costoAtraso, E.retenidos].reduce(addArr, zeros());
            const noObra = [E.gastosFijos, E.obligaciones, E.pacc].reduce(addArr, zeros());
            const saldoIni = p => p[1][0] > 0 ? e.mensual.saldo[p[1][0] - 1] : e.kpis.saldoInicial;
            const cel = v => `<td class="n ${v < -0.5 ? 'neg' : ''}">${fmtM(v)}</td>`;
            const fila = (lab, f, cls = '', sw = '') => `<tr class="${cls}"><td>${sw}${lab}</td>${periodos.map(p => cel(f(p))).join('')}</tr>`;
            const suma = s => p => sumIdx(s, p[1]);
            const swc = v => `<i class="sw" style="background:var(${v})"></i>`;
            $('#cardTrim').innerHTML = `<h3>📋 Presupuesto por trimestre · Fideicomiso <span>versión ${S.version} · ${h(S.escenario)} · RD$ millones · la tabla del gráfico de flujo</span></h3>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Concepto</th>${periodos.map(p => `<th class="n">${p[0]}</th>`).join('')}</tr></thead><tbody>
                ${fila('Saldo inicial', saldoIni)}
                <tr class="grp"><td colspan="${periodos.length + 1}">Ingresos</td></tr>
                ${fila('Lotes vendidos (cartera y LIC 2026-01)', suma(vendidos), '', swc('--c-vendidos'))}
                ${fila('Lotes de esta versión', suma(version), '', swc('--c-version'))}
                ${fila('Intereses y otros', suma(I.otros), '', swc('--c-otros'))}
                ${fila('Total ingresos', suma(I.total), 'tot')}
                <tr class="grp"><td colspan="${periodos.length + 1}">Egresos</td></tr>
                ${fila('Obra (cubicaciones, retenidos, mantenimiento, complementarias)', suma(obra), '', swc('--c-obra'))}
                ${fila('No-obra (gastos fijos y obligaciones)', suma(noObra), '', swc('--c-noobra'))}
                ${fila('Total egresos', suma(E.total), 'tot')}
                ${fila('Flujo neto', suma(e.mensual.neto), 'tot')}
                ${fila('Saldo final', p => e.mensual.saldo[p[1][p[1].length - 1]], 'tot')}
                ${fila('Saldo más bajo', p => Math.min(...p[1].map(i => e.mensual.saldo[i])))}
                </tbody></table></div>
                <p class="note">Las compras de las áreas no se restan del flujo: el techo es el presupuesto de cada área para su PAC. 2028 no tiene ventas ni obras nuevas: solo lo ya programado y los gastos fijos ajustados.</p>`;
        }

        function cambiarOrden(ev, sort, fn) {
            const k = ev.target.closest('th')?.dataset.k;
            if (!k || k === 'heat') return;
            if (sort.k === k) sort.dir *= -1; else { sort.k = k; sort.dir = ['obra', 'contratista', 'lote', 'estado', 'firma', 'proximo'].includes(k) ? 1 : -1; }
            fn();
        }

        function clicFila(ev) {
            const tr = ev.target.closest('tr[data-clave]');
            if (!tr) return;
            clicLote(tr.dataset.clave, ev.ctrlKey || ev.metaKey || ev.shiftKey, true);
            if (tr.dataset.mapa !== 'true') {
                // Partida sin lote dibujado: se selecciona igual (filtra las cifras), pero no hay ficha en el mapa
                const t = $('#tip');
                t.innerHTML = `<b>${h(tr.dataset.clave)}</b><br>Sin lote en el mapa (${etiquetaVirtual(tr.dataset.clave)}). Las cifras muestran esta partida.`;
                t.style.display = 'block';
                t.style.left = (ev.clientX + 12) + 'px';
                t.style.top = (ev.clientY + 12) + 'px';
                setTimeout(() => { t.style.display = 'none'; }, 2200);
            }
        }

        function marcarFilas() {
            document.querySelectorAll('.tb.ord tbody tr').forEach(tr => tr.classList.toggle('sel', S.selLotes.has(tr.dataset.clave)));
        }

        // ---------------------------------------------------------------- control de cuadre
        // La suma de las capas (lotes en el mapa + «sin lote») debe dar las cifras del mapa.
        // Además, sin filtros, las cifras (calculadas desde las partidas) deben dar lo publicado por el Excel.
        function verificarTotales(T) {
            const e = esc();
            const { cap, obrasVirt, ingVirt } = capasVista();
            const obrasCapas = cap.obra.monto + obrasVirt;
            const ingCapas = ['adjudicada', 'vende', 'noVende', 'cartera', 'legal'].reduce((a, c) => a + cap[c].monto, 0) + ingVirt;
            const otros = consolidado() ? sum(e.mensual.ingresos.otros) : 0;
            let ingExcel, obrasExcel;
            if (consolidado()) {
                ingExcel = e.kpis.ingresos;
                obrasExcel = sum(e.mensual.egresos.obrasCJB) + sum(e.mensual.egresos.obrasCPAG) + sum(e.mensual.egresos.mantGeneral);
            } else {
                const pp = e.porProyecto[S.proyecto] || { ingresos: {}, egresos: {} };
                ingExcel = sum(pp.ingresos.total);
                obrasExcel = sum(pp.egresos.obras) + sum(pp.egresos.mantGeneral);
            }
            const ok = [obrasCapas - T.obras, ingCapas + otros - T.ing, ingExcel - T.ing, obrasExcel - T.obras].every(d => Math.abs(d) < 1);
            const msg = `[Flujo 2027] v${S.version} ${S.proyecto} · ${S.escenario}: ingresos cifra ${fmtM(T.ing)} · capas ${fmtM(ingCapas + otros)} · Excel ${fmtM(ingExcel)}` +
                ` | obras cifra ${fmtM(T.obras)} · capas ${fmtM(obrasCapas)} · Excel ${fmtM(obrasExcel)}`;
            if (ok) console.info('✔ ' + msg); else console.warn('✖ ' + msg);
            return ok;
        }

        // ---------------------------------------------------------------- pestaña 2: comparar versiones
        const METRICAS = [
            { k: 'dic27', lab: 'Saldo a dic-2027', tipo: 'saldo', val: c => (c.kpis2027 || c.kpis).saldoFinal },
            { k: 'dic28', lab: 'Saldo a dic-2028', tipo: 'saldo', val: c => c.kpis.saldoFinal },
            { k: 'min', lab: 'Saldo más bajo', tipo: 'saldo', val: c => c.kpis.saldoMin, sub: c => fmtMesLargo(c.kpis.mesSaldoMin) },
            { k: 'neg', lab: 'Meses en negativo', tipo: 'conteo', val: c => c.kpis.mesesNegativos },
            { k: 'caja', lab: 'Disponible 2027 (compras + Santiago)', tipo: 'saldo', val: c => c.split ? c.split.disponible : null },
            { k: 'ratio', lab: 'No-obra / obra 2027', tipo: 'ratio', val: c => c.split ? c.split.ratio : null }
        ];

        function renderVersiones() {
            const vs = versiones();
            if (!vs.length) {
                $('#vistaVersiones').innerHTML = '<div class="card"><p class="empty">Este modelo no tiene versiones de ventas y obras (llegan con la v1.19).</p></div>';
                return;
            }
            const metricas = METRICAS.filter(m => m.k !== 'dic28' || ultimoMes() === '2028-12');
            const met = metricas.find(m => m.k === S.metrica) || metricas[0];
            S.metrica = met.k;
            $('#vistaVersiones').innerHTML = `
                <div class="card">${matrizHTML(vs, metricas, met)}</div>
                <div class="card">${multiplesHTML(vs)}</div>
                <div class="dos"><div class="card">${supuestosHTML(vs)}</div><div class="card">${riesgosHTML()}</div></div>`;
        }

        function matrizHTML(vs, metricas, met) {
            const vals = vs.flatMap(v => ESCENARIOS.map(e => combo(v.n, e) ? met.val(combo(v.n, e)) : null)).filter(x => x != null);
            const maxAbs = Math.max(...vals.map(Math.abs), 1);
            const maxN = Math.max(...vals, 1);
            const celda = (v, e) => {
                const c = combo(v.n, e);
                const x = c ? met.val(c) : null;
                if (x == null) return '<td class="cel vacia">—</td>';
                let bg, txt, sub = met.sub ? met.sub(c) : '';
                if (met.tipo === 'saldo') {
                    const t = Math.min(Math.abs(x) / maxAbs, 1);
                    bg = `color-mix(in oklab, var(${x < 0 ? '--div-neg' : '--div-pos'}) ${Math.round(6 + 52 * t)}%, var(--div-mid))`;
                    txt = fmtM(x);
                } else if (met.tipo === 'conteo') {
                    bg = x ? `color-mix(in oklab, var(--div-neg) ${Math.round(14 + 44 * x / maxN)}%, var(--div-mid))` : 'var(--div-mid)';
                    txt = String(x);
                    sub = x ? (x === 1 ? 'mes' : 'meses') : 'ninguno';
                } else {
                    const ok = x <= c.split.tope + 1e-9;
                    bg = `color-mix(in oklab, var(${ok ? '--st-good' : '--st-crit'}) 24%, var(--div-mid))`;
                    txt = `${ok ? '✓' : '✕'} ${fmtPct(x)}`;
                    sub = ok ? 'cumple 75/25' : 'no cumple';
                }
                const on = v.n === S.version && e === S.escenario ? ' on' : '';
                return `<td class="cel${on}" style="background:${bg}" data-v="${v.n}" data-e="${e}" tabindex="0"
                    title="Versión ${v.n} · ${e}: ${h(met.lab)} ${h(txt)} — clic para verla en el mapa">${h(txt)}${sub ? `<small>${h(sub)}</small>` : ''}</td>`;
            };
            const leyenda = {
                saldo: 'Azul = positivo, rojo = negativo; más intenso = más lejos de cero.',
                conteo: 'Meses en que faltaría dinero para pagar (saldo de caja negativo).',
                ratio: `Tope: el no-obra no debe pasar del ${fmtPct(esc().split?.tope ?? 1 / 3)} de la obra (75/25), contando compras y Santiago.`
            }[met.tipo];
            return `<h3>📊 Las ${vs.length} versiones × 3 escenarios <span>RD$ millones · clic en una celda para verla en el mapa</span></h3>
                <div class="seg mini metricas" id="segMetrica">${metricas.map(m => `<button data-m="${m.k}" class="${m.k === met.k ? 'on' : ''}">${h(m.lab)}</button>`).join('')}</div>
                <div class="tbwrap"><table class="matriz"><thead><tr><th>Versión · de la más prudente a la menos</th>${ESCENARIOS.map(e => `<th>${e}</th>`).join('')}</tr></thead>
                <tbody>${vs.map(v => `<tr class="${v.n === S.version ? 'act' : ''}"><th><span class="vn">${v.n}</span><b>${h(v.nombre)}</b>${esBase(v) ? '<span class="star">★ base</span>' : ''}
                    <small>${h(v.lotesTxt || v.lotesCJB)} · ${h(v.obrasTxt || '')}</small></th>${ESCENARIOS.map(e => celda(v, e)).join('')}</tr>`).join('')}</tbody></table></div>
                <p class="note">${leyenda} El borde marca la versión y el escenario elegidos.</p>`;
        }

        // Pequeños múltiplos: el saldo de cada versión con la misma escala (escenario elegido)
        function multiplesHTML(vs) {
            const meses = S.data.meses;
            const series = vs.map(v => combo(v.n, S.escenario)?.mensual.saldo || null);
            const todos = series.flat().filter(x => x != null);
            const colchon = esc().mensual.colchon?.[0] || 0;
            const lo = Math.min(0, ...todos), hi = Math.max(colchon, ...todos);
            const W = 300, H = 92, pad = 3;
            const X = i => pad + i * (W - 2 * pad) / (meses.length - 1);
            const Y = v => pad + (hi - v) * (H - 2 * pad) / ((hi - lo) || 1);
            const i28 = meses.indexOf('2028-01');
            const tarjeta = (v, s) => {
                if (!s) return '';
                const c = combo(v.n, S.escenario);
                const k27 = c.kpis2027 || c.kpis;
                let pos = '', neg = '';
                for (let i = 1; i < s.length; i++) {
                    const tramo = `M${X(i - 1).toFixed(1)},${Y(s[i - 1]).toFixed(1)}L${X(i).toFixed(1)},${Y(s[i]).toFixed(1)}`;
                    if (s[i - 1] < 0 || s[i] < 0) neg += tramo; else pos += tramo;
                }
                const area = `M${X(0).toFixed(1)},${Y(0).toFixed(1)}` + s.map((x, i) => `L${X(i).toFixed(1)},${Y(x).toFixed(1)}`).join('') + `L${X(s.length - 1).toFixed(1)},${Y(0).toFixed(1)}Z`;
                const b = val => `<b class="${val < 0 ? 'neg' : ''}">${fmtM(val)}</b>`;
                return `<div class="mini${v.n === S.version ? ' on' : ''}" data-v="${v.n}" tabindex="0" title="Versión ${v.n} · clic para elegirla">
                    <div class="mh"><span class="vn">${v.n}</span><b>${h(v.nombre)}</b>${esBase(v) ? '<span class="star">★</span>' : ''}</div>
                    <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" data-v="${v.n}" role="img" aria-label="Saldo de caja de la versión ${v.n}">
                        ${i28 > 0 ? `<line x1="${X(i28 - 0.5)}" x2="${X(i28 - 0.5)}" y1="0" y2="${H}" class="m28"/>` : ''}
                        <line x1="0" x2="${W}" y1="${Y(0)}" y2="${Y(0)}" class="m0"/>
                        <line x1="0" x2="${W}" y1="${Y(colchon)}" y2="${Y(colchon)}" class="mc"/>
                        <path d="${area}" class="ma"/><path d="${pos}" class="ml"/><path d="${neg}" class="mln"/>
                        <line class="mx" x1="0" x2="0" y1="0" y2="${H}" visibility="hidden"/>
                    </svg>
                    <div class="mf">dic-27 ${b(k27.saldoFinal)} · ${fmtMes(ultimoMes())} ${b(c.kpis.saldoFinal)}<br>mínimo ${b(c.kpis.saldoMin)} en ${fmtMes(c.kpis.mesSaldoMin)} · ${pl(c.kpis.mesesNegativos)} en negativo</div>
                </div>`;
            };
            return `<h3>📈 Saldo de caja mes a mes en cada versión <span>escenario ${h(S.escenario)} · misma escala en todas (${fmtM(lo)} a ${fmtM(hi)})</span></h3>
                <div class="multiples">${vs.map((v, i) => tarjeta(v, series[i])).join('')}</div>
                <p class="note">Línea ámbar punteada = colchón mínimo (${fmtM(colchon)}). Rojo = saldo negativo. La línea vertical punteada marca enero de 2028, desde donde no hay ventas nuevas.
                    Pase el ratón para ver cada mes; clic para elegir la versión.</p>`;
        }

        function supuestosHTML(vs) {
            const rep = (S.data.reprogramacion || []).map(r => `${h(r.obra)} +${r.meses}`).join(', ');
            const conRep = vs.filter(v => v.reprogramadas).map(v => v.n);
            const vendido = v => typeof v.vendidoTxt === 'string' && v.vendidoTxt ? h(v.vendidoTxt) : fmtPct(v.pctVendido, 0);
            return `<h3>🧩 Qué supone cada versión <span>Decisiones, sección 8 · la versión cambia ventas y obras; el escenario, los cobros</span></h3>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Versión</th><th>Lotes que se licitan</th><th class="n">RD$/m²</th><th>Calendario</th><th class="n">Se vende (Base)</th><th>Pagos de obra</th></tr></thead>
                <tbody>${vs.map(v => `<tr class="${v.n === S.version ? 'sel' : ''}"><td><span class="vn">${v.n}</span> <b>${h(v.nombre)}</b>${v.antes ? `<span class="sub">antes ${h(v.antes)}</span>` : ''}</td>
                    <td>${h(v.lotesTxt || v.lotesCJB)}</td><td class="n">${fmtN(v.precio)}</td><td>${h(v.calendario)}</td><td class="n">${vendido(v)}</td><td>${h(v.obrasTxt || '')}</td></tr>`).join('')}</tbody></table></div>
                ${rep && conRep.length ? `<p class="note">«Obras reprogramadas» (versiones ${rangos(conRep)}): ${rep} meses. Las versiones con «todas las obras +3 meses» mueven todos los pagos pendientes.</p>` : ''}`;
        }

        function riesgosHTML() {
            const R = S.data.riesgos || [];
            const fmtP = (p, x) => /meses|plazo/i.test(p) ? `${x} meses` : fmtPct(x, Math.round(x * 1000) % 10 ? 1 : 0);
            const imp = ESCENARIOS.map(e => combo(S.version, e)?.panel?.impactos || []);
            const conceptos = (imp.find(x => x.length) || []).map(x => x.concepto)
                .filter(cn => imp.some(x => Math.abs(x.find(y => y.concepto === cn)?.monto || 0) > 0.5));
            return `<h3>🎲 Qué cambia entre escenarios <span>Panel, supuestos de cobro y riesgos</span></h3>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Supuesto</th>${ESCENARIOS.map(e => `<th class="n">${e}</th>`).join('')}</tr></thead>
                <tbody>${R.map(r => `<tr><td>${h(r.parametro)}<span class="sub">${h(r.explicacion)}</span></td>${ESCENARIOS.map(e => `<td class="n${e === S.escenario ? ' on' : ''}">${fmtP(r.parametro, r[e])}</td>`).join('')}</tr>`).join('')}
                ${conceptos.length ? `<tr class="grp"><td colspan="4">Efecto en la versión ${S.version} (RD$ millones)</td></tr>` +
                    conceptos.map(cn => `<tr><td>${h(cn)}</td>${imp.map((x, i) => `<td class="n${ESCENARIOS[i] === S.escenario ? ' on' : ''}">${fmtM(x.find(y => y.concepto === cn)?.monto || 0)}</td>`).join('')}</tr>`).join('') : ''}
                </tbody></table></div>`;
        }

        // Pase del ratón sobre un pequeño múltiplo: línea vertical y valor del mes
        function hoverMini(ev) {
            const svg = ev.target.closest('.mini svg');
            if (!svg) return;
            const n = +svg.dataset.v;
            const s = combo(n, S.escenario)?.mensual.saldo;
            if (!s) return;
            const r = svg.getBoundingClientRect();
            const i = Math.max(0, Math.min(s.length - 1, Math.round((ev.clientX - r.left) / r.width * (s.length - 1))));
            const x = 3 + i * (300 - 6) / (s.length - 1);
            const ln = svg.querySelector('.mx');
            ln.setAttribute('x1', x); ln.setAttribute('x2', x); ln.setAttribute('visibility', 'visible');
            $('#tip').innerHTML = `<b class="${s[i] < 0 ? 'neg' : ''}">${fmtM(s[i])}</b> · saldo a ${fmtMesLargo(S.data.meses[i])}<br>Versión ${n} · ${h(S.escenario)}`;
            mostrarTip(ev);
        }

        // ---------------------------------------------------------------- pestaña 3: compras y 75/25
        function renderCompras() {
            const e = esc();
            if (!e.split || !e.techos) {
                $('#vistaCompras').innerHTML = '<div class="card"><p class="empty">Este modelo no tiene techos de compras ni regla 75/25 (llegan con la v1.15).</p></div>';
                return;
            }
            $('#vistaCompras').innerHTML = `
                <div class="dos"><div class="card">${techoHTML(e)}</div><div class="card">${ratioHTML(e)}</div></div>
                <div class="dos">
                    <div class="card"><h3>🧾 Compras de las áreas por año (PAC) <span>RD$ millones · bienes y servicios de suplidores</span></h3>
                        <div class="chartC"><canvas id="cPac" role="img" aria-label="Compras de las áreas por año"></canvas></div>${pacTablaHTML(e)}</div>
                    <div class="card">${pasosHTML(e)}</div>
                </div>
                <div class="card">${areasHTML(e)}</div>
                <div class="dos"><div class="card">${alcanzaHTML(e)}</div><div class="card">${santiagoHTML(e)}</div></div>
                <div class="card">${gasto26HTML()}</div>
                <div class="card">${suplidoresHTML()}</div>`;
            renderChartPac(e);
        }

        // El techo global de compras nuevas es el menor de tres límites; lo que sobra del disponible va a Santiago
        function techoHTML(e) {
            const sp = e.split, te = e.techos;
            const limites = [
                ['Caja: lo que se puede comprometer en 2027 sin bajar del colchón', sp.disponible],
                ['Historial: compras nuevas según lo que las áreas compraron antes', sp.techoPolitica],
                ['Regla 75/25: lo que permite el tope de gasto no-obra', sp.techoRegla]
            ];
            const min = Math.min(...limites.map(l => l[1]));
            const mx = Math.max(...limites.map(l => l[1]), 1);
            const filas = limites.map(([lab, v]) => {
                const esMin = Math.abs(v - min) < 0.5;
                return `<div class="hb${esMin ? ' min' : ''}"><span>${h(lab)}${esMin ? ' <em class="tag tg-off">el menor</em>' : ''}</span>
                    <div class="t"><i style="width:${v > 0.5 ? Math.max(v / mx * 100, 0.8) : 0}%;background:${esMin ? 'var(--c-compras)' : 'var(--c-otros)'}"></i></div><b>${fmtM(v)}</b></div>`;
            }).join('');
            const techo = sp.techoGlobal, stgo = sp.reservaSantiago, libre = Math.max(sp.sinAsignar || 0, 0), disp = sp.disponible;
            const tot = Math.max(disp, techo + stgo + libre, 1);
            const seg = (v, c, t) => v > 0.5 ? `<i style="width:${(v / tot * 100).toFixed(2)}%;background:${c}" title="${t} ${fmtM(v)}"></i>` : '';
            const q = ['2027-03', '2027-06', '2027-09', '2027-12'].map(m => te.meses.indexOf(m)).filter(i => i >= 0);
            const stgoQ = i => sp.stgoAcum ? sp.stgoAcum[sp.meses.indexOf(te.meses[i])] || 0 : 0;
            return `<h3>🛒 ¿Cuánto pueden comprar las áreas en 2027? <span>versión ${S.version} · ${h(S.escenario)}</span></h3>
                <p class="sub">El techo global de compras nuevas es el <b>menor</b> de tres límites:</p>
                ${filas}
                <div class="resultado"><span>Techo global de compras nuevas 2027</span><b>${fmtM(techo)}</b></div>
                <p class="h4">El dinero disponible a dic-2027 (${fmtM(disp)}) se reparte así</p>
                ${disp > 0.5 ? `<div class="stack grande">${seg(techo, 'var(--c-compras)', 'Compras nuevas')}${seg(stgo, 'var(--c-stgo)', 'Santiago')}${seg(libre, 'var(--c-otros)', 'Sin asignar')}</div>` : '<p class="sub">No hay dinero disponible sin bajar del colchón.</p>'}
                <p class="sub"><i class="sw" style="background:var(--c-compras)"></i>Compras nuevas de las áreas <b>${fmtM(techo)}</b> ·
                    <i class="sw" style="background:var(--c-stgo)"></i>Reserva para Santiago <b>${fmtM(stgo)}</b> (tope ${fmtM(sp.reservaTope || 0)})${libre > 0.5 ? ` · <i class="sw" style="background:var(--c-otros)"></i>sin asignar <b>${fmtM(libre)}</b>` : ''}</p>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Acumulado al cierre de</th>${q.map(i => `<th class="n">${fmtMes(te.meses[i])}</th>`).join('')}</tr></thead><tbody>
                    <tr><td>Caja que se puede comprometer</td>${q.map(i => `<td class="n">${fmtM(te.capacidadAcum[i])}</td>`).join('')}</tr>
                    <tr><td>Compras liberadas a las áreas</td>${q.map(i => `<td class="n">${fmtM(te.liberacionPermitida[i])}</td>`).join('')}</tr>
                    ${sp.stgoAcum ? `<tr><td>Santiago: se puede comprometer</td>${q.map(i => `<td class="n">${fmtM(stgoQ(i))}</td>`).join('')}</tr>` : ''}
                </tbody></table></div>
                <p class="note">Nada se compromete antes de que la caja lo permita. Las compras no se restan del flujo: el techo es el presupuesto de cada área para su PAC.</p>`;
        }

        // Regla 75/25: lo pagado por año y 2027 en la versión elegida, con su composición
        function ratioHTML(e) {
            const sp = e.split, tope = sp.tope;
            const hist = (S.data.gastoReal?.porAnio || []).filter(p => !/oct/i.test(p.periodo));
            const barras = [
                ...hist.map(p => ({ lab: p.periodo.replace(/\s*\(.*\)$/, ''), sub: 'pagado', r: p.ratio })),
                { lab: `2027 · v${S.version}`, sub: 'antes de compras y Santiago', r: sp.ratioAntes },
                { lab: `2027 · v${S.version}`, sub: 'con compras y Santiago', r: sp.ratio, act: true }
            ];
            const escala = Math.max(0.42, ...barras.map(b => b.r)) * 1.12;
            const col = b => {
                const ok = b.r <= tope + 1e-9;
                return `<div class="vb${b.act ? ' act' : ''}"><b>${ok ? '✓' : '✕'} ${fmtPct(b.r)}</b><i style="height:${(b.r / escala * 100).toFixed(1)}%;background:${ok ? 'var(--st-good)' : 'var(--st-crit)'}"></i></div>`;
            };
            const lin = sp.lineas.filter(l => Math.abs(l.monto) > 0.5);
            const esObra = l => /^obra/i.test(l.clase);
            const obra = sum(lin.filter(esObra).map(l => l.monto)), noObra = sum(lin.filter(l => !esObra(l)).map(l => l.monto));
            const fila = l => `<tr><td><i class="sw" style="background:${esObra(l) ? 'var(--c-obra)' : 'var(--c-noobra)'}"></i>${h(l.linea)}</td><td class="n">${esObra(l) ? fmtM(l.monto) : ''}</td><td class="n">${esObra(l) ? '' : fmtM(l.monto)}</td></tr>`;
            return `<h3>⚖️ Obra vs. no-obra (regla 75/25) <span>el gasto no-obra no debe pasar del ${fmtPct(tope)} de la obra</span></h3>
                <div class="vplot" style="--n:${barras.length};--tope:${(tope / escala * 100).toFixed(1)}%">${barras.map(col).join('')}<div class="vtope"><span>tope ${fmtPct(tope)}</span></div></div>
                <div class="vlabs" style="--n:${barras.length}">${barras.map(b => `<span>${h(b.lab)}<small>${h(b.sub)}</small></span>`).join('')}</div>
                <div class="tbwrap"><table class="tb"><thead><tr><th>2027 · versión ${S.version} · ${h(S.escenario)}</th><th class="n">Obra</th><th class="n">No-obra</th></tr></thead><tbody>
                    ${lin.map(fila).join('')}
                    <tr class="tot"><td>Antes de compras y Santiago</td><td class="n">${fmtM(obra)}</td><td class="n">${fmtM(noObra)}</td></tr>
                    <tr><td><i class="sw" style="background:var(--c-compras)"></i>+ Compras nuevas de las áreas (no-obra)</td><td class="n"></td><td class="n">${fmtM(sp.techoGlobal)}</td></tr>
                    <tr><td><i class="sw" style="background:var(--c-stgo)"></i>+ Reserva para Santiago (cuenta como obra)</td><td class="n">${fmtM(sp.obraConSantiago - obra)}</td><td class="n"></td></tr>
                    <tr class="tot"><td>Total · no-obra / obra = ${fmtPct(sp.ratio)}</td><td class="n">${fmtM(sp.obraConSantiago)}</td><td class="n">${fmtM(sp.noObraConCompras)}</td></tr>
                </tbody></table></div>
                <p class="note">${sp.mantEsObra === 'Sí' ? 'El mantenimiento de la ciudad cuenta como obra (decisión del 28-oct-2026). ' : ''}${h(sp.cumple || '')}${sp.recorte > 0.5 ? ` Recorte de no-obra necesario: ${fmtM(sp.recorte)}.` : ''}</p>`;
        }

        function renderChartPac(e) {
            const CH = S.data.compras;
            const cv = $('#cPac');
            if (!CH || !cv) return;
            const r = CH.resumen;   // [2024, 2025, 2026 ene–sep, 2026 oct–dic estimado]
            const M = v => v == null ? null : v / 1e6;
            const labels = ['2024', '2025', '2026 (con oct–dic estimado)', `2027 · versión ${S.version}`];
            const oper = [r.operacion[0], r.operacion[1], r.operacion[2] + r.operacion[3], e.compras?.pacEnGastosFijos ?? 0].map(M);
            const bienes = [r.bienes[0], r.bienes[1], r.bienes[2] + r.bienes[3], e.split?.techoGlobal ?? 0].map(M);
            const P = CH.porAnio.periodos, planFila = CH.porAnio.filas.find(f => /plan/i.test(f.concepto));
            const planDe = anio => { const i = P.findIndex(p => p.startsWith(anio) && (anio !== '2026' || /año/.test(p))); return i >= 0 && planFila ? planFila.valores[i] : null; };
            const plan = [planDe('2024'), planDe('2025'), planDe('2026'), null].map(M);
            const card = cssVar('--card');
            const opt = opcionesBase();
            opt.scales.x.stacked = true;
            opt.scales.y.stacked = true;
            delete opt.scales.y.afterFit;
            opt.plugins.tooltip.callbacks.footer = items => {
                const i = items[0]?.dataIndex;
                return i == null ? '' : `PAC total: ${((oper[i] || 0) + (bienes[i] || 0)).toLocaleString('en-US', { maximumFractionDigits: 1, minimumFractionDigits: 1 })}`;
            };
            if (S.charts.pac) S.charts.pac.destroy();
            S.charts.pac = new Chart(cv, {
                data: {
                    labels, datasets: [
                        { type: 'bar', label: 'Operación y servicios (ya en gastos fijos en 2027)', data: oper, backgroundColor: cssVar('--c-noobra'), borderColor: card, borderWidth: 1, borderSkipped: false, borderRadius: 2, maxBarThickness: 40, stack: 'pac' },
                        { type: 'bar', label: 'Bienes y tecnología · en 2027: compras nuevas (techo)', data: bienes, backgroundColor: cssVar('--c-compras'), borderColor: card, borderWidth: 1, borderSkipped: false, borderRadius: 2, maxBarThickness: 40, stack: 'pac' },
                        { type: 'line', label: 'Plan aprobado (PACC / PAC)', data: plan, borderColor: cssVar('--chart-line'), backgroundColor: cssVar('--chart-line'), showLine: false, pointRadius: 5, pointStyle: 'rectRot', stack: 'plan' }
                    ]
                },
                options: opt
            });
        }

        function pacTablaHTML(e) {
            const CH = S.data.compras;
            if (!CH) return '';
            const filas = CH.porAnio.filas;
            const P = CH.porAnio.periodos;
            const v = (x, ratio) => x == null ? '<span class="dim">n/d</span>' : (ratio ? fmtPct(x, 0) : fmtM(x));
            return `<div class="tbwrap"><table class="tb"><thead><tr><th>PAC real (hoja Compras_Historicas)</th>${P.map(p => `<th class="n">${h(p.replace(/\s*\(.*\)$/, ''))}</th>`).join('')}</tr></thead><tbody>
                ${filas.map(f => `<tr><td>${h(f.concepto)}</td>${f.valores.map(x => `<td class="n">${v(x, /pagado \/ plan/i.test(f.concepto))}</td>`).join('')}</tr>`).join('')}
                </tbody></table></div>
                <p class="note">PAC = bienes y servicios comprados a suplidores. Fuera: fee fiduciario, nómina, seguro de salud, electricidad, alquiler de la sede y cargos bancarios.
                    En 2027 la operación (${fmtM(e.compras?.pacEnGastosFijos || 0)}) ya va dentro de los gastos fijos del flujo; solo las compras nuevas salen del techo.</p>`;
        }

        // Cómo se llega al techo de compras nuevas por historial (Compras_Historicas, sección 4)
        function pasosHTML(e) {
            const c = e.compras;
            if (!c) return '<p class="empty">Sin hoja Compras_Historicas en este modelo.</p>';
            const pasos = [
                [`PAC del año de referencia (${c.criterio || 'mejor año'})`, c.pacRef, 'var(--c-otros)', ''],
                [`A precios de 2027 (+${fmtPct(c.inflacion, 0)} al año × ${c.anios} años)`, c.pacRef2027, 'var(--c-otros)', ''],
                [`+ Equipo de ${c.plazas} plazas nuevas (${fmtM(c.equipoPlaza)} c/u), redondeado`, c.historial2027, 'var(--c-otros)', ''],
                ['= PAC total 2027 de las áreas', c.pacTotal, 'var(--c-otros)', 'tot'],
                ['− Operación que ya pagan los gastos fijos (2026 × (1 + ajuste del escenario))', c.pacEnGastosFijos, 'var(--c-noobra)', ''],
                ['= Compras nuevas por historial', c.techoHistorial, 'var(--c-compras)', 'res']
            ];
            const mx = Math.max(...pasos.map(p => p[1] || 0), 1);
            return `<h3>🧮 Techo de compras nuevas por historial <span>${h(S.escenario)} · RD$ millones</span></h3>
                ${pasos.map(([lab, v, col, cls]) => `<div class="hb ${cls}"><span>${h(lab)}</span><div class="t"><i style="width:${v > 0.5 ? Math.max(v / mx * 100, 0.8) : 0}%;background:${col}"></i></div><b>${fmtM(v || 0)}</b></div>`).join('')}
                <div class="resultado"><span>Techo global aplicado (el menor entre caja, historial y 75/25)</span><b>${fmtM(e.split.techoGlobal)}</b></div>
                <p class="note">Antes (v1.18, solo bienes y tecnología): ${fmtM(c.techoV118 || 0)}. Necesidad limpia de las áreas según su historial: ${fmtM(c.necesidadAreas || 0)}.
                    El ajuste del escenario cambia la operación que ya pagan los gastos fijos y, con ella, el techo.</p>`;
        }

        // Techo por área: PAC de operación (ya en gastos fijos) + compras nuevas, y cuándo se libera
        function areasHTML(e) {
            const te = e.techos;
            const A = te.areas.filter(a => a.pacTotal > 0.5 || a.techo > 0.5).sort((a, b) => (b.pacOperacion + b.techo) - (a.pacOperacion + a.techo));
            const fuera = te.areas.filter(a => !(a.pacTotal > 0.5 || a.techo > 0.5));
            const mx = Math.max(...A.map(a => a.pacOperacion + a.techo), 1);
            const T = k => sum(A.map(a => a[k]));
            const barra = a => `<div class="stack" style="margin:0;height:12px;width:${((a.pacOperacion + a.techo) / mx * 100).toFixed(1)}%;min-width:2px;background:none">
                ${a.pacOperacion > 0.5 ? `<i style="flex:${a.pacOperacion};background:var(--c-noobra)"></i>` : ''}${a.techo > 0.5 ? `<i style="flex:${a.techo};background:var(--c-compras)"></i>` : ''}</div>`;
            return `<h3>🏢 Presupuesto de compras por área 2027 <span>versión ${S.version} · ${h(S.escenario)} · RD$ millones · techo global ${fmtM(e.split.techoGlobal)}</span></h3>
                <p class="sub"><i class="sw" style="background:var(--c-noobra)"></i>PAC de operación que ya pagan los gastos fijos · <i class="sw" style="background:var(--c-compras)"></i>compras nuevas (techo del área, se libera por trimestre)</p>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Dirección / área</th><th class="n">Empleados 2027</th><th style="min-width:180px">PAC total del área</th><th class="n">PAC total</th>
                    <th class="n">Compras nuevas</th><th class="n">T1</th><th class="n">T2</th><th class="n">T3</th><th class="n">T4</th><th class="n">de lo cual tecnología</th></tr></thead>
                <tbody>${A.map(a => `<tr><td><b>${h(a.area)}</b><span class="sub">${h(a.tipo)}</span></td><td class="n">${fmtN(a.empleados2027)}</td><td>${barra(a)}</td>
                    <td class="n">${fmtM(a.pacTotal)}</td><td class="n"><b>${fmtM(a.techo)}</b></td><td class="n">${fmtM(a.t1)}</td><td class="n">${fmtM(a.t2)}</td><td class="n">${fmtM(a.t3)}</td><td class="n">${fmtM(a.t4)}</td><td class="n">${fmtM(a.tecnologia)}</td></tr>`).join('')}</tbody>
                <tfoot><tr><td>Total</td><td class="n">${fmtN(T('empleados2027'))}</td><td></td><td class="n">${fmtM(T('pacTotal'))}</td><td class="n">${fmtM(T('techo'))}</td>
                    <td class="n">${fmtM(T('t1'))}</td><td class="n">${fmtM(T('t2'))}</td><td class="n">${fmtM(T('t3'))}</td><td class="n">${fmtM(T('t4'))}</td><td class="n">${fmtM(T('tecnologia'))}</td></tr></tfoot></table></div>
                <p class="note">${e.split.techoGlobal < 0.5 ? '<b>En esta versión y escenario el techo global es 0:</b> las áreas solo tienen su PAC de operación (lo que ya pagan los gastos fijos). ' : ''}Cada área compra su propia tecnología y licencias; Tecnología valida. ${fuera.length ? `Sin compras propias: ${fuera.map(a => h(a.area.split(':')[0].split('(')[0].trim())).join(', ')} (sus pertrechos y nómina ya van en los gastos fijos).` : ''}</p>`;
        }

        function alcanzaHTML(e) {
            const A = e.panel?.alcanza || [];
            if (!A.length) return '<p class="empty">El Panel de este modelo no tiene la tabla «¿Alcanza para repartir…?».</p>';
            const fmtV = (v, concepto) => {
                if (typeof v === 'number') return /no-obra \/ obra/i.test(concepto) ? fmtPct(v) : fmtM(v);
                if (/^\d{4}-\d{2}$/.test(v)) return fmtMesLargo(v);
                if (v === 'Sí') return '<span class="estado ok" style="margin:0"><span class="ico">✓</span>Sí</span>';
                if (v === 'No') return '<span class="estado mal" style="margin:0"><span class="ico">✕</span>No</span>';
                return h(v);
            };
            return `<h3>❓ ¿Alcanza para repartir las compras y cumplir 75/25? <span>Panel del Excel · versión ${S.version} · ${h(S.escenario)}</span></h3>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Concepto</th><th class="n">Con el techo del modelo</th><th class="n">Con ${fmtM(A[0].evaluar)} de compras</th></tr></thead>
                <tbody>${A.map(r => `<tr${/^palanca/i.test(r.concepto) ? ' class="tot"' : ''}><td title="${h(r.nota)}">${h(r.concepto)}</td><td class="n">${fmtV(r.modelo, r.concepto)}</td><td class="n">${fmtV(r.evaluar, r.concepto)}</td></tr>`).join('')}</tbody></table></div>
                <p class="note">La segunda columna usa el monto escrito en el Panel (E25). Pase el ratón por un concepto para ver la explicación del Excel.</p>`;
        }

        function santiagoHTML(e) {
            const sp = e.split;
            const U = sp.usosSantiago || [];
            const total = sum(U.map(u => u.monto));
            return `<h3>🏞️ Reserva para Santiago: en qué se usaría <span>${fmtM(sp.reservaSantiago)} de ${fmtM(sp.reservaTope || total)} · en orden de prioridad</span></h3>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Uso</th><th style="min-width:120px">Asignado / estimado</th><th class="n">Asignado</th><th class="n">Estimado</th><th>Cuándo</th></tr></thead>
                <tbody>${U.map(u => `<tr><td title="${h(u.condicion)}">${h(u.concepto)}</td>
                    <td><div class="bullet"><span class="pres" style="width:100%"></span><span class="pag" style="width:${u.monto ? Math.min(u.asignado / u.monto * 100, 100) : 0}%;background:var(--c-stgo)"></span></div></td>
                    <td class="n">${fmtM(u.asignado)}</td><td class="n">${fmtM(u.monto)}</td><td>${h(u.cuando)}</td></tr>`).join('')}</tbody>
                <tfoot><tr><td>Total</td><td></td><td class="n">${fmtM(sum(U.map(u => u.asignado)))}</td><td class="n">${fmtM(total)}</td><td></td></tr></tfoot></table></div>
                <p class="note">La reserva cuenta como obra para la regla 75/25. Lo que falta (${fmtM(Math.max(total - sum(U.map(u => u.asignado)), 0))}) se cubriría con ventas de Santiago u otros fondos. Pase el ratón por cada uso para ver su condición.</p>`;
        }

        function gasto26HTML() {
            const G = S.data.gastoReal;
            if (!G) return '<p class="empty">Sin hoja Gasto_Real_2026 en este modelo.</p>';
            const P = G.presupuesto.filter(p => !/^ingresos/i.test(p.categoria));
            const ing = G.presupuesto.find(p => /^ingresos/i.test(p.categoria));
            const mx = Math.max(...P.filter(p => !/^total|^no-obra/i.test(p.categoria)).map(p => Math.max(p.presEneSep, p.pagado)), 1);
            const fila = p => {
                const tot = /^total|^no-obra/i.test(p.categoria);
                const col = /proyectos|obra\)/i.test(p.categoria) ? 'var(--c-obra)' : 'var(--c-noobra)';
                const pct = p.presEneSep ? p.pagado / p.presEneSep : 0;
                return `<tr class="${tot ? 'tot' : ''}"><td>${h(p.categoria)}</td>
                    <td>${tot ? '' : `<div class="bullet"><span class="pres" style="width:${(p.presEneSep / mx * 100).toFixed(1)}%"></span><span class="pag" style="width:${(p.pagado / mx * 100).toFixed(1)}%;background:${col}"></span></div>`}</td>
                    <td class="n">${fmtM(p.pagado)}</td><td class="n">${fmtM(p.presEneSep)}</td><td class="n">${fmtPct(pct, 0)}</td><td class="n">${fmtM(p.presAnio)}</td></tr>`;
            };
            return `<h3>📒 Gasto real 2026: presupuesto frente a lo pagado <span>enero–septiembre · RD$ millones · hoja Gasto_Real_2026</span></h3>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Categoría</th><th style="min-width:200px">Pagado / presupuesto ene–sep</th><th class="n">Pagado</th><th class="n">Presup. ene–sep</th><th class="n">Ejecutado</th><th class="n">Presup. año</th></tr></thead>
                <tbody>${P.map(fila).join('')}</tbody></table></div>
                <p class="note">Barra gris = presupuesto de enero a septiembre; barra de color = lo pagado.${ing ? ` Ingresos cobrados ene–sep: ${fmtM(ing.pagado)} de ${fmtM(ing.presEneSep)} presupuestados.` : ''}</p>`;
        }

        function suplidoresHTML() {
            const C = S.data.compras;
            if (!C) return '';
            const L = C.lineas.filter(l => l.clase && l.clase !== 'Fuera del PAC').sort((a, b) => sum(b.valores) - sum(a.valores));
            return `<details><summary><h3>🧾 Compras por suplidor (PAC histórico) <span>${L.length} líneas del flujo de Finanzas · hoja Compras_Historicas, sección 2 · clic para abrir</span></h3></summary>
                <div class="tbwrap"><table class="tb"><thead><tr><th>Suplidor o línea</th><th>Qué es</th><th>Clase</th><th>Área que lo compra</th>${C.periodos.map(p => `<th class="n">${h(p.replace(/\s*\(.*\)$/, ''))}</th>`).join('')}</tr></thead>
                <tbody>${L.map(l => `<tr><td>${h(l.linea.replace(/\s*\(.*\)$/, ''))}</td><td>${h(l.que)}</td><td>${h(l.clase)}</td><td>${h(l.area)}</td>${l.valores.map(v => `<td class="n">${fmtM(v)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
                <p class="note">Fuera del PAC (no se cuentan): fee fiduciario, nómina y prestaciones, seguro de salud, electricidad, alquiler y mantenimiento de la sede, cargos bancarios.</p></details>`;
        }

        // ---------------------------------------------------------------- acciones
        function cambiarProyecto(p) {
            if (p === S.proyecto) return;
            S.proyecto = p;
            S.sel = null;
            S.selLotes.clear();
            render();
        }

        function cambiarVersion(n) {
            if (n === S.version || !combo(n, S.escenario)) return;
            S.version = n;
            render();
        }

        function cambiarVista(v) {
            if (v === S.vista) return;
            S.vista = v;
            render();
            window.scrollTo({ top: 0 });
        }

        function renderSegVersion() {
            const vs = versiones();
            $('#grupoVersion').hidden = !vs.length;
            $('#segVersion').innerHTML = vs.map(v => `<button data-v="${v.n}" role="radio" class="${esBase(v) ? 'base' : ''}" title="${v.n} · ${h(v.nombre)}${esBase(v) ? ' (base)' : ''}">${v.n}</button>`).join('');
        }

        function actualizarBotonTema() {
            const b = $('#themeToggle');
            const light = isLight();
            b.querySelector('.ico').textContent = light ? '🌙' : '☀️';
            b.querySelector('.txt').textContent = light ? 'Modo oscuro' : 'Modo claro';
        }

        function exportarPDF() {
            const acts = document.querySelectorAll('.acts, .header-nav, .zoom');
            acts.forEach(el => el.style.visibility = 'hidden');
            const opts = {
                margin: 6,
                filename: `Flujo_2027_${S.vista}_v${S.version}_${S.proyecto}_${S.escenario}_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: cssVar('--bg') },
                jsPDF: { unit: 'mm', format: 'a3', orientation: 'landscape' }
            };
            html2pdf().set(opts).from(document.body).save().finally(() => acts.forEach(el => el.style.visibility = ''));
        }

        function enlazarControles() {
            $('#tabs').addEventListener('click', ev => {
                const v = ev.target.closest('button')?.dataset.vista;
                if (v) cambiarVista(v);
            });
            $('#segProyecto').addEventListener('click', ev => {
                const v = ev.target.closest('button')?.dataset.v;
                if (v) cambiarProyecto(v);
            });
            $('#segEscenario').addEventListener('click', ev => {
                const v = ev.target.closest('button')?.dataset.v;
                if (v && v !== S.escenario) { S.escenario = v; ajustarSeleccion(); render(); }
            });
            $('#segVersion').addEventListener('click', ev => {
                const b = ev.target.closest('button');
                if (b && !b.disabled) cambiarVersion(+b.dataset.v);
            });
            $('#segChart').addEventListener('click', ev => {
                const v = ev.target.closest('button')?.dataset.v;
                if (!v) return;
                if (hayFiltro() && v === 'fideicomiso') { quitarFiltros(); S.modoChart = 'fideicomiso'; return; }
                S.modoChart = v;
                renderChartFlujo(totalesVista());
            });
            $('#leg').addEventListener('click', ev => {
                const c = ev.target.closest('button.li')?.dataset.cat;
                if (!c) return;
                if (S.off.has(c)) S.off.delete(c); else S.off.add(c);
                actualizarFiltros();
            });
            // Pestaña «Comparar versiones»: métrica, celdas de la matriz (→ mapa) y pequeños múltiplos (→ elegir versión)
            const vv = $('#vistaVersiones');
            const elegirDesde = ev => {
                const m = ev.target.closest('#segMetrica button')?.dataset.m;
                if (m) { S.metrica = m; renderVersiones(); return; }
                const cel = ev.target.closest('td.cel[data-v]');
                if (cel) { S.version = +cel.dataset.v; S.escenario = cel.dataset.e; S.vista = 'flujo'; render(); window.scrollTo({ top: 0 }); return; }
                const mini = ev.target.closest('.mini[data-v]');
                if (mini) { $('#tip').style.display = 'none'; cambiarVersion(+mini.dataset.v); }
            };
            vv.addEventListener('click', elegirDesde);
            vv.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); elegirDesde(ev); } });
            vv.addEventListener('pointermove', ev => {
                if (ev.target.closest('.mini svg')) hoverMini(ev);
                else $('#tip').style.display = 'none';
            });
            vv.addEventListener('pointerleave', () => { $('#tip').style.display = 'none'; });
            vv.addEventListener('pointerout', ev => {
                const svg = ev.target.closest?.('.mini svg');
                if (svg && !svg.contains(ev.relatedTarget)) svg.querySelector('.mx')?.setAttribute('visibility', 'hidden');
            });
            $('#btnReset').addEventListener('click', quitarFiltros);
            $('#selbar').addEventListener('click', ev => {
                const q = ev.target.closest('[data-quitar]')?.dataset.quitar;
                if (q) quitarDeSeleccion(q);
                else if (ev.target.closest('[data-reset]')) quitarFiltros();
            });
            $('#themeToggle').addEventListener('click', () => document.body.classList.toggle('light-mode'));
            $('#btnFullscreen').addEventListener('click', () => {
                if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
            });
            $('#btnPdf').addEventListener('click', exportarPDF);
            document.addEventListener('keydown', ev => { if (ev.key === 'Escape') cerrarFicha(); });
            window.addEventListener('hashchange', () => {
                const antes = S.proyecto;
                leerHash();
                if (!S.data) return;
                ajustarSeleccion();
                if (S.proyecto !== antes) { S.sel = null; S.selLotes.clear(); }
                render();
            });
            // Al cambiar el tema: repintar mapas y gráficos con los colores del tema
            new MutationObserver(() => {
                actualizarBotonTema();
                if (!S.data) return;
                render();
            }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
        }

        async function iniciar() {
            leerHash();
            actualizarBotonTema();
            enlazarControles();
            try {
                const r = await fetch(DATA_URL, { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                S.data = prepararDatos(await r.json());
            } catch (err) {
                console.error('No se pudo leer ' + DATA_URL, err);
                $('#contenido').innerHTML = `<div class="card error-card"><h3>⚠️ No se encontraron los datos del flujo</h3>
                    <p>Ejecute <b>«Actualizar Flujo 2027.bat»</b> (raíz de Mapa) para generar <b>${DATA_URL}</b> desde el Excel,
                    y abra esta página con <b>SISTEMA_VBC.bat</b> (http://127.0.0.1:9000/flujo-2027.html).</p><code>${h(err.message)}</code></div>`;
                return;
            }
            ajustarSeleccion();
            renderSegVersion();
            render();
        }

        window.FlujoVBC = { S, totalesVista, clicLote, quitarFiltros, combo, verificarTotales: () => verificarTotales(totalesVista()) };
        document.addEventListener('DOMContentLoaded', iniciar);
    </script>
</body>

</html>
