    <script>
        // ================================================================
        // Pestaña «Flujo 2027» – lee data/flujo_2027.json (generado por
        // «Actualizar Flujo 2027.bat») y pinta el mapa, gráficos y tablas.
        // ================================================================
        const DATA_URL = 'data/flujo_2027.json';
        const PROYECTOS = {
            CJB: { nombre: 'Ciudad Juan Bosch', svg: 'MAPA NUEVO - CJB/assets/mapa.svg' },
            CPAG: { nombre: 'Ciudad Pres. Antonio Guzmán', svg: 'MAPA CPAG/assets/mapa.svg' }
        };
        const CAT = {
            obra: { label: 'Obras en ejecución', titulo: 'Obra en ejecución', color: '#f97316', fichaTx: '#c2410c' },
            adjudicada: { label: 'Adjudicados LIC 2026-01', titulo: 'Adjudicado LIC 2026-01', color: '#0d9488', fichaTx: '#0f766e' },
            licitar: { label: 'Por licitar 2027', titulo: 'Por licitar 2027', color: '#22c55e', fichaTx: '#15803d' },
            opcional: { label: 'Lotes adicionales', titulo: 'Lote adicional', color: '#a3e635', fichaTx: '#4d7c0f' },
            cartera: { label: 'Cartera con plan de pagos', titulo: 'Cartera con plan de pagos', color: '#3b82f6', fichaTx: '#1d4ed8' },
            legal: { label: 'Cartera en gestión legal', titulo: 'Cartera en gestión legal', color: '#ef4444', fichaTx: '#b91c1c' }
        };
        const ORDEN_CAT = ['obra', 'adjudicada', 'licitar', 'opcional', 'cartera', 'legal'];
        const RE_LOTE = /^(\d{2}-\d{2}-\d{2}|C-\d{2})$/;
        const MESES_ES = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];

        const S = {
            data: null,
            proyecto: 'CJB',
            escenario: 'Base',
            off: new Set(),
            svgText: {},
            maps: {},
            chart: null,
            sel: null,              // lote con la ficha abierta
            selLotes: new Set(),    // lotes seleccionados: filtran tarjetas, gráficos y barras
            sortObras: { k: 'pagos', dir: -1 },
            sortLic: { k: 'cobro', dir: -1 }
        };

        // ---------------------------------------------------------------- utilidades
        const $ = (sel, root = document) => root.querySelector(sel);
        const h = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const sum = a => (a || []).reduce((x, y) => x + (+y || 0), 0);
        const addArr = (a, b) => a.map((v, i) => v + (b[i] || 0));
        const zeros = () => new Array(15).fill(0);
        const fmtM = v => (v / 1e6).toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 });
        const fmtN = v => Math.round(v).toLocaleString('en-US');
        const fmtMes = k => { const [y, m] = k.split('-'); return MESES_ES[+m - 1] + '-' + y.slice(2); };
        const fmtFecha = iso => { if (!iso) return '—'; const [y, m, d] = iso.split('-'); return `${d}-${MESES_ES[+m - 1]}-${y.slice(2)}`; };
        const isLight = () => document.body.classList.contains('light-mode');
        const cssVar = n => getComputedStyle(document.body).getPropertyValue(n).trim();
        const esc = () => S.data.escenarios[S.escenario];
        const consolidado = () => S.proyecto === 'Consolidado';
        const proyectosVista = () => consolidado() ? ['CJB', 'CPAG'] : [S.proyecto];
        // Filas de detalle que entran en la vista (en Consolidado también las «Por confirmar»)
        const enVista = p => consolidado() || p === S.proyecto;
        const proyDeClave = clave => (clave || '').split('-')[0];
        // Claves sin lote en el mapa: «-GENERAL» (partidas generales), «-ACCESO-…» (vías de acceso fuera del límite)
        // y «POR-CONFIRMAR»/«PORCONF-» (ubicación por confirmar)
        const etiquetaVirtual = clave => /GENERAL$/.test(clave) ? 'general · sin lote en el mapa'
            : /-ACCESO-/.test(clave) ? 'vía de acceso fuera del límite · sin lote' : 'ubicación por confirmar';
        const proximo = (serie, meses) => {
            const i = serie.findIndex(v => v > 0.5);
            return i < 0 ? '—' : `${fmtMes(meses[i])} · ${fmtM(serie[i])}`;
        };

        // ---------------------------------------------------------------- estado en la URL
        function leerHash() {
            const q = new URLSearchParams(location.hash.slice(1));
            if (['CJB', 'CPAG', 'Consolidado'].includes(q.get('proyecto'))) S.proyecto = q.get('proyecto');
            if (['Conservador', 'Base', 'Optimista'].includes(q.get('escenario'))) S.escenario = q.get('escenario');
        }
        function escribirHash() {
            history.replaceState(null, '', `#proyecto=${S.proyecto}&escenario=${S.escenario}`);
        }

        // ---------------------------------------------------------------- partidas y filtros
        // Cada fila de detalle del JSON (obra, retenido, licitación, cartera) es una «partida» con su
        // clave de lote, su capa de la leyenda y su serie mensual. Las tarjetas, el gráfico y las barras
        // se calculan sumando las partidas activas: las de capas visibles y, si hay lotes seleccionados,
        // solo las de esos lotes.
        const GRUPO_CAT = {
            'LIC 2026-01': 'adjudicada', 'LIC 2027-01': 'licitar', 'ZFI 2027-02': 'licitar', 'Lotes adicionales': 'opcional',
            'CPAG HAB 2027': 'licitar', 'CPAG COM 2027': 'licitar'
        };
        const GRUPO_FUENTE = {
            'LIC 2026-01': 'lic2026', 'LIC 2027-01': 'lic2027', 'ZFI 2027-02': 'zfi', 'Lotes adicionales': 'adicionales',
            'CPAG HAB 2027': 'cpag2027', 'CPAG COM 2027': 'cpag2027'
        };
        const FUENTES_ING = [
            ['cartera', 'Cartera', CAT.cartera.color],
            ['recupLegal', 'Recuperación legal', CAT.legal.color],
            ['lic2026', 'LIC 2026-01', CAT.adjudicada.color],
            ['lic2027', 'LIC 2027-01', CAT.licitar.color],
            ['zfi', 'ZFI', '#16a34a'],
            ['adicionales', 'Lotes adicionales', CAT.opcional.color],
            ['cpag2027', 'Licitaciones CPAG 2027', '#4ade80']
        ];
        const CAPAS_FILTRO = [...ORDEN_CAT, 'virtual'];

        function partidasVista() {
            const e = esc();
            const idx = Object.fromEntries(S.data.meses.map((m, i) => [m, i]));
            const out = [];
            e.obras.filter(o => enVista(o.proyecto)).forEach(o => out.push({
                clave: o.clave, proyecto: o.proyecto, capa: o.enMapa ? 'obra' : 'virtual',
                fuente: o.tipo.toLowerCase() === 'reserva' ? 'mantGeneral' : 'obras', serie: o.pagos, obra: o
            }));
            e.retenidos.filter(r => enVista(r.proyecto)).forEach(r => out.push({
                clave: r.clave, proyecto: r.proyecto, capa: r.enMapa ? 'obra' : 'virtual', fuente: 'retenidos', serie: r.pagos
            }));
            e.licitaciones.filter(l => enVista(l.proyecto)).forEach(l => out.push({
                clave: l.clave, proyecto: l.proyecto, capa: l.enMapa ? (GRUPO_CAT[l.grupo] || 'opcional') : 'virtual',
                fuente: GRUPO_FUENTE[l.grupo] || 'adicionales', serie: l.cobros
            }));
            e.cartera.filter(c => enVista(c.proyecto)).forEach(c => {
                const capa = !c.enMapa ? 'virtual' : (c.situacion.startsWith('Sin plan') ? 'legal' : 'cartera');
                out.push({ clave: c.clave, proyecto: c.proyecto, capa, fuente: 'cartera', serie: c.cobros, cart: c });
                if (c.recupLegal > 0.5 && c.mesRecupLegal in idx) {
                    const serie = zeros();
                    serie[idx[c.mesRecupLegal]] = c.recupLegal;
                    out.push({ clave: c.clave, proyecto: c.proyecto, capa, fuente: 'recupLegal', serie });
                }
            });
            return out;
        }

        const hayFiltro = () => S.selLotes.size > 0 || CAPAS_FILTRO.some(c => S.off.has(c));
        const partidaActiva = p => !S.off.has(p.capa) && (!S.selLotes.size || S.selLotes.has(p.clave));

        function totalesVista() {
            const e = esc();
            const P = S.proyecto;
            const meses = S.data.meses;
            const filtro = hayFiltro();
            const act = partidasVista().filter(partidaActiva);
            const serie = (fuente, proy) => act.filter(p => p.fuente === fuente && (!proy || p.proyecto === proy))
                .reduce((a, p) => addArr(a, p.serie), zeros());
            const ingFuente = Object.fromEntries(FUENTES_ING.map(([k]) => [k, serie(k)]));
            // «Otros ingresos» son del Fideicomiso, sin lote: solo cuentan en Consolidado sin filtros
            const otros = consolidado() && !filtro ? e.mensual.ingresos.otros : zeros();
            const ingSerie = FUENTES_ING.reduce((a, [k]) => addArr(a, ingFuente[k]), otros);
            const obrasMes = addArr(serie('obras'), serie('mantGeneral'));
            const retMes = serie('retenidos');

            let detalleIng = FUENTES_ING.map(([k, lab, col]) => [lab, sum(ingFuente[k]), col]);
            let detalleEgr;
            if (consolidado()) {
                if (!filtro) detalleIng.push(['Otros ingresos', sum(otros), '#94a3b8']);
                detalleEgr = [
                    ['Obras CJB', sum(serie('obras', 'CJB')), '#f97316'],
                    ['Obras CPAG', sum(serie('obras', 'CPAG')), '#fb923c'],
                    ['Reserva mant. general', sum(serie('mantGeneral')), '#fdba74'],
                    ['Retenidos', sum(retMes), '#fed7aa']
                ];
                if (!filtro) detalleEgr.push(['Gastos fijos', sum(e.mensual.egresos.gastosFijos), '#64748b']);
            } else {
                detalleIng = detalleIng.filter(([k, v]) => P === 'CPAG' ? v > 0.5 : k !== 'Licitaciones CPAG 2027');
                detalleEgr = [
                    ['Obras ' + P, sum(serie('obras')), '#f97316'],
                    ['Reserva mant. general', sum(serie('mantGeneral')), '#fdba74'],
                    ['Retenidos ' + P, sum(retMes), '#fed7aa']
                ];
            }

            const obrasAct = act.filter(p => p.fuente === 'obras' || p.fuente === 'mantGeneral');
            const contratos = obrasAct.filter(p => p.fuente === 'obras' && p.obra.totalHorizonte > 0).length;
            const reserva = obrasAct.some(p => p.fuente === 'mantGeneral' && p.obra.totalHorizonte > 0);
            const contrato = sum(obrasAct.filter(p => p.fuente === 'obras').map(p => p.obra.contrato));
            const adenda = sum(obrasAct.filter(p => p.fuente === 'obras').map(p => p.obra.adenda));

            // Lotes con movimiento: los de la vista que tienen alguna partida activa
            const clavesAct = new Set(act.map(p => p.clave));
            const lotes = Object.entries(e.lotes).filter(([k]) => proyectosVista().includes(proyDeClave(k)) && (!filtro || clavesAct.has(k)));
            const nLotes = Object.entries(S.data.maestro)
                .filter(([k, m]) => proyectosVista().includes(m.proyecto) && RE_LOTE.test(m.id)).length;
            const porCat = c => lotes.filter(([, l]) => l.categoria === c).length;

            // Flujo acumulado de la selección (ingresos − pagos a obras), para la tarjeta de caja
            let acc = 0;
            const acum = ingSerie.map((v, i) => (acc += v - obrasMes[i]));
            const iMin = acum.indexOf(Math.min(...acum));

            return {
                meses, filtro, ingSerie, obrasMes, retMes, detalleIng, detalleEgr,
                ing: sum(ingSerie), obras: sum(obrasMes), contratos, reserva, contrato, adenda, nLotes,
                nMov: lotes.length,
                nObra: porCat('obra'),
                nLic: porCat('adjudicada') + porCat('licitar') + porCat('opcional'),
                nCart: porCat('cartera') + porCat('legal'),
                acum, minAcum: acum[iMin], mesMinAcum: meses[iMin], negAcum: acum.filter(v => v < -0.5).length
            };
        }

        // Capas de la leyenda (sin aplicar filtros): conteo por categoría principal y monto por fuente
        function capasVista() {
            const e = esc();
            const P = proyectosVista();
            const lotes = Object.entries(e.lotes).filter(([k]) => P.includes(proyDeClave(k)));
            const cap = {};
            ORDEN_CAT.forEach(c => {
                const ls = lotes.filter(([, l]) => l.categoria === c);
                cap[c] = { n: ls.length, monto: 0, saldo: 0, apagados: ls.length > 0 && ls.every(([, l]) => l.atenuado) };
            });
            let obrasVirt = 0, ingVirt = 0;
            const virtuales = new Set();
            partidasVista().forEach(p => {
                const t = sum(p.serie);
                if (p.fuente === 'retenidos') return;
                const esObra = p.fuente === 'obras' || p.fuente === 'mantGeneral';
                if (p.capa === 'virtual') {
                    if (esObra) obrasVirt += t; else ingVirt += t;
                    if (t > 0.5) virtuales.add(p.clave + '|' + (p.obra?.obra || p.fuente));
                } else {
                    cap[p.capa].monto += t;
                }
                if (p.capa === 'legal' && p.fuente === 'cartera') cap.legal.saldo += p.cart.saldo;
            });
            return { cap, obrasVirt, ingVirt, nVirt: virtuales.size };
        }

        // ---------------------------------------------------------------- render general
        function render() {
            document.querySelectorAll('#segProyecto button').forEach(b => b.classList.toggle('on', b.dataset.v === S.proyecto));
            document.querySelectorAll('#segEscenario button').forEach(b => b.classList.toggle('on', b.dataset.v === S.escenario));
            escribirHash();
            renderStamp();
            renderMapas();
            renderObras();
            renderLicitaciones();
            actualizarFiltros();
        }

        // Todo lo que depende de la selección de lotes y de las capas de la leyenda
        function actualizarFiltros() {
            const T = totalesVista();
            renderSelbar(T);
            renderKpis(T);
            renderLeyenda();
            proyectosVista().forEach(pintarMapa);
            renderChart(T);
            renderBarras(T);
            marcarFilas();
            $('#btnReset').disabled = !T.filtro && consolidado();
            if (!T.filtro) verificarTotales(T);
        }

        function renderSelbar(T) {
            const bar = $('#selbar');
            if (!T.filtro) { bar.hidden = true; bar.innerHTML = ''; return; }
            const partes = [];
            if (S.selLotes.size) {
                const chips = [...S.selLotes].map(k => `<span class="chip">${h(k)}<button data-quitar="${h(k)}" title="Quitar de la selección">×</button></span>`).join(' ');
                partes.push(`<b>${S.selLotes.size} ${S.selLotes.size === 1 ? 'lote seleccionado' : 'lotes seleccionados'}:</b> ${chips}`);
            }
            const ocultas = CAPAS_FILTRO.filter(c => S.off.has(c)).map(c => c === 'virtual' ? 'Sin lote en el mapa' : CAT[c].label);
            if (ocultas.length) partes.push(`<b>Capas ocultas:</b> ${h(ocultas.join(', '))}`);
            bar.innerHTML = `🔎 ${partes.join(' · ')} <span>— las tarjetas, el gráfico y las barras muestran solo esto.</span>
                <button class="btn" data-reset>✕ Quitar filtros</button>`;
            bar.hidden = false;
        }

        function renderStamp() {
            const d = S.data;
            const g = d.generado ? new Date(d.generado) : null;
            const fecha = g ? `${String(g.getDate()).padStart(2, '0')}-${MESES_ES[g.getMonth()]}-${g.getFullYear()}` : '—';
            const m0 = d.meses[0].split('-'), m1 = d.meses[d.meses.length - 1].split('-');
            $('#stamp').innerHTML = `Período <b>${MESES_ES[+m0[1] - 1]}-${m0[0]} → ${MESES_ES[+m1[1] - 1]}-${m1[0]}</b> · cifras en RD$ millones<br>` +
                `Fuente: ${h(d.fuente)} · actualizado ${fecha}`;
        }

        function renderKpis(T) {
            const e = esc();
            const k = e.kpis;
            const P = S.proyecto;
            const f = T.filtro;
            const fc = f ? ' filtrado' : '';
            const nom = f ? 'de la selección' : (consolidado() ? 'del Fideicomiso' : 'del proyecto');
            const aporte = T.ing - T.obras;
            const fuentesSel = T.detalleIng.filter(r => r[1] > 0.5).map(r => `${h(r[0])} ${fmtM(r[1])}`).join(' · ');
            const fuentes = f ? (fuentesSel || 'Sin ingresos en la selección')
                : (consolidado() ? 'Cartera + licitaciones, CJB y CPAG' : `Cartera + licitaciones de lotes ${P}`);
            const obrasTx = `${T.contratos} ${T.contratos === 1 ? 'contrato' : 'contratos'} con pagos` + (T.reserva ? ' + reserva mant. general' : '') +
                (T.contrato > 0.5 ? `<br>Contratos ${fmtM(T.contrato)} · adendas ${fmtM(T.adenda)}` : '');
            const mesLargo = m => m ? fmtMes(m).replace(/-(\d\d)$/, '-20$1') : '—';
            const sinIni = Math.abs(k.saldoInicial) < 1;
            const pl = n => `${n} ${n === 1 ? 'mes' : 'meses'}`;
            const caja = !f ? `
                <div class="k caja"><h4>🏦 Caja del Fideicomiso (consolidado, incluye gastos fijos)</h4>
                    <div><p>Saldo más bajo</p><div class="v ${k.saldoMin < 0 ? 'neg' : 'pos'}">${fmtM(k.saldoMin)}</div>
                        <p>${mesLargo(k.mesSaldoMin)} · ${pl(k.mesesNegativos)} en negativo</p></div>
                    <div><p>Disponible para áreas (PACC)</p><div class="v">${fmtM(k.disponiblePACC)}</div>
                        <p>${sinIni ? '<span class="warn">Falta saldo inicial al 1-oct</span>' : 'Saldo inicial ' + fmtM(k.saldoInicial)}</p></div>
                </div>` : `
                <div class="k caja selcaja"><h4>📊 Flujo acumulado de la selección (ingresos − obras, sin gastos fijos)</h4>
                    <div><p>Punto más bajo</p><div class="v ${T.minAcum < 0 ? 'neg' : 'pos'}">${fmtM(T.minAcum)}</div>
                        <p>${mesLargo(T.mesMinAcum)} · ${pl(T.negAcum)} en negativo</p></div>
                    <div><p>Caja del Fideicomiso (referencia)</p><div class="v ${k.saldoMin < 0 ? 'neg' : 'pos'}">${fmtM(k.saldoMin)}</div>
                        <p>saldo más bajo ${mesLargo(k.mesSaldoMin)} · PACC ${fmtM(k.disponiblePACC)}</p></div>
                </div>`;
            $('#kpis').innerHTML = `
                <div class="k${fc}"><h4>💵 Ingresos ${nom}</h4><div class="v ${T.ing > 0 ? 'pos' : ''}">${fmtM(T.ing)}</div><p>${fuentes}</p></div>
                <div class="k${fc}"><h4>🏗️ Pagos a obras ${f ? 'de la selección' : (consolidado() ? 'CJB + CPAG' : P)}</h4><div class="v">${fmtM(T.obras)}</div><p>${obrasTx}</p></div>
                <div class="k${fc}"><h4>📈 Aporte neto ${f ? 'de la selección' : (consolidado() ? 'de los proyectos' : P)}</h4><div class="v ${aporte >= 0 ? 'pos' : 'neg'}">${fmtM(aporte)}</div><p>Ingresos − obras (antes de gastos fijos)</p></div>
                <div class="k${fc}"><h4>🗺️ Lotes con movimiento${f ? ' · selección' : ''}</h4><div class="v">${T.nMov} <small>de ${T.nLotes}</small></div>
                    <p>${T.nObra} obras · ${T.nLic} a licitar/adjudicados · ${T.nCart} cartera</p></div>
                ${caja}`;
        }

        // ---------------------------------------------------------------- leyenda
        function renderLeyenda() {
            const { cap, obrasVirt, ingVirt, nVirt } = capasVista();
            const items = [];
            ORDEN_CAT.forEach(c => {
                const x = cap[c];
                if (!x.n && !x.monto) return;
                let p;
                if (c === 'obra') p = `${x.n} lotes · pagos <span class="mono">${fmtM(x.monto)}</span>`;
                else if (c === 'legal') p = `${x.n} lotes · saldo <span class="mono">${fmtM(x.saldo)}</span>` + (x.monto ? ` · recup. <span class="mono">${fmtM(x.monto)}</span>` : '');
                else if (x.apagados && !x.monto) p = `${x.n} lotes · apagados en el escenario`;
                else p = `${x.n} lotes · cobro <span class="mono">${fmtM(x.monto)}</span>`;
                const off = S.off.has(c) || (x.apagados && !x.monto);
                items.push(`<button class="li ${off ? 'off' : ''}" data-cat="${c}" aria-pressed="${!S.off.has(c)}">
                    <i style="background:${CAT[c].color}"></i><div><b>${CAT[c].label}</b><p>${p}</p></div></button>`);
            });
            if (obrasVirt || ingVirt) {
                const partes = [];
                if (obrasVirt) partes.push(`obras <span class="mono">${fmtM(obrasVirt)}</span>`);
                if (ingVirt) partes.push(`ingresos <span class="mono">${fmtM(ingVirt)}</span>`);
                items.push(`<button class="li ${S.off.has('virtual') ? 'off' : ''}" data-cat="virtual" aria-pressed="${!S.off.has('virtual')}">
                    <i style="background:transparent;border:1px dashed var(--mut)"></i><div><b>Sin lote en el mapa</b>
                    <p>${nVirt} partidas generales o con ubicación por confirmar · ${partes.join(' · ')}</p></div></button>`);
            }
            items.push(`<button class="li ${S.off.has('ninguno') ? 'off' : ''}" data-cat="ninguno">
                <i style="background:var(--lot-neutral);border:1px solid var(--line)"></i><div><b>Sin movimiento</b><p>resto de lotes</p></div></button>`);
            items.push(`<p class="hint">Clic en la leyenda para mostrar u ocultar cada capa (también filtra las tarjetas).<br>
                Lotes: clic para verlo solo · <b>Ctrl+clic</b> para sumar o quitar varios.</p>`);
            $('#leg').innerHTML = items.join('');
        }

        // ---------------------------------------------------------------- mapas
        async function cargarSvg(p) {
            if (!S.svgText[p]) {
                const r = await fetch(PROYECTOS[p].svg);
                if (!r.ok) throw new Error(`No se pudo cargar ${PROYECTOS[p].svg} (${r.status})`);
                S.svgText[p] = await r.text();
            }
            return S.svgText[p];
        }

        async function renderMapas() {
            const P = proyectosVista();
            const host = $('#maps');
            const titulo = consolidado() ? 'CJB + CPAG' : PROYECTOS[S.proyecto].nombre;
            $('#mapTitle').innerHTML = `Mapa de flujos · ${h(titulo)} <span>clic en un lote para verlo solo · Ctrl+clic para sumar varios</span>`;
            const clave = P.join('+');
            if (host.dataset.vista !== clave) {
                host.dataset.vista = clave;
                host.className = 'maps' + (P.length > 1 ? ' dos' : '');
                host.innerHTML = P.map(p => `<div class="map" data-p="${p}"><div class="svgbox"><div class="map-msg"><div class="spinner"></div></div></div></div>`).join('');
                S.maps = {};
                await Promise.all(P.map(p => montarMapa(p, host.querySelector(`.map[data-p="${p}"]`))));
            }
            P.forEach(pintarMapa);
        }

        async function montarMapa(p, cont) {
            try {
                const txt = await cargarSvg(p);
                if (!cont.isConnected) return;
                const box = cont.querySelector('.svgbox');
                box.innerHTML = txt;
                const svg = box.querySelector('svg');
                svg.removeAttribute('width');
                svg.removeAttribute('height');
                svg.classList.add('mapsvg');
                svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
                const lots = new Map();
                svg.querySelectorAll('[id]').forEach(el => {
                    if (RE_LOTE.test(el.id) && !lots.has(el.id)) { lots.set(el.id, el); el.classList.add('lote'); }
                });
                // Dibujo del DXF: sin rellenos de color (no confundir con las capas) y líneas en gris del tema
                svg.querySelectorAll('path, polygon, polyline, rect, circle, ellipse').forEach(el => {
                    if (el.classList.contains('lote') || el.closest('defs')) return;
                    const cs = getComputedStyle(el);
                    if (cs.fill !== 'none') el.style.fill = 'none';
                    if (cs.stroke !== 'none') el.style.stroke = 'var(--dxf-line)';
                });
                const bbox = encuadre(svg, lots);
                const m = { p, cont, svg, lots, bbox, vb: { ...bbox } };
                S.maps[p] = m;
                setVB(m);
                cont.insertAdjacentHTML('beforeend', `
                    <div class="zoom"><button data-z="in" title="Acercar">+</button><button data-z="out" title="Alejar">−</button><button data-z="reset" title="Encuadrar todo el plano">⟲</button><button data-z="mov" title="Acercar a los lotes con movimiento">◎</button></div>
                    <div class="map-label">${p} · ${h(PROYECTOS[p].nombre)}</div>
                    <div class="map-note" hidden></div>`);
                activarZoomPan(m);
                activarEventos(m);
            } catch (err) {
                console.error(err);
                cont.querySelector('.svgbox').innerHTML = `<div class="map-msg">⚠️ ${h(err.message)}</div>`;
            }
        }

        function notaMapa(p) {
            const e = esc();
            const m = S.maps[p];
            const claves = Object.keys(e.lotes).filter(k => proyDeClave(k) === p);
            const virt = e.obras.filter(o => o.proyecto === p && !o.enMapa && o.totalHorizonte > 0);
            const notas = [];
            if (!claves.length && virt.length) {
                notas.push(`Hoy no hay lotes ${p} en venta ni en cartera. Sus obras (${virt.map(o => h(o.obra)).join(', ')}) ` +
                    `no tienen todavía ID de vía: <b>ubicación por confirmar</b>. Se muestran en las tablas y los totales.`);
            }
            // Lotes con movimiento que el plano SVG no tiene dibujados (sí cuentan en tarjetas y tablas)
            const sinDibujo = m ? claves.filter(k => !m.lots.has(k.slice(p.length + 1))) : [];
            if (sinDibujo.length) {
                const desc = sinDibujo.map(k => {
                    const l = e.lotes[k], mae = S.data.maestro[k] || {};
                    return `<b>${h(k)}</b>${mae.tipo ? ' (' + h(mae.tipo) + ')' : ''} · ${l.categoria === 'obra' ? 'pagos ' + fmtM(l.egresos) : 'cobro ' + fmtM(l.ingresos)}`;
                }).join(', ');
                notas.push(`${sinDibujo.length === 1 ? 'Este lote con movimiento no está dibujado' : 'Estos lotes con movimiento no están dibujados'} en el plano: ${desc}. Sí cuentan en las tarjetas y tablas.`);
            }
            return notas.join('<br>');
        }

        // Caja de los lotes con movimiento del proyecto (para el botón ◎)
        function encuadreMovimiento(m) {
            const e = esc();
            const sub = new Map();
            Object.keys(e.lotes).forEach(k => {
                if (proyDeClave(k) !== m.p) return;
                const el = m.lots.get(k.slice(m.p.length + 1));
                if (el) sub.set(k, el);
            });
            if (!sub.size) return { ...m.bbox };
            const b = encuadre(m.svg, sub);
            // margen extra y relación de aspecto razonable para que no quede demasiado cerca
            const lado = Math.max(b.w, b.h, m.bbox.w / 6);
            const cx = b.x + b.w / 2, cy = b.y + b.h / 2;
            return { x: cx - lado * 0.6, y: cy - lado * 0.6, w: lado * 1.2, h: lado * 1.2 };
        }

        // Encuadre: caja que envuelve todos los lotes, en coordenadas del SVG raíz
        function encuadre(svg, lots) {
            const inv = svg.getScreenCTM()?.inverse();
            let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
            lots.forEach(el => {
                let b;
                try { b = el.getBBox(); } catch (_) { return; }
                if (!b.width && !b.height) return;
                const ctm = inv && el.getScreenCTM() ? inv.multiply(el.getScreenCTM()) : null;
                [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]].forEach(([x, y]) => {
                    let pt = { x, y };
                    if (ctm) pt = new DOMPoint(x, y).matrixTransform(ctm);
                    x0 = Math.min(x0, pt.x); y0 = Math.min(y0, pt.y); x1 = Math.max(x1, pt.x); y1 = Math.max(y1, pt.y);
                });
            });
            if (!isFinite(x0)) {
                const vb = svg.viewBox.baseVal;
                return { x: vb.x, y: vb.y, w: vb.width, h: vb.height };
            }
            const pad = Math.max(x1 - x0, y1 - y0) * 0.03;
            return { x: x0 - pad, y: y0 - pad, w: x1 - x0 + 2 * pad, h: y1 - y0 + 2 * pad };
        }

        function setVB(m) {
            m.svg.setAttribute('viewBox', `${m.vb.x} ${m.vb.y} ${m.vb.w} ${m.vb.h}`);
        }

        function zoomEn(m, f, cx, cy) {
            const vb = m.vb;
            const nw = Math.min(Math.max(vb.w * f, m.bbox.w / 12), m.bbox.w * 3);
            const k = nw / vb.w;
            vb.x = cx - (cx - vb.x) * k;
            vb.y = cy - (cy - vb.y) * k;
            vb.w *= k;
            vb.h *= k;
            setVB(m);
        }

        function puntoSvg(m, ev) {
            const ctm = m.svg.getScreenCTM();
            return new DOMPoint(ev.clientX, ev.clientY).matrixTransform(ctm.inverse());
        }

        function activarZoomPan(m) {
            const c = m.cont;
            c.querySelector('.zoom').addEventListener('click', ev => {
                const z = ev.target.closest('button')?.dataset.z;
                if (!z) return;
                ev.stopPropagation();
                const cx = m.vb.x + m.vb.w / 2, cy = m.vb.y + m.vb.h / 2;
                if (z === 'in') zoomEn(m, 0.7, cx, cy);
                else if (z === 'out') zoomEn(m, 1 / 0.7, cx, cy);
                else if (z === 'mov') { m.vb = encuadreMovimiento(m); setVB(m); }
                else { m.vb = { ...m.bbox }; setVB(m); }
            });
            c.addEventListener('wheel', ev => {
                ev.preventDefault();
                const pt = puntoSvg(m, ev);
                zoomEn(m, ev.deltaY > 0 ? 1.15 : 1 / 1.15, pt.x, pt.y);
            }, { passive: false });
            let drag = null;
            c.addEventListener('pointerdown', ev => {
                if (ev.button !== 0 || ev.target.closest('.zoom, .ficha')) return;
                drag = { x: ev.clientX, y: ev.clientY, vb: { ...m.vb }, mov: false, k: m.svg.getScreenCTM().a };
            });
            window.addEventListener('pointermove', ev => {
                if (!drag) return;
                const dx = ev.clientX - drag.x, dy = ev.clientY - drag.y;
                if (!drag.mov && Math.hypot(dx, dy) < 4) return;
                drag.mov = true;
                c.classList.add('drag');
                m.vb.x = drag.vb.x - dx / drag.k;
                m.vb.y = drag.vb.y - dy / drag.k;
                setVB(m);
            });
            window.addEventListener('pointerup', () => {
                if (drag?.mov) m.suprimirClic = true;
                drag = null;
                c.classList.remove('drag');
            });
        }

        function activarEventos(m) {
            const tip = $('#tip');
            m.svg.addEventListener('pointermove', ev => {
                const el = ev.target.closest('.lote');
                if (!el) { tip.style.display = 'none'; return; }
                tip.innerHTML = tooltipHTML(m.p + '-' + el.id);
                tip.style.display = 'block';
                const r = tip.getBoundingClientRect();
                tip.style.left = Math.min(ev.clientX + 14, innerWidth - r.width - 8) + 'px';
                tip.style.top = Math.min(ev.clientY + 14, innerHeight - r.height - 8) + 'px';
            });
            m.svg.addEventListener('pointerleave', () => { tip.style.display = 'none'; });
            m.svg.addEventListener('click', ev => {
                if (m.suprimirClic) { m.suprimirClic = false; return; }
                const el = ev.target.closest('.lote');
                if (el) clicLote(m.p + '-' + el.id, ev.ctrlKey || ev.metaKey || ev.shiftKey, false);
                else cerrarFicha();
            });
        }

        function pintarMapa(p) {
            const m = S.maps[p];
            if (!m) return;
            const e = esc();
            const neutral = cssVar('--lot-neutral');
            const stroke = cssVar('--lot-stroke');
            const haySel = S.selLotes.size > 0;
            m.lots.forEach((el, id) => {
                const clave = p + '-' + id;
                const l = e.lotes[clave];
                const enSel = S.selLotes.has(clave);
                let fill = neutral, op = 1;
                if (l && !S.off.has(l.categoria)) {
                    fill = CAT[l.categoria].color;
                    op = l.atenuado ? 0.35 : 0.92;
                    if (haySel && !enSel) op = Math.min(op, 0.25);   // fuera de la selección: atenuado
                } else if (!l && S.off.has('ninguno')) {
                    op = 0.15;
                }
                el.style.fill = fill;
                el.style.fillOpacity = op;
                el.style.stroke = stroke;
                el.style.strokeWidth = '0.6';
                el.classList.toggle('selm', enSel);
                el.classList.toggle('sel', S.sel === clave);
            });
            const nota = m.cont.querySelector('.map-note');
            if (nota) {
                const txt = notaMapa(p);
                nota.innerHTML = txt;
                nota.hidden = !txt;
            }
            const f = m.cont.querySelector('.ficha');
            if (f && S.sel && proyDeClave(S.sel) === p) f.outerHTML = fichaHTML(S.sel);
            else if (f) f.remove();
        }

        function tooltipHTML(clave) {
            const e = esc();
            const l = e.lotes[clave];
            const mae = S.data.maestro[clave] || {};
            const nombre = mae.nombre || '';
            if (!l) return `<b>${h(clave)}</b>${nombre ? ' · ' + h(nombre) : ''}<br>Sin movimiento en el período`;
            const monto = l.categoria === 'obra' ? `pagos ${fmtM(l.egresos)}` : `cobros ${fmtM(l.ingresos)}`;
            return `<b>${h(clave)}</b>${nombre ? ' · ' + h(nombre) : ''}<br>${CAT[l.categoria].titulo} · ${monto}`;
        }

        function fichaHTML(clave) {
            const e = esc();
            const meses = S.data.meses;
            const l = e.lotes[clave];
            const mae = S.data.maestro[clave] || {};
            const obras = e.obras.filter(o => o.clave === clave);
            const lics = e.licitaciones.filter(x => x.clave === clave);
            const cart = e.cartera.filter(c => c.clave === clave);
            const ret = e.retenidos.filter(r => r.clave === clave);
            const cat = l?.categoria;
            const filas = [];
            let titulo = mae.nombre || obras[0]?.obra || clave;
            let serie = null;
            if (cat === 'obra') {
                titulo = mae.nombre || obras.map(o => o.obra).join(' · ');
                if (obras.length > 1 || !mae.nombre) filas.push(['Obras', obras.map(o => o.obra).join(' · '), true]);
                filas.push(['Contratista', [...new Set(obras.map(o => o.contratista))].join(' · '), true]);
                const contr = obras.filter(o => o.tipo.toLowerCase() !== 'reserva');
                if (contr.length) {
                    filas.push(['Monto del contrato', fmtM(sum(contr.map(o => o.contrato)))]);
                    filas.push(['Adendas', fmtM(sum(contr.map(o => o.adenda)))]);
                }
                filas.push(['Restante por pagar', fmtM(sum(obras.map(o => o.restante)))]);
                filas.push([`Pagos ${fmtMes(meses[0])} → ${fmtMes(meses[14])}`, fmtM(sum(obras.map(o => o.totalHorizonte)))]);
                const r = sum(ret.map(x => x.totalHorizonte));
                if (r > 0.5) filas.push(['Devolución de retenidos', fmtM(r)]);
                const post = sum(obras.map(o => o.posterior)) + sum(ret.map(x => x.posterior));
                if (post > 0.5) filas.push(['Posterior (2028+)', fmtM(post)]);
                filas.push(['Próximo pago', proximo(l.egresosMes, meses)]);
                serie = l.egresosMes;
            } else if (cat === 'adjudicada' || cat === 'licitar' || cat === 'opcional') {
                const x = lics[0];
                filas.push(['Adjudicatario', x.adjudicatario || '— por licitar', true]);
                filas.push(['Grupo', x.grupo, true]);
                filas.push(['Área', fmtN(x.area) + ' m²']);
                filas.push(['Valor de venta', fmtM(x.valor)]);
                filas.push(['Firma', fmtFecha(x.fechaFirma)]);
                if (!x.incluida) filas.push(['En el escenario', 'Excluido', true]);
                else if (x.probabilidad < 1) filas.push(['Probabilidad', Math.round(x.probabilidad * 100) + '%']);
                filas.push([`Cobro ${fmtMes(meses[0])} → ${fmtMes(meses[14])}`, fmtM(x.cobroHorizonte)]);
                if (x.posterior > 0.5) filas.push(['Posterior (2028+)', fmtM(x.posterior)]);
                filas.push(['Próximo cobro', proximo(l.ingresosMes, meses)]);
                serie = l.ingresosMes;
            } else if (cat === 'cartera' || cat === 'legal') {
                const c = cart[0];
                filas.push(['Cliente', c.cliente, true]);
                filas.push(['Situación', c.situacion, true]);
                filas.push(['Saldo', fmtM(c.saldo)]);
                filas.push([`Cobro ${fmtMes(meses[0])} → ${fmtMes(meses[14])}`, fmtM(c.totalHorizonte)]);
                if (c.recupLegal > 0.5) filas.push([`Recuperación legal (${fmtMes(c.mesRecupLegal)})`, fmtM(c.recupLegal)]);
                if (c.posterior > 0.5) filas.push(['Posterior (2028+)', fmtM(c.posterior)]);
                filas.push(['Próximo cobro', proximo(l.ingresosMes, meses)]);
                serie = l.ingresosMes;
            } else {
                if (mae.tipo) filas.push(['Tipo', [mae.tipo, mae.subtipo].filter(Boolean).join(' · '), true]);
                if (mae.desarrollador) filas.push(['Desarrollador', mae.desarrollador, true]);
                if (mae.area) filas.push(['Área', fmtN(mae.area) + ' m²']);
                filas.push(['Flujo', 'Sin movimiento en el período', true]);
            }
            const color = cat ? CAT[cat].color : 'var(--mut)';
            const tx = cat ? (isLight() ? CAT[cat].fichaTx : CAT[cat].color) : 'var(--mut)';
            let bars = '';
            if (serie) {
                const mx = Math.max(...serie, 1);
                bars = `<div class="bars">${serie.map((v, i) => `<i style="height:${Math.max(2, v / mx * 100)}%;background:${v > 0.5 ? color : 'var(--track)'};opacity:${v > 0.5 ? .75 : 1}" title="${fmtMes(meses[i])} · ${fmtM(v)}"></i>`).join('')}</div>
                    <div class="ax"><span>${fmtMes(meses[0])}</span><span>${fmtMes(meses[14])}</span></div>`;
            }
            const otras = (l?.categorias || []).slice(1).map(c => CAT[c].label.toLowerCase());
            return `<div class="ficha" role="dialog" aria-label="Ficha del lote ${h(clave)}">
                <button class="x" title="Cerrar" onclick="cerrarFicha()">×</button>
                <div class="t" style="color:${tx}">${cat ? CAT[cat].titulo : 'Sin movimiento'} · ${h(clave)}</div>
                <h5>${h(titulo)}</h5>
                <table>${filas.map(([a, b, txt]) => `<tr><td>${h(a)}</td><td class="${txt ? 'txt' : ''}">${h(b)}</td></tr>`).join('')}</table>
                ${bars}
                ${otras.length ? `<div class="also">También: ${h(otras.join(', '))}</div>` : ''}
            </div>`;
        }

        // Clic en un lote (mapa o tabla): solo → ese lote queda seleccionado (otro clic lo suelta);
        // con Ctrl/Shift → se suma o se quita de la selección. La selección filtra tarjetas, gráfico y barras.
        function clicLote(clave, multiple, desdeTabla) {
            if (multiple) {
                if (S.selLotes.has(clave)) {
                    S.selLotes.delete(clave);
                    if (S.sel === clave) S.sel = null;
                } else {
                    S.selLotes.add(clave);
                    S.sel = clave;
                }
            } else if (S.selLotes.size === 1 && S.selLotes.has(clave)) {
                S.selLotes.clear();
                S.sel = null;
            } else {
                S.selLotes = new Set([clave]);
                S.sel = clave;
            }
            // Si el lote estaba en una capa oculta, se vuelve a mostrar esa capa
            const l = esc().lotes[clave];
            const capa = l ? l.categoria : (/^(CJB|CPAG)-/.test(clave) && RE_LOTE.test(clave.replace(/^(CJB|CPAG)-/, '')) ? null : 'virtual');
            if (S.sel === clave && capa && S.off.has(capa)) S.off.delete(capa);
            mostrarFicha();
            actualizarFiltros();
            const m = S.maps[proyDeClave(clave)];
            if (desdeTabla && S.sel === clave && m?.lots.has(clave.slice(proyDeClave(clave).length + 1))) {
                $('#cardMapa').scrollIntoView({ behavior: 'smooth', block: 'center' });
            }
        }

        // Abre la ficha del lote S.sel (si está dibujado en el mapa) y cierra las demás
        function mostrarFicha() {
            document.querySelectorAll('.ficha').forEach(f => f.remove());
            if (!S.sel) return;
            const p = proyDeClave(S.sel);
            const m = S.maps[p];
            if (m && m.lots.has(S.sel.slice(p.length + 1))) m.cont.insertAdjacentHTML('beforeend', fichaHTML(S.sel));
        }

        function cerrarFicha() {
            S.sel = null;
            document.querySelectorAll('.ficha').forEach(f => f.remove());
            proyectosVista().forEach(pintarMapa);
            marcarFilas();
        }

        function quitarDeSeleccion(clave) {
            S.selLotes.delete(clave);
            if (S.sel === clave) S.sel = null;
            mostrarFicha();
            actualizarFiltros();
        }

        // Botón «Quitar filtros»: sin selección, todas las capas visibles y vista Consolidado
        function quitarFiltros() {
            S.selLotes.clear();
            S.off.clear();
            S.sel = null;
            document.querySelectorAll('.ficha').forEach(f => f.remove());
            Object.values(S.maps).forEach(m => { m.vb = { ...m.bbox }; setVB(m); });
            if (S.proyecto !== 'Consolidado') { S.proyecto = 'Consolidado'; render(); }
            else actualizarFiltros();
        }

        // ---------------------------------------------------------------- gráficos
        function renderChart(T) {
            const e = esc();
            const labels = T.meses.map(fmtMes);
            const M = v => v / 1e6;
            let ing, egr, linea, lineaLbl, extra = [];
            if (T.filtro) {
                $('#c1Title').innerHTML = 'Ingresos vs. pagos a obras por mes <span>solo la selección</span>' +
                    `<a onclick="quitarFiltros()">quitar filtros →</a>`;
                ing = T.ingSerie;
                egr = T.obrasMes;
                linea = T.acum;
                lineaLbl = 'Aporte neto acumulado';
            } else if (consolidado()) {
                $('#c1Title').innerHTML = 'Ingresos vs. egresos por mes <span>caja consolidada del Fideicomiso</span>';
                ing = e.mensual.ingresos.total;
                egr = e.mensual.egresos.total;
                linea = e.mensual.saldo;
                lineaLbl = 'Saldo de caja';
                extra.push({
                    type: 'line', label: 'Colchón mínimo', data: e.mensual.colchon.map(M), borderColor: '#d97706',
                    borderDash: [5, 4], borderWidth: 1.5, pointRadius: 0, order: 0
                });
            } else {
                $('#c1Title').innerHTML = `Ingresos vs. pagos a obras por mes <span>solo ${h(S.proyecto)}</span>` +
                    `<a onclick="cambiarProyecto('Consolidado')">ver caja consolidada →</a>`;
                ing = T.ingSerie;
                egr = T.obrasMes;
                let acc = 0;
                linea = ing.map((v, i) => (acc += v - egr[i]));
                lineaLbl = 'Aporte neto acumulado';
            }
            const lc = cssVar('--chart-line'), bad = cssVar('--bad');
            const tick = cssVar('--tx2'), grid = cssVar('--chart-grid');
            const cfg = {
                data: {
                    labels,
                    datasets: [
                        {
                            type: 'line', label: lineaLbl, data: linea.map(M), borderColor: lc, backgroundColor: lc, borderWidth: 2.5,
                            pointRadius: 2, tension: 0, order: 0,
                            segment: { borderColor: c => (c.p1.parsed.y < 0 || c.p0.parsed.y < 0) ? bad : lc },
                            pointBackgroundColor: c => (c.parsed?.y < 0 ? bad : lc), pointBorderColor: c => (c.parsed?.y < 0 ? bad : lc)
                        },
                        ...extra,
                        { type: 'bar', label: 'Ingresos', data: ing.map(M), backgroundColor: '#22c55e', borderRadius: 3, order: 1 },
                        { type: 'bar', label: consolidado() && !T.filtro ? 'Egresos' : 'Pagos a obras', data: egr.map(M), backgroundColor: '#f97316', borderRadius: 3, order: 1 }
                    ]
                },
                options: {
                    animation: false,
                    maintainAspectRatio: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: { position: 'bottom', labels: { boxWidth: 10, color: tick, font: { family: 'Inter', size: 11 } } },
                        tooltip: { callbacks: { label: c => `${c.dataset.label}: ${c.parsed.y.toLocaleString('en-US', { minimumFractionDigits: 1, maximumFractionDigits: 1 })}` } }
                    },
                    scales: {
                        x: { grid: { display: false }, ticks: { color: tick, font: { size: 10 } } },
                        y: { grid: { color: grid }, ticks: { color: tick, font: { size: 10 } } }
                    }
                }
            };
            if (S.chart) S.chart.destroy();
            S.chart = new Chart($('#c1'), cfg);
        }

        function barrasHTML(titulo, filas, pie) {
            const visibles = filas.filter(r => r[1] > 0.5);
            const ceros = filas.filter(r => r[1] <= 0.5).map(r => r[0]);
            const mx = Math.max(...visibles.map(r => r[1]), 1);
            const m0 = fmtMes(S.data.meses[0]), m1 = fmtMes(S.data.meses[14]);
            let html = `<h3>${titulo} <span>${m0} → ${m1}</span></h3>`;
            if (!visibles.length) html += `<p class="empty">${hayFiltro() ? 'Sin montos en la selección.' : 'Sin montos en este proyecto para el escenario.'}</p>`;
            html += visibles.map(([n, v, c]) => `<div class="r"><span>${h(n)}</span><div class="t"><i style="width:${(v / mx * 100).toFixed(1)}%;background:${c}"></i></div><b class="mono">${fmtM(v)}</b></div>`).join('');
            if (ceros.length && visibles.length) html += `<p class="foot">En 0 en este escenario: ${h(ceros.join(', '))}.</p>`;
            if (pie) html += `<p class="foot">${pie}</p>`;
            return html;
        }

        function renderBarras(T) {
            $('#barsIn').innerHTML = barrasHTML('¿De dónde viene el dinero?', T.detalleIng);
            let pie = '';
            const gf = sum(esc().mensual.egresos.gastosFijos);
            if (T.filtro) pie = `Solo la selección. Los gastos fijos (${fmtM(gf)}) son del Fideicomiso y no se reparten por lote.`;
            else if (!consolidado()) pie = `Gastos fijos (${fmtM(gf)}) son comunes del Fideicomiso y no se reparten por proyecto.`;
            $('#barsOut').innerHTML = barrasHTML('¿A dónde va?', T.detalleEgr, pie);
        }

        // ---------------------------------------------------------------- tablas
        function ordenar(rows, sort, getters) {
            const g = getters[sort.k];
            return rows.sort((a, b) => {
                const x = g(a), y = g(b);
                return (typeof x === 'string' ? x.localeCompare(y, 'es') : x - y) * sort.dir;
            });
        }

        function thHTML(cols, sort) {
            return cols.map(([k, txt, cls]) =>
                `<th data-k="${k}" class="${cls || ''} ${sort.k === k ? 'sorted' + (sort.dir > 0 ? ' asc' : '') : ''}">${txt}</th>`).join('');
        }

        function renderObras() {
            const e = esc();
            const meses = S.data.meses;
            const todas = e.obras.filter(o => enVista(o.proyecto));
            const rows = todas.filter(o => o.totalHorizonte > 0.5);
            const resto = todas.filter(o => o.totalHorizonte <= 0.5);
            const getters = {
                obra: o => o.obra, contratista: o => o.contratista, contrato: o => o.contrato, adenda: o => o.adenda,
                restante: o => o.restante,
                proximo: o => { const i = o.pagos.findIndex(v => v > 0.5); return i < 0 ? 99 : i; }, pagos: o => o.totalHorizonte
            };
            ordenar(rows, S.sortObras, getters);
            const mx = Math.max(...rows.flatMap(o => o.pagos), 1);
            const titulo = consolidado() ? 'CJB + CPAG' : S.proyecto;
            const cols = [['obra', 'Obra'], ['contratista', 'Contratista'], ['contrato', 'Contrato', 'n'], ['adenda', 'Adenda', 'n'],
                ['restante', 'Restante', 'n'], ['proximo', 'Próximo pago', 'n'], ['pagos', 'Período', 'n'], ['heat', `Pagos ${fmtMes(meses[0])} → ${fmtMes(meses[14])}`]];
            const esReserva = o => o.tipo.toLowerCase() === 'reserva';
            $('#cardObras').innerHTML = `<h3>🏗️ Obras en ejecución · ${titulo} <span>ordenadas por pagos en el período</span></h3>
                <div class="tbwrap"><table class="tb" id="tbObras"><thead><tr>${thHTML(cols, S.sortObras)}</tr></thead><tbody>
                ${rows.map(o => `<tr data-clave="${h(o.clave)}" data-mapa="${o.enMapa}">
                    <td><b>${h(o.obra)}</b><span class="sub ${o.enMapa ? '' : 'porconf'}">${o.enMapa ? h(o.clave) : h(o.clave) + ' · ' + etiquetaVirtual(o.clave)}</span></td>
                    <td>${h(o.contratista)}</td>
                    <td class="n">${esReserva(o) ? '<span title="Reserva, no es un contrato">—</span>' : fmtM(o.contrato)}</td>
                    <td class="n">${esReserva(o) ? '—' : fmtM(o.adenda)}</td>
                    <td class="n">${fmtM(o.restante)}</td>
                    <td class="n">${proximo(o.pagos, meses)}</td>
                    <td class="n"><b>${fmtM(o.totalHorizonte)}</b></td>
                    <td><div class="heat">${o.pagos.map((v, i) => v > 0.5
                        ? `<i style="background:rgba(249,115,22,${(0.12 + 0.88 * v / mx).toFixed(2)})" title="${fmtMes(meses[i])} · ${fmtM(v)}"></i>` : '<i></i>').join('')}</div></td>
                </tr>`).join('')}
                </tbody><tfoot><tr><td colspan="2">Total</td>
                    <td class="n">${fmtM(sum(rows.filter(o => !esReserva(o)).map(o => o.contrato)))}</td>
                    <td class="n">${fmtM(sum(rows.filter(o => !esReserva(o)).map(o => o.adenda)))}</td>
                    <td class="n">${fmtM(sum(rows.map(o => o.restante)))}</td><td></td>
                    <td class="n">${fmtM(sum(rows.map(o => o.totalHorizonte)))}</td><td></td></tr></tfoot></table></div>
                ${resto.length ? `<p class="note">+ ${resto.length} obras sin pagos en el período (contratos ${fmtM(sum(resto.map(o => o.contrato)))} · adendas ${fmtM(sum(resto.map(o => o.adenda)))} · restante ${fmtM(sum(resto.map(o => o.restante)))}).</p>` : ''}
                <p class="note">Clic en una fila para ver solo esa obra · Ctrl+clic para sumar varias.</p>`;
            $('#tbObras thead').addEventListener('click', ev => cambiarOrden(ev, S.sortObras, renderObras));
            $('#tbObras tbody').addEventListener('click', clicFila);
            marcarFilas();
        }

        function chipLic(l) {
            const base = {
                'LIC 2026-01': ['Adjudicada', 'tg-adj'], 'LIC 2027-01': ['Por licitar 2027-01', 'tg-lic'],
                'ZFI 2027-02': ['ZFI 2027', 'tg-lic'], 'Lotes adicionales': ['Adicional', 'tg-op'],
                'CPAG HAB 2027': ['Por licitar · habitacional', 'tg-lic'], 'CPAG COM 2027': ['Por licitar · comercial', 'tg-lic']
            }[l.grupo] || [l.grupo, 'tg-off'];
            let extra = '';
            if (!l.incluida) extra = ' <em class="tag tg-off">Excluido</em>';
            else if (l.probabilidad === 0) extra = ' <em class="tag tg-off">Prob. 0%</em>';
            else if (l.probabilidad < 1) extra = ` <em class="tag tg-off">Prob. ${Math.round(l.probabilidad * 100)}%</em>`;
            return `<em class="tag ${base[1]}">${base[0]}</em>${extra}`;
        }

        function renderLicitaciones() {
            const e = esc();
            const rows = e.licitaciones.filter(l => enVista(l.proyecto));
            const titulo = consolidado() ? 'CJB + CPAG' : S.proyecto;
            const head = `<h3>🏷️ Lotes a licitar y adjudicados · ${titulo} <span>cobro dentro del período</span></h3>`;
            if (!rows.length) {
                $('#cardLic').innerHTML = head + `<p class="empty">Hoy no hay lotes ${h(S.proyecto)} en venta ni en cartera.</p>`;
                return;
            }
            const getters = {
                lote: l => l.id, estado: l => l.grupo, area: l => l.area, valor: l => l.valor,
                firma: l => l.fechaFirma || '', cobro: l => l.cobroHorizonte
            };
            ordenar(rows, S.sortLic, getters);
            const cols = [['lote', 'Lote'], ['estado', 'Estado'], ['area', 'Área m²', 'n'], ['valor', 'Valor', 'n'], ['firma', 'Firma', 'n'], ['cobro', 'Cobro', 'n']];
            $('#cardLic').innerHTML = head + `<div class="tbwrap"><table class="tb" id="tbLic"><thead><tr>${thHTML(cols, S.sortLic)}</tr></thead><tbody>
                ${rows.map(l => `<tr data-clave="${h(l.clave)}" data-mapa="${l.enMapa}">
                    <td><b>${h(consolidado() ? l.clave : l.id)}</b><span class="sub">${h(l.adjudicatario || '—')}</span></td>
                    <td>${chipLic(l)}</td>
                    <td class="n">${fmtN(l.area)}</td>
                    <td class="n">${fmtM(l.valor)}</td>
                    <td class="n">${fmtFecha(l.fechaFirma)}</td>
                    <td class="n"><b>${fmtM(l.cobroHorizonte)}</b></td>
                </tr>`).join('')}
                </tbody><tfoot><tr><td colspan="5">Total cobro en el período</td><td class="n">${fmtM(sum(rows.map(l => l.cobroHorizonte)))}</td></tr></tfoot></table></div>`;
            $('#tbLic thead').addEventListener('click', ev => cambiarOrden(ev, S.sortLic, renderLicitaciones));
            $('#tbLic tbody').addEventListener('click', clicFila);
            marcarFilas();
        }

        function cambiarOrden(ev, sort, fn) {
            const k = ev.target.closest('th')?.dataset.k;
            if (!k || k === 'heat') return;
            if (sort.k === k) sort.dir *= -1; else { sort.k = k; sort.dir = ['obra', 'contratista', 'lote', 'estado', 'firma', 'proximo'].includes(k) ? 1 : -1; }
            fn();
        }

        function clicFila(ev) {
            const tr = ev.target.closest('tr[data-clave]');
            if (!tr) return;
            clicLote(tr.dataset.clave, ev.ctrlKey || ev.metaKey || ev.shiftKey, true);
            if (tr.dataset.mapa !== 'true') {
                // Partida sin lote dibujado: se selecciona igual (filtra las tarjetas), pero no hay ficha en el mapa
                const t = $('#tip');
                t.innerHTML = `<b>${h(tr.dataset.clave)}</b><br>Sin lote en el mapa (${etiquetaVirtual(tr.dataset.clave)}). Las tarjetas muestran esta partida.`;
                t.style.display = 'block';
                t.style.left = (ev.clientX + 12) + 'px';
                t.style.top = (ev.clientY + 12) + 'px';
                setTimeout(() => { t.style.display = 'none'; }, 2200);
            }
        }

        function marcarFilas() {
            document.querySelectorAll('.tb tbody tr').forEach(tr => tr.classList.toggle('sel', S.selLotes.has(tr.dataset.clave)));
        }

        // ---------------------------------------------------------------- control de cuadre
        // La suma de las capas (lotes en el mapa + «ubicación por confirmar») debe dar los KPIs.
        // Además, sin filtros, las tarjetas (calculadas desde las partidas) deben dar lo publicado por el Excel.
        function verificarTotales(T) {
            const e = esc();
            const { cap, obrasVirt, ingVirt } = capasVista();
            const obrasCapas = cap.obra.monto + obrasVirt;
            const ingCapas = ['adjudicada', 'licitar', 'opcional', 'cartera', 'legal'].reduce((a, c) => a + cap[c].monto, 0) + ingVirt;
            const otros = consolidado() ? sum(e.mensual.ingresos.otros) : 0;
            let ingExcel, obrasExcel;
            if (consolidado()) {
                ingExcel = e.kpis.ingresos;
                obrasExcel = sum(e.mensual.egresos.obrasCJB) + sum(e.mensual.egresos.obrasCPAG) + sum(e.mensual.egresos.mantGeneral);
            } else {
                const pp = e.porProyecto[S.proyecto] || { ingresos: {}, egresos: {} };
                ingExcel = sum(pp.ingresos.total);
                obrasExcel = sum(pp.egresos.obras) + sum(pp.egresos.mantGeneral);
            }
            const ok = [obrasCapas - T.obras, ingCapas + otros - T.ing, ingExcel - T.ing, obrasExcel - T.obras].every(d => Math.abs(d) < 1);
            const msg = `[Flujo 2027] ${S.proyecto} · ${S.escenario}: ingresos tarjeta ${fmtM(T.ing)} · capas ${fmtM(ingCapas + otros)} · Excel ${fmtM(ingExcel)}` +
                ` | obras tarjeta ${fmtM(T.obras)} · capas ${fmtM(obrasCapas)} · Excel ${fmtM(obrasExcel)}`;
            if (ok) console.info('✔ ' + msg); else console.warn('✖ ' + msg);
            return ok;
        }

        // ---------------------------------------------------------------- acciones
        function cambiarProyecto(p) {
            if (p === S.proyecto) return;
            S.proyecto = p;
            S.sel = null;
            S.selLotes.clear();
            render();
        }

        function actualizarBotonTema() {
            const b = $('#themeToggle');
            const light = isLight();
            b.querySelector('.ico').textContent = light ? '🌙' : '☀️';
            b.querySelector('.txt').textContent = light ? 'Modo oscuro' : 'Modo claro';
        }

        function exportarPDF() {
            const acts = document.querySelectorAll('.acts, .header-nav, .zoom');
            acts.forEach(el => el.style.visibility = 'hidden');
            const opts = {
                margin: 6,
                filename: `Flujo_2027_${S.proyecto}_${S.escenario}_${new Date().toISOString().split('T')[0]}.pdf`,
                image: { type: 'jpeg', quality: 0.95 },
                html2canvas: { scale: 2, useCORS: true, logging: false, backgroundColor: cssVar('--bg') },
                jsPDF: { unit: 'mm', format: 'a3', orientation: 'landscape' }
            };
            html2pdf().set(opts).from(document.body).save().finally(() => acts.forEach(el => el.style.visibility = ''));
        }

        function enlazarControles() {
            $('#segProyecto').addEventListener('click', ev => {
                const v = ev.target.closest('button')?.dataset.v;
                if (v) cambiarProyecto(v);
            });
            $('#segEscenario').addEventListener('click', ev => {
                const v = ev.target.closest('button')?.dataset.v;
                if (v && v !== S.escenario) { S.escenario = v; render(); }
            });
            $('#leg').addEventListener('click', ev => {
                const c = ev.target.closest('button.li')?.dataset.cat;
                if (!c) return;
                if (S.off.has(c)) S.off.delete(c); else S.off.add(c);
                actualizarFiltros();
            });
            $('#btnReset').addEventListener('click', quitarFiltros);
            $('#selbar').addEventListener('click', ev => {
                const q = ev.target.closest('[data-quitar]')?.dataset.quitar;
                if (q) quitarDeSeleccion(q);
                else if (ev.target.closest('[data-reset]')) quitarFiltros();
            });
            $('#themeToggle').addEventListener('click', () => document.body.classList.toggle('light-mode'));
            $('#btnFullscreen').addEventListener('click', () => {
                if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen?.();
            });
            $('#btnPdf').addEventListener('click', exportarPDF);
            document.addEventListener('keydown', ev => { if (ev.key === 'Escape') cerrarFicha(); });
            window.addEventListener('hashchange', () => {
                const antes = S.proyecto;
                leerHash();
                if (S.proyecto !== antes) { S.sel = null; S.selLotes.clear(); }
                render();
            });
            // Al cambiar el tema: repintar mapas y gráfico con los colores del tema
            new MutationObserver(() => {
                actualizarBotonTema();
                if (!S.data) return;
                proyectosVista().forEach(pintarMapa);
                renderChart(totalesVista());
            }).observe(document.body, { attributes: true, attributeFilter: ['class'] });
        }

        async function iniciar() {
            leerHash();
            actualizarBotonTema();
            enlazarControles();
            try {
                const r = await fetch(DATA_URL, { cache: 'no-store' });
                if (!r.ok) throw new Error(`HTTP ${r.status}`);
                S.data = await r.json();
            } catch (err) {
                console.error('No se pudo leer ' + DATA_URL, err);
                $('#contenido').innerHTML = `<div class="card error-card"><h3>⚠️ No se encontraron los datos del flujo</h3>
                    <p>Ejecute <b>«Actualizar Flujo 2027.bat»</b> (raíz de Mapa) para generar <b>${DATA_URL}</b> desde el Excel,
                    y abra esta página con <b>SISTEMA_VBC.bat</b> (http://127.0.0.1:9000/flujo-2027.html).</p><code>${h(err.message)}</code></div>`;
                return;
            }
            render();
        }

        window.FlujoVBC = { S, totalesVista, clicLote, quitarFiltros, verificarTotales: () => verificarTotales(totalesVista()) };
        document.addEventListener('DOMContentLoaded', iniciar);
    </script>
</body>

</html>
