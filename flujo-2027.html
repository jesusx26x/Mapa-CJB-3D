<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flujo 2027 - Fideicomiso VBC-RD</title>
    <meta name="view-transition" content="same-origin">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        /* ============ VARIABLES (oscuro por defecto, igual que css/styles.css) ============ */
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --card-2: #172033;
            --line: rgba(255, 255, 255, 0.1);
            --line-soft: rgba(255, 255, 255, 0.05);
            --tx: #f1f5f9;
            --tx2: #94a3b8;
            --mut: #64748b;
            --pri: #00a8ff;
            --pri-soft: rgba(0, 168, 255, 0.15);
            --pri-line: rgba(0, 168, 255, 0.45);
            --ok: #10b981;
            --bad: #f87171;
            --track: #0f172a;
            --map-bg: #0b1220;
            --lot-neutral: #1e293b;
            --lot-stroke: #0b1220;
            --dxf-line: #475569;
            --sc-on-bg: #f1f5f9;
            --sc-on-tx: #0f172a;
            --caja-bg: linear-gradient(135deg, rgba(249, 115, 22, 0.16), rgba(30, 41, 59, 0.9));
            --caja-line: rgba(249, 115, 22, 0.45);
            --caja-h: #fdba74;
            --shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
            --chart-line: #e2e8f0;
            --chart-grid: rgba(255, 255, 255, 0.06);
        }

        body.light-mode {
            --bg: #f1f5f9;
            --card: #ffffff;
            --card-2: #f8fafc;
            --line: #e2e8f0;
            --line-soft: #f1f5f9;
            --tx: #0f172a;
            --tx2: #475569;
            --mut: #94a3b8;
            --pri: #0066cc;
            --pri-soft: #e0efff;
            --pri-line: #b6d7ff;
            --ok: #059669;
            --bad: #dc2626;
            --track: #f1f5f9;
            --map-bg: #f8fafc;
            --lot-neutral: #e9edf2;
            --lot-stroke: #ffffff;
            --dxf-line: #94a3b8;
            --sc-on-bg: #0f172a;
            --sc-on-tx: #ffffff;
            --caja-bg: linear-gradient(135deg, #fff7ed, #ffffff);
            --caja-line: #fed7aa;
            --caja-h: #9a3412;
            --shadow: 0 12px 30px rgba(15, 23, 42, 0.18);
            --chart-line: #0f172a;
            --chart-grid: #eef2f6;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: Inter, 'Segoe UI', system-ui, sans-serif;
            background: var(--bg);
            color: var(--tx);
            font-size: 13px;
            min-height: 100vh;
        }

        .mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
        button { font-family: inherit; }

        /* ============ HEADER ============ */
        .header {
            display: flex;
            align-items: center;
            gap: 18px;
            padding: 10px 20px;
            background: var(--card);
            border-bottom: 1px solid var(--line);
            box-shadow: 0 1px 3px rgba(15, 23, 42, 0.05);
            position: sticky;
            top: 0;
            z-index: 50;
            flex-wrap: wrap;
        }

        .logo { display: flex; align-items: center; gap: 10px; }
        .logo-box {
            width: 38px; height: 38px; border-radius: 10px;
            background: linear-gradient(135deg, #0066cc, #00a8ff);
            display: grid; place-items: center; font-size: 20px;
        }
        .logo h1 { font-size: 14px; line-height: 1.15; }
        .logo p { font-size: 10px; color: var(--mut); }

        .header-nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
        .header-nav a {
            padding: 8px 12px; border-radius: 8px; color: var(--tx2); text-decoration: none;
            font-weight: 600; font-size: 12px; border: 1px solid transparent; white-space: nowrap;
        }
        .header-nav a:hover { background: var(--pri-soft); color: var(--pri); }
        .header-nav a.active { background: var(--pri-soft); color: var(--pri); border-color: var(--pri-line); }
        .header-nav a.new::after {
            content: 'NUEVO'; font-size: 8px; background: var(--pri); color: #fff;
            border-radius: 4px; padding: 1px 4px; margin-left: 6px; vertical-align: 2px;
        }

        .acts { display: flex; gap: 8px; }
        .btn {
            border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 8px 12px;
            font-weight: 600; font-size: 12px; color: var(--tx2); cursor: pointer; white-space: nowrap;
        }
        .btn:hover { border-color: var(--pri-line); color: var(--pri); }
        .btn.pri { background: var(--pri); color: #fff; border-color: var(--pri); }
        .btn.pri:hover { filter: brightness(1.08); color: #fff; }
        .btn:disabled { opacity: .45; cursor: default; }
        .btn:disabled:hover { border-color: var(--line); color: var(--tx2); }

        /* Barra de selección / filtros activos */
        .selbar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0 20px 12px; padding: 8px 12px;
            background: var(--pri-soft); border: 1px solid var(--pri-line); border-radius: 10px; font-size: 12px; color: var(--tx2);
        }
        .selbar[hidden] { display: none; }
        .selbar b { color: var(--tx); }
        .selbar .chip {
            display: inline-flex; align-items: center; gap: 2px; background: var(--card); border: 1px solid var(--line);
            border-radius: 20px; padding: 2px 3px 2px 9px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--tx);
        }
        .selbar .chip button { border: 0; background: none; color: var(--mut); cursor: pointer; font-size: 14px; line-height: 1; padding: 0 4px; }
        .selbar .chip button:hover { color: var(--bad); }
        .selbar .btn { margin-left: auto; padding: 5px 10px; }

        /* ============ TOOLBAR ============ */
        .toolbar { display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-wrap: wrap; }
        .seg { display: flex; background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 3px; }
        .seg button {
            padding: 7px 14px; border-radius: 7px; font-size: 12px; color: var(--tx2); font-weight: 600;
            border: 0; background: none; cursor: pointer;
        }
        .seg button:hover { color: var(--tx); }
        .seg button.on { background: var(--pri); color: #fff; box-shadow: 0 2px 6px rgba(0, 102, 204, 0.3); }
        .seg.sc button.on { background: var(--sc-on-bg); color: var(--sc-on-tx); box-shadow: none; }
        .lbl { font-size: 10px; font-weight: 700; color: var(--mut); letter-spacing: .06em; text-transform: uppercase; margin-right: -8px; }
        .stamp { margin-left: auto; font-size: 11px; color: var(--mut); text-align: right; line-height: 1.5; }
        .stamp b { color: var(--tx2); }

        /* ============ KPIs ============ */
        .kpis { display: grid; grid-template-columns: repeat(4, 1fr) 1.35fr; gap: 12px; padding: 0 20px; }
        .k { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
        .k h4 { font-size: 11px; color: var(--tx2); font-weight: 600; }
        .k .v { font-family: 'JetBrains Mono', monospace; font-size: 24px; font-weight: 700; margin-top: 6px; }
        .k .v small { font-size: 12px; color: var(--mut); font-weight: 500; }
        .k p { font-size: 11px; color: var(--mut); margin-top: 3px; }
        .k.caja { background: var(--caja-bg); border-color: var(--caja-line); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .k.caja h4 { grid-column: 1 / 3; color: var(--caja-h); }
        .k.caja.selcaja { background: var(--card); border-color: var(--pri-line); }
        .k.caja.selcaja h4 { color: var(--pri); }
        .k.filtrado { border-color: var(--pri-line); box-shadow: inset 3px 0 0 var(--pri); }
        .k .warn { color: #d97706; font-weight: 600; }
        .neg { color: var(--bad); }
        .pos { color: var(--ok); }

        /* ============ GRID PRINCIPAL ============ */
        .grid { display: grid; grid-template-columns: 1.25fr 1fr; gap: 12px; padding: 12px 20px; }
        .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; position: relative; min-width: 0; }
        .card h3 { font-size: 13px; font-weight: 700; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
        .card h3 span { font-weight: 500; color: var(--mut); font-size: 11px; }
        .card h3 a { margin-left: auto; font-size: 11px; font-weight: 600; color: var(--pri); text-decoration: none; cursor: pointer; }

        .mapwrap { display: grid; grid-template-columns: 1fr 210px; gap: 12px; margin-top: 10px; height: 600px; }
        .maps { display: grid; gap: 10px; min-width: 0; }
        .maps.dos { grid-template-columns: 1fr 1fr; }
        .map {
            background: var(--map-bg); border: 1px solid var(--line); border-radius: 10px;
            overflow: hidden; position: relative; min-width: 0; touch-action: none; cursor: grab;
        }
        .map.drag { cursor: grabbing; }
        .map .svgbox { position: absolute; inset: 0; }
        .mapsvg { width: 100%; height: 100%; display: block; }
        .mapsvg text, .mapsvg tspan, .mapsvg use { display: none; }
        .mapsvg .lote { cursor: pointer; transition: fill-opacity .15s; }
        .mapsvg .lote:hover { fill-opacity: .75 !important; }
        .mapsvg .lote.sel { stroke: #0f172a !important; stroke-width: 2.2px !important; }
        body:not(.light-mode) .mapsvg .lote.sel { stroke: #ffffff !important; }
        .mapsvg .lote.selm { stroke: #0f172a !important; stroke-width: 1.4px !important; }
        body:not(.light-mode) .mapsvg .lote.selm { stroke: #ffffff !important; }
        .map-label {
            position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); z-index: 3;
            padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 700;
            background: var(--card); border: 1px solid var(--line); color: var(--tx2); white-space: nowrap;
        }
        .map-note {
            position: absolute; left: 10px; right: 50px; bottom: 40px; z-index: 3; font-size: 11px; color: var(--tx2);
            background: var(--card); border: 1px dashed var(--line); border-radius: 8px; padding: 8px 10px;
        }
        .map-msg { display: grid; place-items: center; height: 100%; color: var(--mut); text-align: center; padding: 20px; }
        .spinner { width: 34px; height: 34px; border: 3px solid var(--line); border-top-color: var(--pri); border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }

        .zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; z-index: 4; }
        .zoom button {
            width: 28px; height: 28px; background: var(--card); border: 1px solid var(--line); border-radius: 7px;
            display: grid; place-items: center; color: var(--tx2); cursor: pointer; font-size: 14px;
        }
        .zoom button:hover { color: var(--pri); border-color: var(--pri-line); }

        /* Ficha flotante */
        .ficha {
            position: absolute; left: 12px; top: 12px; width: 250px; z-index: 5; max-height: calc(100% - 24px); overflow: auto;
            background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow);
            padding: 12px 14px; cursor: default;
        }
        .ficha .t { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; padding-right: 18px; }
        .ficha h5 { font-size: 14px; margin: 2px 0 6px; line-height: 1.25; }
        .ficha .x { position: absolute; right: 8px; top: 6px; border: 0; background: none; color: var(--mut); font-size: 18px; cursor: pointer; line-height: 1; }
        .ficha .x:hover { color: var(--tx); }
        .ficha table { width: 100%; font-size: 11px; border-collapse: collapse; }
        .ficha td { padding: 2px 0; color: var(--tx2); vertical-align: top; }
        .ficha td:last-child { text-align: right; font-family: 'JetBrains Mono', monospace; color: var(--tx); font-weight: 600; padding-left: 8px; }
        .ficha td.txt { font-family: Inter, sans-serif; font-weight: 600; }
        .ficha .bars { display: flex; gap: 2px; align-items: flex-end; height: 34px; margin-top: 8px; }
        .ficha .bars i { flex: 1; border-radius: 2px 2px 0 0; min-height: 1px; }
        .ficha .ax { display: flex; justify-content: space-between; font-size: 9px; color: var(--mut); }
        .ficha .also { font-size: 10px; color: var(--mut); margin-top: 6px; }

        .tip {
            position: fixed; z-index: 100; pointer-events: none; display: none; max-width: 260px;
            background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
            padding: 6px 9px; font-size: 11px; color: var(--tx2);
        }
        .tip b { color: var(--tx); }

        /* Leyenda */
        .leg { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
        .li {
            display: grid; grid-template-columns: 14px 1fr; gap: 8px; padding: 8px 10px; border: 1px solid var(--line);
            border-radius: 9px; background: var(--card); cursor: pointer; text-align: left; color: var(--tx); font: inherit;
        }
        .li:hover { border-color: var(--pri-line); }
        .li i { width: 12px; height: 12px; border-radius: 3px; margin-top: 2px; }
        .li b { font-size: 12px; }
        .li p { font-size: 11px; color: var(--tx2); }
        .li .mono { font-size: 12px; font-weight: 700; }
        .li.off { opacity: .45; }
        .li.info { cursor: default; border-style: dashed; }
        .hint { font-size: 11px; color: var(--mut); margin-top: 6px; }

        .right { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
        .bars2 .r { display: grid; grid-template-columns: 140px 1fr 70px; align-items: center; gap: 8px; margin: 7px 0; font-size: 12px; }
        .bars2 .t { height: 14px; background: var(--track); border-radius: 4px; overflow: hidden; }
        .bars2 .t i { display: block; height: 100%; border-radius: 4px; }
        .bars2 .r b { text-align: right; }
        .bars2 .foot { font-size: 11px; color: var(--mut); margin-top: 4px; }
        .empty { color: var(--mut); font-size: 12px; padding: 14px 0; }

        /* ============ TABLAS ============ */
        .tables { display: grid; grid-template-columns: 1.45fr 1fr; gap: 12px; padding: 0 20px 20px; }
        .tbwrap { overflow-x: auto; }
        table.tb { width: 100%; border-collapse: collapse; margin-top: 8px; }
        .tb th {
            font-size: 10px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); text-align: left;
            padding: 6px; border-bottom: 1px solid var(--line); white-space: nowrap; cursor: pointer; user-select: none;
        }
        .tb th:hover { color: var(--tx2); }
        .tb th.sorted::after { content: ' ▾'; }
        .tb th.sorted.asc::after { content: ' ▴'; }
        .tb td { padding: 7px 6px; border-bottom: 1px solid var(--line-soft); font-size: 12px; vertical-align: middle; }
        .tb td span.sub { display: block; font-size: 10px; color: var(--mut); }
        .tb td span.porconf { color: #d97706; }
        .tb tbody tr { cursor: pointer; }
        .tb tbody tr:hover td { background: var(--pri-soft); }
        .tb tbody tr.sel td { background: var(--pri-soft); }
        .tb tfoot td { font-weight: 700; border-bottom: 0; border-top: 1px solid var(--line); }
        .tb .n { text-align: right; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; white-space: nowrap; }
        .tb th.n { text-align: right; }
        .heat { display: grid; grid-template-columns: repeat(15, 1fr); gap: 2px; width: 150px; }
        .heat i { height: 14px; border-radius: 2px; background: var(--track); }
        .tag { font-style: normal; font-size: 10px; font-weight: 700; padding: 3px 7px; border-radius: 20px; white-space: nowrap; display: inline-block; margin: 1px 0; }
        .tg-adj { background: #ccfbf1; color: #0f766e; }
        .tg-lic { background: #dcfce7; color: #15803d; }
        .tg-op { background: #ecfccb; color: #4d7c0f; }
        .tg-off { background: #f1f5f9; color: #64748b; }
        body:not(.light-mode) .tg-adj { background: rgba(13, 148, 136, .2); color: #5eead4; }
        body:not(.light-mode) .tg-lic { background: rgba(34, 197, 94, .18); color: #86efac; }
        body:not(.light-mode) .tg-op { background: rgba(163, 230, 53, .15); color: #bef264; }
        body:not(.light-mode) .tg-off { background: rgba(148, 163, 184, .15); color: #94a3b8; }
        .note { font-size: 11px; color: var(--mut); margin-top: 8px; }

        .error-card { margin: 40px auto; max-width: 560px; text-align: center; }
        .error-card h3 { justify-content: center; color: var(--bad); margin-bottom: 8px; }
        .error-card code { display: block; margin-top: 10px; font-size: 11px; color: var(--tx2); word-break: break-all; }

        @media (max-width: 1400px) {
            .heat { width: 96px; gap: 1px; }
        }

        @media (max-width: 1320px) {
            .tables { grid-template-columns: 1fr; }
            .heat { width: 170px; gap: 2px; }
        }

        @media (max-width: 1200px) {
            .kpis { grid-template-columns: repeat(2, 1fr); }
            .k.caja { grid-column: 1 / -1; }
            .grid, .tables { grid-template-columns: 1fr; }
        }

        @media (max-width: 720px) {
            .header, .toolbar { padding-left: 16px; padding-right: 16px; }
            .kpis, .grid, .tables { padding-left: 16px; padding-right: 16px; }
            .kpis { grid-template-columns: 1fr; }
            .header-nav { margin-left: 0; }
            .stamp { margin-left: 0; text-align: left; }
            .mapwrap { grid-template-columns: 1fr; height: auto; }
            .maps { height: 460px; }
            .maps.dos { grid-template-columns: 1fr; height: 820px; }
            .bars2 .r { grid-template-columns: 90px 1fr 60px; }
        }
    </style>
</head>

<body class="light-mode">
    <script src="vbc-core/vbc-theme-sync.js" data-default="light"></script>
    <header class="header">
        <div class="logo">
            <div class="logo-box">🏗️</div>
            <div>
                <h1>Fideicomiso VBC-RD</h1>
                <p>Flujo de Caja y Presupuesto 2027</p>
            </div>
        </div>
        <nav class="header-nav">

            <a href="MAPA NUEVO - CJB/evolucion.html" class="nav-link">Evolución</a>

    <main id="contenido">
        <div class="toolbar">
            <span class="lbl">Proyecto</span>

                <button data-v="CPAG">CPAG · Santiago</button>
